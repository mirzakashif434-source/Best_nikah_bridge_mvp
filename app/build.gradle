plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nikahbridge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nikahbridge'
        minSdk 24
        targetSdk 36
        versionCode 29
        versionName '2.5'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.guava:guava:31.0.1-android'
    // Microsoft Entra External ID is the production authentication authority.
    implementation 'com.microsoft.identity.client:msal:8.4.2'
}

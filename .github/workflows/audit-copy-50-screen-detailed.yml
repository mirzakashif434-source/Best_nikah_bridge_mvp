name: SAFE COPY - 50 Screen Detailed Source Report
on:
  push:
    branches: [audit/free-check-20261020]
    paths:
      - '.github/workflows/audit-copy-50-screen-detailed.yml'
      - '.github/scripts/audit_50_screen_reference_report.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-50:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check audit branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "audit/free-check-20261020"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Report and verify all 50 screen contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_50_screen_ultra_final.py
          python3 .github/scripts/verify_locked_feature_contracts.py
          python3 .github/scripts/audit_50_screen_reference_report.py
      - name: Compile app and run Lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Save per-screen report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-50-screen-report
          path: audit-50-screen-source-report.csv
          if-no-files-found: warn
          retention-days: 3

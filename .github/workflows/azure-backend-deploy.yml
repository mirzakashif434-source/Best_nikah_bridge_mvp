name: Azure Functions Additive Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'azure-backend/**'
      - '.github/workflows/azure-backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: bestnikahbredge-prod-fn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install --omit=dev
      - name: Validate backend entrypoint
        working-directory: azure-backend
        run: node --check src/index.js
      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to the existing Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: azure-backend
      - name: Verify live health endpoint
        run: |
          set -euo pipefail
          URL="https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS -o /tmp/health.json -w "%{http_code}" "$URL" || true)"
            echo "Attempt $i: HTTP $HTTP_CODE"
            cat /tmp/health.json || true
            if [ "$HTTP_CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "LIVE HEALTH CHECK: PASS"
              exit 0
            fi
            sleep 10
          done
          echo "LIVE HEALTH CHECK: FAIL"
          exit 1

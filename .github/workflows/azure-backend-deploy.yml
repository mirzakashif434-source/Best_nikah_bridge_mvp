name: Azure Functions Additive Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'azure-backend/**'
      - '.github/workflows/azure-backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: bestnikahbredge-prod-fn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install --omit=dev
      - name: Validate backend entrypoint
        working-directory: azure-backend
        run: node --check src/index.js
      - name: Validate Azure OIDC configuration
        env:
          ACTUAL_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ACTUAL_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ACTUAL_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          EXPECTED_TENANT_ID="28a6a643-bdbe-4d1a-8af1-332bc8b08ab1"
          EXPECTED_CLIENT_ID="8ce21967-71f5-4315-8074-3e10e998c673"
          EXPECTED_SUBSCRIPTION_ID="2da093f4-d57b-4088-8c7e-d73ef8fb7af6"
          test "$ACTUAL_TENANT_ID" = "$EXPECTED_TENANT_ID" || { echo "AZURE_TENANT_ID mismatch"; exit 1; }
          test "$ACTUAL_CLIENT_ID" = "$EXPECTED_CLIENT_ID" || { echo "AZURE_CLIENT_ID mismatch"; exit 1; }
          test "$ACTUAL_SUBSCRIPTION_ID" = "$EXPECTED_SUBSCRIPTION_ID" || { echo "AZURE_SUBSCRIPTION_ID mismatch"; exit 1; }
          curl -fsS "https://login.microsoftonline.com/$ACTUAL_TENANT_ID/v2.0/.well-known/openid-configuration" -o /dev/null
          echo "Azure tenant authority and GitHub secrets: PASS"
      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to the existing Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: azure-backend
      - name: Verify live health endpoint
        run: |
          set -euo pipefail
          URL="https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS -o /tmp/health.json -w "%{http_code}" "$URL" || true)"
            echo "Attempt $i: HTTP $HTTP_CODE"
            cat /tmp/health.json || true
            if [ "$HTTP_CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              echo "LIVE HEALTH CHECK: PASS"
              exit 0
            fi
            sleep 10
          done
          echo "LIVE HEALTH CHECK: FAIL"
          exit 1

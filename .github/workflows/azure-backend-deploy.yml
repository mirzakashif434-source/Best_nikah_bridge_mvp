name: Azure Functions Additive Backend Deploy

concurrency:
  group: azure-functions-additive-backend
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'azure-backend/**'
      - '.github/workflows/azure-backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: bestnikahbredge-prod-fn
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require production AdMob rewarded ad unit
        env:
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$ADMOB_REWARDED_AD_UNIT_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]+$ ]]; then
            echo "ADMOB_REWARDED_AD_UNIT_ID GitHub secret is missing or invalid."
            exit 1
          fi
          echo "ADMOB_REWARDED_AD_UNIT_ID: VALID"

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install --omit=dev
      - name: Validate all Azure backend modules
        working-directory: azure-backend
        run: |
          set -euo pipefail
          for file in src/*.js; do node --check "$file"; done
          node -e "require('./src/index.js'); console.log('AZURE MODULE LOAD: PASS')"
      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: 391167a0-0777-4f6e-be91-c7902181523b
          tenant-id: adminbestnikahbredge.onmicrosoft.com
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          environment: azurecloud

      - name: Enforce ultra-low-cost Flex Consumption scale
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          SCALE_JSON="$(az functionapp scale config show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" -o json)"
          NAMES="$(echo "$SCALE_JSON" | jq -r '(.alwaysReady // .alwaysReadySettings // [])[]? | (.name // .triggerType // empty)' | xargs || true)"
          if [ -n "$NAMES" ]; then
            az functionapp scale config always-ready delete --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --setting-names $NAMES --only-show-errors
          fi
          az functionapp scale config set --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --instance-memory 512 --only-show-errors >/dev/null
          echo "ULTRA LOW COST FLEX SCALE: PASS"

      - name: Configure Azure Blob Storage for the existing Function App
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          ACCOUNT_NAME="$(az storage account list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)"
          if [ -z "$ACCOUNT_NAME" ]; then
            echo "No storage account found in production resource group."
            exit 1
          fi
          ACCOUNT_URL="https://${ACCOUNT_NAME}.blob.core.windows.net"
          PRINCIPAL_ID="$(az functionapp identity show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query principalId -o tsv)"
          ACCOUNT_SCOPE="$(az storage account show --name "$ACCOUNT_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
          az role assignment create             --assignee-object-id "$PRINCIPAL_ID"             --assignee-principal-type ServicePrincipal             --role "Storage Blob Data Contributor"             --scope "$ACCOUNT_SCOPE"             --only-show-errors || true
          az functionapp config appsettings set             --name "$AZURE_FUNCTIONAPP_NAME"             --resource-group "$RESOURCE_GROUP"             --settings               AZURE_STORAGE_ACCOUNT_URL="$ACCOUNT_URL"               AZURE_PROFILE_PHOTOS_CONTAINER=profile-photos               AZURE_VERIFICATION_DOCUMENTS_CONTAINER=verification-documents \
              ADMOB_REWARDED_AD_UNIT_ID="${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}" \
              AZURE_AUTH_ONLY="true" \
              AZURE_DB_POOL_MAX=3 \
              AI_DAILY_LIMIT_PLUS=5 \
              AI_DAILY_LIMIT_VIP=12 \
              AI_MAX_INPUT_CHARS=2500 \
              AI_MAX_MESSAGES=12 \
              AI_NIKAH_MAX_TOKENS=350 \
              AI_ADVANCED_MAX_INPUT_CHARS=4000 \
              AI_ADVANCED_MAX_TOKENS=500 \
            --only-show-errors
          az storage container create --name profile-photos --account-name "$ACCOUNT_NAME" --auth-mode login --only-show-errors
          az storage container create --name verification-documents --account-name "$ACCOUNT_NAME" --auth-mode login --only-show-errors
          cat >/tmp/bnb-storage-policy.json <<'JSON'
          {
            "rules": [
              {
                "enabled": true,
                "name": "bnb-verification-documents-cool",
                "type": "Lifecycle",
                "definition": {
                  "actions": {
                    "baseBlob": {
                      "tierToCool": {
                        "daysAfterModificationGreaterThan": 30
                      }
                    }
                  },
                  "filters": {
                    "blobTypes": ["blockBlob"],
                    "prefixMatch": ["verification-documents/"]
                  }
                }
              }
            ]
          }
          JSON
          az storage account management-policy create --account-name "$ACCOUNT_NAME" --resource-group "$RESOURCE_GROUP" --policy @/tmp/bnb-storage-policy.json --only-show-errors >/dev/null
          echo "VERIFICATION DOCUMENT COOL-TIER LIFECYCLE: PASS"

      - name: Provision the real Azure OpenAI resource and model if missing
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          LOCATION="eastus"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          AI_ACCOUNT="bestnikahbredgeai${SUBSCRIPTION_ID:0:8}"
          echo "Using Azure OpenAI resource: $AI_ACCOUNT"

          if ! az cognitiveservices account show --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            echo "Creating the real Azure OpenAI resource..."
            az cognitiveservices account create --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --location "$LOCATION" --kind OpenAI --sku S0 --custom-domain "$AI_ACCOUNT" --yes --only-show-errors
          else
            echo "Azure OpenAI resource already exists; keeping it unchanged."
          fi

          MODEL_NAME=""
          MODEL_VERSION=""
          MODEL_FORMAT=""
          MODEL_SKU=""
          MODEL_JSON="$(az cognitiveservices account list-models --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" -o json)"
          for CANDIDATE in gpt-4.1-mini gpt-4.1 gpt-4o gpt-4o-mini; do
            ROW="$(echo "$MODEL_JSON" | jq -c --arg name "$CANDIDATE" '[.[] | select(.name==$name and .format=="OpenAI" and (.skus|length)>0)] | sort_by(.version) | reverse | .[0]')"
            if [ "$ROW" != "null" ] && [ -n "$ROW" ]; then
              MODEL_NAME="$CANDIDATE"
              MODEL_VERSION="$(echo "$ROW" | jq -r '.version')"
              MODEL_FORMAT="$(echo "$ROW" | jq -r '.format')"
              MODEL_SKU="$(echo "$ROW" | jq -r '([.skus[]?.name] | map(select(.=="Standard" or .=="GlobalStandard")) | .[0]) // empty')"
              if [ -n "$MODEL_SKU" ] && [ -n "$MODEL_VERSION" ]; then
                break
              fi
              MODEL_NAME=""
            fi
          done

          if [ -z "$MODEL_NAME" ]; then
            echo "No supported chat model is available for this Azure OpenAI resource."
            exit 1
          fi

          DEPLOYMENT_NAME="nikah-assistant"
          EXISTING_STATE="$(az cognitiveservices account deployment show --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --deployment-name "$DEPLOYMENT_NAME" --query properties.provisioningState -o tsv 2>/dev/null || true)"
          if [ "$EXISTING_STATE" = "Succeeded" ]; then
            echo "Model deployment $DEPLOYMENT_NAME already exists; keeping it unchanged."
          else
            echo "Deploying $MODEL_NAME version $MODEL_VERSION using $MODEL_SKU..."
            az cognitiveservices account deployment create --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --deployment-name "$DEPLOYMENT_NAME" --model-name "$MODEL_NAME" --model-version "$MODEL_VERSION" --model-format "$MODEL_FORMAT" --sku-name "$MODEL_SKU" --sku-capacity 1 --only-show-errors
          fi

      - name: Provision and configure real Azure AI Content Safety
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          LOCATION="eastus"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          SAFETY_ACCOUNT="bestnikahbredgesafety${SUBSCRIPTION_ID:0:8}"
          if ! az cognitiveservices account show --name "$SAFETY_ACCOUNT" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            az cognitiveservices account create --name "$SAFETY_ACCOUNT" --resource-group "$RESOURCE_GROUP" --location "$LOCATION" --kind ContentSafety --sku S0 --yes --only-show-errors
          fi
          SAFETY_ENDPOINT="$(az cognitiveservices account show --name "$SAFETY_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query properties.endpoint -o tsv)"
          PRINCIPAL_ID="$(az functionapp identity show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query principalId -o tsv)"
          SAFETY_ID="$(az cognitiveservices account show --name "$SAFETY_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
          az role assignment create --assignee-object-id "$PRINCIPAL_ID" --assignee-principal-type ServicePrincipal --role "Cognitive Services User" --scope "$SAFETY_ID" --only-show-errors || true
          az functionapp config appsettings set --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --settings AZURE_CONTENT_SAFETY_ENDPOINT="$SAFETY_ENDPOINT" --only-show-errors
      - name: Configure Azure AI for the real Nikah Assistant
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          AI_ACCOUNT="$(az resource list --resource-group "$RESOURCE_GROUP" --resource-type Microsoft.CognitiveServices/accounts --query "[?kind=='OpenAI'].name | [0]" -o tsv)"
          if [ -z "$AI_ACCOUNT" ]; then
            echo "No Azure OpenAI resource found in the production resource group."
            exit 1
          fi
          AI_ENDPOINT="$(az cognitiveservices account show --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query properties.endpoint -o tsv)"
          AI_MODEL="$(az cognitiveservices account deployment list --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query "[?properties.provisioningState=='Succeeded'].name | [0]" -o tsv)"
          if [ -z "$AI_ENDPOINT" ] || [ -z "$AI_MODEL" ]; then
            echo "Azure OpenAI resource or model deployment is not ready."
            exit 1
          fi
          PRINCIPAL_ID="$(az functionapp identity show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query principalId -o tsv)"
          ACCOUNT_ID="$(az cognitiveservices account show --name "$AI_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query id -o tsv)"
          az role assignment create             --assignee-object-id "$PRINCIPAL_ID"             --assignee-principal-type ServicePrincipal             --role "Cognitive Services OpenAI User"             --scope "$ACCOUNT_ID"             --only-show-errors || true
          az functionapp config appsettings set             --name "$AZURE_FUNCTIONAPP_NAME"             --resource-group "$RESOURCE_GROUP"             --settings               AZURE_AI_ENDPOINT="$AI_ENDPOINT"               AZURE_AI_MODEL="$AI_MODEL"             --only-show-errors

      - name: Deploy to the existing Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: azure-backend
      - name: Restart Function App and sync deployed triggers
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          az functionapp restart --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors
          az rest --method post \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_FUNCTIONAPP_NAME}/syncfunctiontriggers?api-version=2016-08-01" \
            --only-show-errors >/dev/null
          for i in 1 2 3 4 5 6; do
            FUNCTIONS="$(az functionapp function list --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv || true)"
            echo "$FUNCTIONS"
            if echo "$FUNCTIONS" | grep -q 'ownerEarningsDashboardAzure' && \
               echo "$FUNCTIONS" | grep -q 'ownerLiveAnalyticsAzure' && \
               echo "$FUNCTIONS" | grep -q 'walletGet'; then
              echo "FUNCTION TRIGGER SYNC: PASS"
              break
            fi
            if [ "$i" = "6" ]; then
              echo "FUNCTION TRIGGER SYNC: FAIL"
              exit 1
            fi
            sleep 10
          done

      - name: Bootstrap exactly one pre-launch owner admin safely
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          FUNCTION_APP="$AZURE_FUNCTIONAPP_NAME"
          DB_HOST="$(az functionapp config appsettings list --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query "[?name=='AZURE_DB_HOST'].value | [0]" -o tsv)"
          DB_NAME="$(az functionapp config appsettings list --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query "[?name=='AZURE_DB_NAME'].value | [0]" -o tsv)"
          DB_USER="$(az functionapp config appsettings list --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query "[?name=='AZURE_DB_USER'].value | [0]" -o tsv)"
          DB_PASSWORD="$(az functionapp config appsettings list --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query "[?name=='AZURE_DB_ADMIN_PASSWORD'].value | [0]" -o tsv)"
          if [ -z "$DB_HOST" ] || [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Production DB connection settings are incomplete."
            exit 1
          fi
          echo "::add-mask::$DB_PASSWORD"

          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          DB_SERVER="${DB_HOST%%.*}"
          az postgres flexible-server firewall-rule create             --resource-group "$RESOURCE_GROUP"             --server-name "$DB_SERVER"             --name github-owner-bootstrap             --start-ip-address "$RUNNER_IP"             --end-ip-address "$RUNNER_IP"             --only-show-errors

          cleanup() {
            az postgres flexible-server firewall-rule delete               --resource-group "$RESOURCE_GROUP"               --server-name "$DB_SERVER"               --name github-owner-bootstrap               --yes --only-show-errors || true
          }
          trap cleanup EXIT

          export PGPASSWORD="$DB_PASSWORD"
          CONN="host=$DB_HOST port=5432 dbname=$DB_NAME user=$DB_USER sslmode=require"
          ADMIN_COUNT="$(psql "$CONN" -Atc "SELECT count(*) FROM users WHERE status='active' AND role IN ('admin','moderator');")"
          ACTIVE_COUNT="$(psql "$CONN" -Atc "SELECT count(*) FROM users WHERE status='active';")"
          echo "Active production users: $ACTIVE_COUNT"
          echo "Existing owner/admin users: $ADMIN_COUNT"

          if [ "$ADMIN_COUNT" -gt 0 ]; then
            echo "OWNER ADMIN BOOTSTRAP: already configured; preserving existing role."
          elif [ "$ACTIVE_COUNT" = "1" ]; then
            UPDATED="$(psql "$CONN" -Atc "WITH promoted AS (UPDATE users SET role='admin',updated_at=now() WHERE id=(SELECT id FROM users WHERE status='active' ORDER BY created_at ASC LIMIT 1) AND role='user' RETURNING id) SELECT count(*) FROM promoted;")"
            if [ "$UPDATED" != "1" ]; then
              echo "OWNER ADMIN BOOTSTRAP: expected exactly one promoted row, got $UPDATED"
              exit 1
            fi
            echo "OWNER ADMIN BOOTSTRAP: PASS — single pre-launch account promoted."
          else
            echo "OWNER ADMIN BOOTSTRAP: FAIL — no admin exists and active user count is $ACTIVE_COUNT."
            echo "Refusing to guess which account is the owner."
            exit 1
          fi

          FINAL_ADMIN_COUNT="$(psql "$CONN" -Atc "SELECT count(*) FROM users WHERE status='active' AND role IN ('admin','moderator');")"
          test "$FINAL_ADMIN_COUNT" -gt 0
          echo "OWNER ADMIN READY: PASS"

      - name: Verify live Azure External ID configuration
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          URL="https://${HOSTNAME}/api/auth/azure/health"
          echo "Checking $URL"
          HTTP_CODE="$(curl -sS -o /tmp/azure-auth.json -w "%{http_code}" "$URL" || true)"
          cat /tmp/azure-auth.json || true
          if [ "$HTTP_CODE" != "200" ] || ! grep -q '"configured":true' /tmp/azure-auth.json; then
            echo "LIVE AZURE EXTERNAL ID CONFIGURATION CHECK: FAIL"
            exit 1
          fi
          echo "LIVE AZURE EXTERNAL ID CONFIGURATION CHECK: PASS"
      - name: Verify live Azure AI Nikah Assistant route is registered
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          URL="https://${HOSTNAME}/api/ai/nikah-assistant"
          echo "Checking Azure AI Nikah Assistant route registration at $URL"
          for i in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"test"}]}' -o /tmp/ai-route.json -w "%{http_code}" "$URL" || true)"
            echo "Attempt $i: HTTP $HTTP_CODE"
            cat /tmp/ai-route.json || true
            if [ "$HTTP_CODE" != "404" ] && [ "$HTTP_CODE" != "000" ]; then
              echo "AZURE AI NIKAH ASSISTANT ROUTE: PASS (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" = "6" ]; then
              echo "AZURE AI NIKAH ASSISTANT ROUTE: FAIL (HTTP $HTTP_CODE)"
              exit 1
            fi
            sleep 10
          done

      - name: Verify live owner wallet route is registered
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          URL="https://${HOSTNAME}/api/owner/earnings"
          echo "Checking owner wallet route registration at $URL"
          for i in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS -o /tmp/owner-wallet-route.json -w "%{http_code}" "$URL" || true)"
            echo "Attempt $i: HTTP $HTTP_CODE"
            cat /tmp/owner-wallet-route.json || true
            if [ "$HTTP_CODE" != "404" ] && [ "$HTTP_CODE" != "000" ]; then
              echo "OWNER WALLET ROUTE REGISTRATION: PASS (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" = "6" ]; then
              echo "OWNER WALLET ROUTE REGISTRATION: FAIL (HTTP $HTTP_CODE)"
              exit 1
            fi
            sleep 10
          done
      - name: Verify live final repair routes are registered
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          for PATH in premium/plans owner/live-analytics owner/earnings wallet wallet/transactions family-links/pending-for-wali; do
            URL="https://${HOSTNAME}/api/${PATH}"
            CODE="$(curl -sS -o /tmp/final-route.json -w "%{http_code}" "$URL" || true)"
            echo "$PATH -> HTTP $CODE"
            cat /tmp/final-route.json || true
            case "$CODE" in
              200|400|401|403|405|409|412) ;;
              *) echo "FINAL REPAIR LIVE ROUTE CHECK FAILED: $PATH HTTP $CODE"; exit 1 ;;
            esac
          done
          echo "FINAL REPAIR LIVE ROUTES: PASS"

      - name: Production readiness and health gate — first pass
        id: production_gate_first
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          READY_URL="https://${HOSTNAME}/api/release/readiness"
          HEALTH_URL="https://${HOSTNAME}/api/health"
          PASS=false
          for i in 1 2 3 4 5 6; do
            READY_CODE="$(curl -sS -o /tmp/release-readiness.json -w "%{http_code}" "$READY_URL" || true)"
            HEALTH_CODE="$(curl -sS -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)"
            echo "Attempt $i readiness=$READY_CODE health=$HEALTH_CODE"
            cat /tmp/release-readiness.json || true
            cat /tmp/health.json || true
            if [ "$READY_CODE" = "200" ] && grep -q '"ready":true' /tmp/release-readiness.json &&                [ "$HEALTH_CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              PASS=true
              break
            fi
            sleep 10
          done
          test "$PASS" = "true"
          echo "PRODUCTION FIRST-PASS GATE: PASS"

      - name: Self-heal Azure runtime after transient production failure
        id: self_heal_runtime
        if: steps.production_gate_first.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          echo "First production gate failed. Running allowlisted self-heal only: restart + trigger sync."
          az functionapp restart --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors
          az rest --method post             --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_FUNCTIONAPP_NAME}/syncfunctiontriggers?api-version=2016-08-01"             --only-show-errors >/dev/null
          sleep 20
          echo "SELF-HEAL RUNTIME ACTION: COMPLETE"

      - name: Production readiness and health gate — after self-heal
        id: production_gate_healed
        if: steps.production_gate_first.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          READY_URL="https://${HOSTNAME}/api/release/readiness"
          HEALTH_URL="https://${HOSTNAME}/api/health"
          PASS=false
          for i in 1 2 3 4 5 6; do
            READY_CODE="$(curl -sS -o /tmp/release-readiness-healed.json -w "%{http_code}" "$READY_URL" || true)"
            HEALTH_CODE="$(curl -sS -o /tmp/health-healed.json -w "%{http_code}" "$HEALTH_URL" || true)"
            echo "Healed attempt $i readiness=$READY_CODE health=$HEALTH_CODE"
            cat /tmp/release-readiness-healed.json || true
            cat /tmp/health-healed.json || true
            if [ "$READY_CODE" = "200" ] && grep -q '"ready":true' /tmp/release-readiness-healed.json &&                [ "$HEALTH_CODE" = "200" ] && grep -q '"ok":true' /tmp/health-healed.json; then
              PASS=true
              break
            fi
            sleep 10
          done
          test "$PASS" = "true"
          echo "PRODUCTION SELF-HEALED GATE: PASS"

      - name: Prepare last-known-good Golden backend rollback
        id: prepare_golden_rollback
        if: steps.production_gate_first.outcome == 'failure' && steps.production_gate_healed.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          GOLDEN_TAG="$(git tag --list 'golden-*' --sort=-creatordate | head -n 1)"
          if [ -z "$GOLDEN_TAG" ]; then
            echo "No Golden tag exists. Refusing unsafe rollback."
            exit 1
          fi
          GOLDEN_SHA="$(git rev-list -n 1 "$GOLDEN_TAG")"
          echo "Preparing backend rollback from $GOLDEN_TAG ($GOLDEN_SHA)"
          rm -rf "$RUNNER_TEMP/golden-release"
          git worktree add --detach "$RUNNER_TEMP/golden-release" "$GOLDEN_SHA"
          test -d "$RUNNER_TEMP/golden-release/azure-backend"
          cd "$RUNNER_TEMP/golden-release/azure-backend"
          npm install --omit=dev
          for file in src/*.js; do node --check "$file"; done
          echo "golden_tag=$GOLDEN_TAG" >> "$GITHUB_OUTPUT"
          echo "golden_sha=$GOLDEN_SHA" >> "$GITHUB_OUTPUT"

      - name: Auto-rollback Azure backend to last known-good Golden release
        if: steps.production_gate_first.outcome == 'failure' && steps.production_gate_healed.outcome == 'failure'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/golden-release/azure-backend

      - name: Restart and sync after Golden rollback
        if: steps.production_gate_first.outcome == 'failure' && steps.production_gate_healed.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          az functionapp restart --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors
          az rest --method post             --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_FUNCTIONAPP_NAME}/syncfunctiontriggers?api-version=2016-08-01"             --only-show-errors >/dev/null
          sleep 20

      - name: Verify production after Golden rollback
        id: production_gate_rollback
        if: steps.production_gate_first.outcome == 'failure' && steps.production_gate_healed.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          RESOURCE_GROUP="BestNikahBredge-Production"
          HOSTNAME="$(az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.defaultHostName -o tsv)"
          READY_URL="https://${HOSTNAME}/api/release/readiness"
          HEALTH_URL="https://${HOSTNAME}/api/health"
          PASS=false
          for i in 1 2 3 4 5 6; do
            READY_CODE="$(curl -sS -o /tmp/release-readiness-rollback.json -w "%{http_code}" "$READY_URL" || true)"
            HEALTH_CODE="$(curl -sS -o /tmp/health-rollback.json -w "%{http_code}" "$HEALTH_URL" || true)"
            echo "Rollback attempt $i readiness=$READY_CODE health=$HEALTH_CODE"
            cat /tmp/release-readiness-rollback.json || true
            cat /tmp/health-rollback.json || true
            if [ "$READY_CODE" = "200" ] && grep -q '"ready":true' /tmp/release-readiness-rollback.json &&                [ "$HEALTH_CODE" = "200" ] && grep -q '"ok":true' /tmp/health-rollback.json; then
              PASS=true
              break
            fi
            sleep 10
          done
          test "$PASS" = "true"
          echo "GOLDEN AUTO-ROLLBACK PRODUCTION GATE: PASS"

      - name: Self-Healing Golden Master result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FIRST="${{ steps.production_gate_first.outcome }}"
          HEALED="${{ steps.production_gate_healed.outcome }}"
          ROLLBACK="${{ steps.production_gate_rollback.outcome }}"
          echo "first=$FIRST healed=$HEALED rollback=$ROLLBACK"
          if [ "$FIRST" = "success" ]; then
            echo "SELF-HEALING GOLDEN MASTER: PASS — no healing needed."
            exit 0
          fi
          if [ "$HEALED" = "success" ]; then
            echo "SELF-HEALING GOLDEN MASTER: PASS — Azure runtime self-healed."
            exit 0
          fi
          if [ "$ROLLBACK" = "success" ]; then
            echo "SELF-HEALING GOLDEN MASTER: PASS — rolled back to last known-good Golden backend."
            exit 0
          fi
          echo "SELF-HEALING GOLDEN MASTER: FAIL — refusing to force GREEN."
          exit 1


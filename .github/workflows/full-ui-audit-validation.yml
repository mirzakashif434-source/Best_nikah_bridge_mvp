name: Full UI Audit Production Validation

on:
  push:
    branches: [full-ui-audit-fixes-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Audit all Android screens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root=Path("app/src/main/java/com/nikahbridge")
          activities=sorted(root.glob("*Activity.java"))
          assert len(activities) >= 46, f"Expected >=46 activities, found {len(activities)}"

          # MainActivity is a redirect-only router; every other screen must be scroll-safe.
          no_scroll=[]
          for p in activities:
              if p.name=="MainActivity.java":
                  continue
              text=p.read_text(encoding="utf-8")
              if "ScrollView" not in text:
                  no_scroll.append(p.name)
          assert not no_scroll, "Screens without ScrollView: "+", ".join(no_scroll)

          # Root destinations do not need an in-content Back control.
          back_exempt={"WelcomeActivity.java","MainActivity.java","ProductionMainActivity.java","AzureHomeActivity.java"}
          no_back=[]
          for p in activities:
              if p.name in back_exempt:
                  continue
              text=p.read_text(encoding="utf-8")
              if "Back" not in text:
                  no_back.append(p.name)
          assert not no_back, "Screens missing Back navigation: "+", ".join(no_back)

          app=(root/"NikahBridgeApplication.java").read_text(encoding="utf-8")
          resumed=re.search(r"onActivityResumed\(Activity a\)\{(.*?)\n    \}",app,re.S)
          assert resumed, "onActivityResumed not found"
          body=resumed.group(1)
          for bad in ["addBack(a)","addCommunityEntry(a)","addRewardEntry(a)","addPremiumEntry(a)","addBlueprintEntry(a)","addMediatorEntry(a)","addSuccessNetworkEntry(a)","addFutureSimulationEntry(a)"]:
              assert bad not in body, "Floating overlay still active: "+bad
          assert "applySafeInsets(a)" in body, "Global system bar safe insets missing"
          assert "normalizeControls(a)" in body, "Global responsive control normalization missing"
          assert "WindowInsetsCompat.Type.systemBars()" in app, "System bar inset implementation missing"
          assert "ViewGroup.LayoutParams.WRAP_CONTENT" in app, "Responsive button height normalization missing"

          for name in ["AzureHomeActivity.java","AzureWalletActivity.java","WalletActivity.java"]:
              t=(root/name).read_text(encoding="utf-8")
              assert "setText(body)" not in t, f"Raw JSON setText(body) remains in {name}"
              assert "setMessage(body)" not in t, f"Raw JSON setMessage(body) remains in {name}"

          assistant=(root/"NikahAssistantActivity.java").read_text(encoding="utf-8")
          assert "ScrollView" in assistant and "private int dp" in assistant, "Nikah Assistant not responsive"

          auth=(root/"AzureExternalAuthActivity.java").read_text(encoding="utf-8")
          assert "ScrollView" in auth and "private int dp" in auth, "Azure sign-in not responsive"

          four=(root/"RealFourPhotoActivity.java").read_text(encoding="utf-8")
          assert "MediaStore.EXTRA_OUTPUT" in four, "Full-resolution camera output missing"
          assert "FileProvider.getUriForFile" in four, "Secure camera FileProvider missing"
          assert 'getExtras().get("data")' not in four, "Thumbnail camera capture still present"
          assert "full-resolution main camera photo captured" in four, "Full-resolution user status missing"

          manifest=Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          assert "androidx.core.content.FileProvider" in manifest, "FileProvider not registered"
          assert '@xml/file_paths' in manifest, "FileProvider paths missing"
          assert Path("app/src/main/res/xml/file_paths.xml").exists(), "file_paths.xml missing"

          welcome=(root/"WelcomeArtworkView.java").read_text(encoding="utf-8")
          assert "Canvas" in welcome and "Paint.ANTI_ALIAS_FLAG" in welcome, "Crisp drawn Welcome artwork missing"

          prod=(root/"ProductionMainActivity.java").read_text(encoding="utf-8")
          for label in ["Global Community Chat","Nikah Blueprint","AI Nikah Mediator","Nikah Success Network","Future Life Simulation"]:
              assert label in prod, "Preserved in-flow navigation missing: "+label

          owner=(root/"OwnerLiveAnalyticsActivity.java").read_text(encoding="utf-8")
          assert "dynamic.removeAllViews()" in owner, "Owner analytics refresh container missing"
          assert "Open Owner Wallet / Payout" in owner, "Owner payout navigation missing"

          numeric_typeface=[]
          for p in root.glob("*.java"):
              text=p.read_text(encoding="utf-8")
              if re.search(r"setTypeface\([^,]+,\s*1\s*\)",text):
                  numeric_typeface.append(p.name)
          assert not numeric_typeface, "Numeric typeface constants remain: "+", ".join(numeric_typeface)

          print("UI AUDIT PASS:",len(activities),"activities")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Compile Android production source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Android lint
        run: |
          ./gradlew :app:lintDebug --stacktrace

      - name: Verify production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload audited APK
        uses: actions/upload-artifact@v4
        with:
          name: best-nikah-bridge-full-ui-audited-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload audited AAB
        uses: actions/upload-artifact@v4
        with:
          name: best-nikah-bridge-full-ui-audited-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

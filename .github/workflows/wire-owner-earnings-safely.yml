name: Wire owner earnings safely

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/ownerEarnings.js'
      - '.github/workflows/wire-owner-earnings-safely.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify owner earnings module without replacing existing code
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/index.js
          test -f functions/ownerEarnings.js
          grep -Fq "require('./ownerEarnings')" functions/index.js
          node --check functions/index.js
          node --check functions/ownerEarnings.js

      - name: Run functions dependency install and verification
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund

name: Verify Android 16 API 36 Play Store Target

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-target-api-36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6

      - name: Verify API 36 configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle

          # Best Nikah Bridge must remain ready for the current Google Play
          # requirement for new apps and app updates: Android 16 / API 36.
          grep -Eq '^\s*compileSdk\s+36\s*$' app/build.gradle
          grep -Eq '^\s*targetSdk\s+36\s*$' app/build.gradle

          echo "Best Nikah Bridge: compileSdk=36 and targetSdk=36 verified."

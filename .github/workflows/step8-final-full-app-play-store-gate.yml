name: Step 8 Final Full App Play Store Gate

# Final additive validation only. No earlier feature, workflow, backend, or lock file is removed/replaced.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-full-app-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify final Android release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.nikahbridge'" app/build.gradle
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'minSdk 23' app/build.gradle
          grep -q 'billing:9.1.0' app/build.gradle
          grep -q 'play-services-ads:25.4.0' app/build.gradle
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:debuggable="true"' app/src/main/AndroidManifest.xml

      - name: Verify final screens are present and registered
        shell: bash
        run: |
          set -euo pipefail
          screens=(
            WelcomeActivity
            MainActivity
            ProductionMainActivity
            ProductionCompletionActivity
            WalletActivity
            OwnerEarningsActivity
            PremiumPlansActivity
            UpgradeActivity
            AccountDeletionActivity
            PrivacyControlCenterActivity
            IdentityVerificationActivity
            CommunityChatActivity
            BlockedMembersActivity
            FamilyBridge2Activity
            WhyWeMatchedActivity
            CompatibilityDealBreakerActivity
            NikahAssistantActivity
            RewardedMessageActivity
            PostVerificationFeatureHubActivity
          )
          for s in "${screens[@]}"; do
            test -s "app/src/main/java/com/nikahbridge/${s}.java"
            grep -q "android:name=\".${s}\"" app/src/main/AndroidManifest.xml
          done

      - name: Verify critical buttons and navigation paths exist
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Premium Plans' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'Owner Earnings' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'Request Withdrawal' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'Transaction History' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q '20 SAR Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q '40 SAR Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q '60 SAR Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q 'Permanently Delete My Account' app/src/main/java/com/nikahbridge/AccountDeletionActivity.java
          grep -q 'finish()' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'finish()' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q 'finish()' app/src/main/java/com/nikahbridge/AccountDeletionActivity.java

      - name: Reject release-blocking placeholder and raw error content
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'lorem ipsum|TODO: demo|fake balance|fake match|sample member|demo purchase|MockData|10\.0\.2\.2|localhost' app/src/main --exclude='*.md'
          ! grep -RniE 'null null' app/src/main/java/com/nikahbridge
          ! grep -RniE 'setAlpha\(0\.[0-4]|alpha\s*=\s*0\.[0-4]' app/src/main/java/com/nikahbridge
          git diff --check

      - name: Verify production account and payment flows are wired
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getHttpsCallable("getWallet")' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'getHttpsCallable("requestWalletWithdrawal")' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'getHttpsCallable("listWalletTransactions")' app/src/main/java/com/nikahbridge/WalletActivity.java
          grep -q 'getHttpsCallable("verifyPremiumPurchase")' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q 'getHttpsCallable("getPremiumEntitlement")' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -q 'getHttpsCallable("deleteMyAccount")' app/src/main/java/com/nikahbridge/AccountDeletionActivity.java

      - name: Restore real release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build final signed APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release-apk.sha256
          sha256sum app/build/outputs/bundle/release/app-release.aab > app-release-aab.sha256

      - name: Final artifact scan
        shell: bash
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-files.txt"
          ! grep -Eiq 'testOnly|localhost|10\.0\.2\.2' "$RUNNER_TEMP/aab-files.txt"
          unzip -l app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-files.txt"
          ! grep -Eiq 'testOnly|localhost|10\.0\.2\.2' "$RUNNER_TEMP/apk-files.txt"

      - name: Upload final signed APK and AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-step8-final-play-store-build
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app-release-apk.sha256
            app-release-aab.sha256
          if-no-files-found: error

      - name: Final result
        run: |
          echo 'STEP 8 FINAL FULL APP GATE PASSED.'
          echo 'Signed APK + AAB were built from the exact main branch and passed repository release checks.'
          echo 'One real-device end-to-end test and Play Console submission remain human/external release actions.'

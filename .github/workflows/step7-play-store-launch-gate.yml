name: Step 7 Play Store Launch Gate

# Additive validation only. Earlier release workflows and application features remain untouched.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify real production launch configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f privacy.html
          test -f STEP_7_PLAY_STORE_PRODUCTION_LAUNCH_GATE.md
          grep -q "applicationId 'com.nikahbridge'" app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'billing:9.1.0' app/build.gradle
          grep -q 'play-services-ads:25.4.0' app/build.gradle
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle
          grep -q 'ca-app-pub-8897537994957088~9402403755' app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -RniE 'ca-app-pub-3940256099942544|test-ad-unit|TEST_AD_UNIT|localhost|10\.0\.2\.2|MockData|sample member|fake match|fake balance|demo purchase' app/src/main functions --exclude='*.md'
          ! grep -RniE 'debuggable="true"' app/src/main/AndroidManifest.xml
          grep -qi 'data deletion' privacy.html
          grep -qi 'AdMob' privacy.html
          grep -qi 'identity verification' privacy.html
          grep -qi 'AI Features' privacy.html
          git diff --check

      - name: Verify Firebase production source is present
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/index.js
          test -f functions/admobRewarded.js
          test -f functions/verification.js
          test -f functions/community.js
          test -f functions/familyBridge2.js
          grep -q 'admobRewarded' functions/index.js
          grep -q 'verification' functions/index.js
          grep -q 'community' functions/index.js
          grep -q 'familyBridge2' functions/index.js
          grep -q 'deleteMyAccount' functions/index.js
          test -f app/src/main/java/com/nikahbridge/AccountDeletionActivity.java

      - name: Create ephemeral CI validation keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-validation.jks" \
            -storepass ci-validation-password \
            -keypass ci-validation-password \
            -alias ci-validation \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Best Nikah Bridge CI Validation, OU=CI, O=Best Nikah Bridge, L=CI, S=CI, C=US'

      - name: Build release candidate for launch validation
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ci-validation.jks
          KEYSTORE_PASSWORD: ci-validation-password
          KEY_ALIAS: ci-validation
          KEY_PASSWORD: ci-validation-password
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Scan release candidate for demo/test artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" > "$RUNNER_TEMP/aab-list.txt"
          ! grep -Eiq 'debug|testOnly|mock|localhost|10\.0\.2\.2' "$RUNNER_TEMP/aab-list.txt"
          unzip -p "$AAB" 'base/dex/*.dex' 2>/dev/null | strings > "$RUNNER_TEMP/aab-strings.txt" || true
          ! grep -Eiq 'ca-app-pub-3940256099942544|localhost|10\.0\.2\.2|MockData|sample member|fake match|fake balance|demo purchase' "$RUNNER_TEMP/aab-strings.txt"

      - name: Upload Step 7 launch validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-step7-launch-validation
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report external Play Console gates honestly
        run: |
          echo 'STEP 7 repository launch validation PASSED.'
          echo 'Play Console declarations, owner submission, Firebase billing activation, AdMob payment setup, and real-device smoke testing remain external operational gates.'

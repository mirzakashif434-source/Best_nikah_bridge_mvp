name: SAFE COPY - Offline Android Smoke (No Azure)

on:
  push:
    branches: [audit/free-check-20261020]
    paths:
      - '.github/workflows/audit-copy-offline-android.yml'
      - '.github/scripts/audit_copy_offline_welcome.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-android:
    name: Isolated unsigned debug APK + offline emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prove audit-only branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "audit/free-check-20261020"
          test -f .github/scripts/verify_50_screen_ultra_final.py
          test -f app/build.gradle
          echo "BRANCH SAFETY PASS"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check 50-screen source and build debug without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_50_screen_ultra_final.py
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "SOURCE + DEBUG BUILD PASS"
      - name: Offline emulator - welcome screen and crash smoke ONLY
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/audit_copy_offline_welcome.sh

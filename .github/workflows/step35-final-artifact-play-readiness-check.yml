name: Step 35 Final Artifact Play Readiness Heavy Lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step35-final-play-ready-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '36'
  EXPECTED_VERSION_NAME: '2.25'
  PLAY_CLASSIC_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  PLAY_PQ_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67
  PLAY_PREVIOUS_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9
  PLAY_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  PLAY_CURRENT_SHA256: 66ABDEAFB0417716C6B1003A7A28FED0D742426905B2513E3D36A497CF5ADDAE
  PLAY_PREVIOUS_SHA256: 70A6D765B552B649E83FCCAC378F0EEB0A3EACB301903BF38EF44F22A8099968
  PLAY_PQ_SHA256: 5429EBF572B04C2B48A9C256AA0E659F066B7FE46EC06A653703A8FD882C0BEB
  PLAY_UPLOAD_SHA256: AF824C01B11D280C159A4C233064AB8639154C89EEE1FABB07ED2E21A58C1E7B
  AZURE_BASE: https://bestnikahbredge-prod-fn-dkf3ake6d8gsg7cw.eastus-01.azurewebsites.net/api

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Preserve Steps 1-34
        shell: bash
        run: |
          set -euo pipefail
          test -s STEP_34_FINAL_RELEASE_INTEGRITY_MASTER_GATE.md
          test -s .github/workflows/step34-final-release-integrity-master-gate.yml
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" app/build.gradle
          echo "STEPS 1-34 + RELEASE IDENTITY: PRESERVED"

      - name: Heavy 50-screen source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_final_release_master.py
          python3 .github/scripts/verify_50_screen_ultra_final.py
          python3 .github/scripts/verify_locked_feature_contracts.py
          COUNT="$(grep -o 'android:name="\.[A-Za-z0-9_]*Activity"' app/src/main/AndroidManifest.xml | sort -u | wc -l | tr -d ' ')"
          test "$COUNT" = "50"
          echo "50-SCREEN SOURCE + BUTTONS + BACK + SIZE/INSETS + BLUR/NULL/STALE AUDIT: PASS"

      - name: No-Firebase and secret safety
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -d functions
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          ! grep -RInE --exclude-dir=.git --exclude='*.md' -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}|sk-[0-9A-Za-z]{20,}' .
          echo "NO-FIREBASE + SECRET SAFETY: PASS"

      - name: Play signing and redirect matrix
        shell: bash
        run: |
          set -euo pipefail
          S=.github/workflows/step3-azure-auth-sha-master-lock.yml
          grep -Fq "EXPECTED_PLAY_APP_SIGNING_SHA1: $PLAY_CLASSIC_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_POST_QUANTUM_SHA1: $PLAY_PQ_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: $PLAY_PREVIOUS_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_UPLOAD_SHA1: $PLAY_UPLOAD_SHA1" "$S"
          CLASSIC_B64="$(printf '%s' "$PLAY_CLASSIC_SHA1" | xxd -r -p | openssl base64 -A)"
          PREVIOUS_B64="$(printf '%s' "$PLAY_PREVIOUS_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$CLASSIC_B64" = "haUulU8x36wsEGKo1k7aLZtIW0g="
          test "$PREVIOUS_B64" = "WS+zloPDaXssn/RIrOAGmd4iV+k="
          grep -Fq 'msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D' app/src/main/res/raw/auth_config.json
          grep -Fq 'msauth://com.nikahbridge/WS%2BzloPDaXssn%2FRIrOAGmd4iV%2Bk%3D' app/src/main/res/raw/auth_config_play_current.json
          grep -Fq 'android:path="/haUulU8x36wsEGKo1k7aLZtIW0g="' app/src/main/AndroidManifest.xml
          grep -Fq 'android:path="/WS+zloPDaXssn/RIrOAGmd4iV+k="' app/src/main/AndroidManifest.xml
          echo "PLAY SHA + MSAL REDIRECTS: PASS"

  live-azure:
    name: Live Azure Final Check
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Azure health + auth config + protection
        shell: bash
        run: |
          set -euo pipefail
          H="$(curl --fail --silent --show-error --retry 3 --max-time 30 "$AZURE_BASE/health")"
          A="$(curl --fail --silent --show-error --retry 3 --max-time 30 "$AZURE_BASE/auth/azure/health")"
          python3 - "$H" "$A" <<'PY'
          import json,sys
          h=json.loads(sys.argv[1]); a=json.loads(sys.argv[2])
          assert h.get("ok") is True and h.get("environment")=="azure"
          assert a.get("ok") is True
          assert a.get("issuerConfigured") is True
          assert a.get("audienceConfigured") is True
          assert a.get("jwksConfigured") is True
          print("LIVE AZURE HEALTH + AUTH CONFIG: PASS")
          PY
          CODE="$(curl --silent --show-error -o /tmp/protected.json -w '%{http_code}' --max-time 30 "$AZURE_BASE/auth/health")"
          test "$CODE" = "401"
          echo "LIVE AZURE PROTECTED API: PASS"

  signed-artifacts:
    name: Signed APK AAB Compile Lint Forensic
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify upload signer + compile + lint + build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/upload.der"
          SHA1="$(openssl sha1 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          SHA256="$(openssl sha256 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$SHA1" = "$PLAY_UPLOAD_SHA1"
          test "$SHA256" = "$PLAY_UPLOAD_SHA256"

          chmod +x gradlew
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew clean :app:compileReleaseJavaWithJavac :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          python3 .github/scripts/verify_38_screen_master.py "$APK"
          python3 .github/scripts/verify_final_release_master.py "$APK"
          python3 .github/scripts/verify_50_screen_ultra_final.py "$APK" "$AAB"
          sha256sum "$APK" > FINAL_APK_SHA256.txt
          sha256sum "$AAB" > FINAL_AAB_SHA256.txt
          {
            echo "BEST NIKAH BRIDGE STEP 35 FINAL PLAY READY"
            echo "commit=$GITHUB_SHA"
            echo "package=$EXPECTED_PACKAGE"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "play_upload_sha1=$PLAY_UPLOAD_SHA1"
            echo "play_upload_sha256=$PLAY_UPLOAD_SHA256"
            echo "play_console_upload_publish=NOT_PERFORMED"
          } > STEP35_FINAL_READINESS.txt
          echo "SIGNED APK+AAB + COMPILE + LINT + FORENSIC: PASS"

      - uses: actions/upload-artifact@v6
        with:
          name: step35-final-play-ready-apk-aab-v36
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            FINAL_APK_SHA256.txt
            FINAL_AAB_SHA256.txt
            STEP35_FINAL_READINESS.txt
          if-no-files-found: error

  runtime-50-screen:
    name: Runtime APK 50-Screen Heavy Gate
    needs: signed-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - uses: actions/download-artifact@v6
        with:
          name: step35-final-play-ready-apk-aab-v36
          path: step35-artifacts
      - name: Run signed APK smoke + ultra runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$GITHUB_WORKSPACE/.github/scripts/step35_runtime_entry.sh"

  maestro-e2e:
    name: Maestro E2E
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Heavy Maestro contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s .maestro/final-release-42-screen-master.yaml
          test -s .maestro/signed-in-38-screen-master.yaml
          grep -Fq 'appId: com.nikahbridge' .maestro/final-release-42-screen-master.yaml
          python3 .github/scripts/verify_final_release_master.py
          python3 .github/scripts/verify_50_screen_ultra_final.py
          echo "MAESTRO E2E CONTRACTS: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Final budget + no-publish lock
        shell: bash
        run: |
          set -euo pipefail
          test -f FORTRESS_BUDGET_MODE.md
          grep -Fq -- '--instance-memory 512 --maximum-instance-count 20' .github/workflows/azure-backend-deploy.yml
          grep -Fq 'AZURE_DB_POOL_MAX=3' .github/workflows/azure-backend-deploy.yml
          grep -Fq 'AI_DAILY_LIMIT_VIP=12' .github/workflows/azure-backend-deploy.yml
          F=.github/workflows/step35-final-artifact-play-readiness-check.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy|update)|gradle-play-publisher|publishBundle|play[[:space:]].*upload|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET + NO PLAY PUBLISH: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, live-azure, signed-artifacts, runtime-50-screen, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          grep -Fq 'Self-heal Azure runtime after transient production failure' .github/workflows/azure-backend-deploy.yml
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, live-azure, signed-artifacts, runtime-50-screen, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "AUTO-ROLLBACK SAFETY: Step 35 performs verification/build only; no Azure mutation and no Play Console publish."

  locked:
    name: Step 35 Final Play Ready Locked
    if: ${{ always() && needs.master-gate.result == 'success' && needs.live-azure.result == 'success' && needs.signed-artifacts.result == 'success' && needs.runtime-50-screen.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    needs: [master-gate, live-azure, signed-artifacts, runtime-50-screen, maestro-e2e, fortress-budget, self-healing]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 35 FINAL PLAY READINESS: GREEN"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback -> Fortress Budget"
          echo "50-screen buttons/back/size/blur/null/navigation + signed APK/AAB + Azure/Play integrity: PASS"
          echo "FINAL DOWNLOAD: step35-final-play-ready-apk-aab-v36"
          echo "PLAY CONSOLE UPLOAD/PUBLISH: NOT PERFORMED"

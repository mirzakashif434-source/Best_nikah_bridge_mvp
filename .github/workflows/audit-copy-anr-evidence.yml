name: SAFE COPY - Offline ANR Evidence (No Azure)
on:
  push:
    branches: [audit/free-check-20261020]
    paths:
      - '.github/workflows/audit-copy-anr-evidence.yml'
      - '.github/scripts/audit_copy_anr_evidence.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm audit copy only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "audit/free-check-20261020"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build copy debug APK without release secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_50_screen_ultra_final.py
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Capture offline ANR evidence; do not touch Azure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/audit_copy_offline_welcome.sh && bash .github/scripts/audit_copy_anr_evidence.sh
      - name: Save diagnostic evidence even if emulator step failed
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-only-offline-anr-evidence
          path: audit-anr-evidence/
          if-no-files-found: warn
          retention-days: 1

name: Azure Database Step 1 - Provision and Initialize

on:
  workflow_dispatch:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'azure-backend/database/**'
      - '.github/workflows/azure-database-provision.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: BestNikahBredge-Production
      FUNCTION_APP: bestnikahbredge-prod-fn
      DB_SERVER: bestnikahbredge-prod-db
      DB_NAME: nikah_prod
      DB_ADMIN: nikahadmin
    steps:
      - uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: 391167a0-0777-4f6e-be91-c7902181523b
          tenant-id: adminbestnikahbredge.onmicrosoft.com
          audience: api://AzureADTokenExchange
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: azurecloud

      - name: Prepare database credentials and runner IP
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          EXISTING_PASSWORD="$(az functionapp config appsettings list             --name "$FUNCTION_APP"             --resource-group "$RESOURCE_GROUP"             --query "[?name=='AZURE_DB_ADMIN_PASSWORD'].value | [0]"             -o tsv)"
          if [ -n "$EXISTING_PASSWORD" ]; then
            DB_PASSWORD="$EXISTING_PASSWORD"
          else
            DB_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9@#%+=_' | head -c 32)"
            if [ "${#DB_PASSWORD}" -lt 20 ]; then
              echo "Could not generate a sufficiently strong database password."
              exit 1
            fi
          fi
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Create PostgreSQL Flexible Server if missing
        shell: bash
        run: |
          # Preserve the existing Function App. Check PostgreSQL capability
          # for this subscription before choosing a database region.
          DB_LOCATION=""
          if az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$DB_SERVER" >/dev/null 2>&1; then
            echo "PostgreSQL server already exists; preserving it."
          else
            for LOCATION in westus3 centralus eastus2 westus2 northeurope westeurope uksouth francecentral swedencentral canadacentral; do
              echo "Checking PostgreSQL capability for subscription in $LOCATION"
              RESTRICTED="$(az rest --method get \
                --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.DBforPostgreSQL/locations/$LOCATION/capabilities?api-version=2024-08-01" \
                --query "value[0].restricted" -o tsv 2>/dev/null || true)"
              if [ "$RESTRICTED" = "Disabled" ]; then
                DB_LOCATION="$LOCATION"
                echo "PostgreSQL location allowed for this subscription: $DB_LOCATION"
                break
              fi
              echo "PostgreSQL location restricted: $LOCATION"
            done
            if [ -z "$DB_LOCATION" ]; then
              echo "No PostgreSQL Flexible Server location is currently allowed for this subscription."
              exit 1
            fi

            az postgres flexible-server create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$DB_SERVER" \
              --location "$DB_LOCATION" \
              --admin-user "$DB_ADMIN" \
              --admin-password "$DB_PASSWORD" \
              --sku-name Standard_B1ms \
              --tier Burstable \
              --storage-size 32 \
              --storage-auto-grow Enabled \
              --version 16 \
              --public-access "$RUNNER_IP" \
              --backup-retention 7 \
              --tags "Environment=Production" "Component=Database"
          fi
      - name: Allow Function App outbound IPs
        shell: bash
        run: |
          set -euo pipefail
          OUTBOUND_IPS="$(az functionapp show             --name "$FUNCTION_APP"             --resource-group "$RESOURCE_GROUP"             --query outboundIpAddresses -o tsv)"
          IFS=',' read -ra IPS <<< "$OUTBOUND_IPS"
          for IP in "${IPS[@]}"; do
            [ -z "$IP" ] && continue
            az postgres flexible-server firewall-rule create               --resource-group "$RESOURCE_GROUP"               --name "$DB_SERVER"               --rule-name "function-${IP//./-}"               --start-ip-address "$IP"               --end-ip-address "$IP"               --only-show-errors
          done

      - name: Allow this GitHub runner for initialization
        shell: bash
        run: |
          set -euo pipefail
          az rest --method put \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DBforPostgreSQL/flexibleServers/$DB_SERVER/firewallRules/github-runner-init?api-version=2024-08-01" \
            --headers "Content-Type=application/json" \
            --body "{\"properties\":{\"startIpAddress\":\"$RUNNER_IP\",\"endIpAddress\":\"$RUNNER_IP\"}}" \
            --only-show-errors

      - name: Create application database
        shell: bash
        run: |
          set -euo pipefail
          if az postgres flexible-server db show             --resource-group "$RESOURCE_GROUP"             --server-name "$DB_SERVER"             --database-name "$DB_NAME" >/dev/null 2>&1; then
            echo "Database already exists; preserving it."
          else
            az postgres flexible-server db create --resource-group "$RESOURCE_GROUP" --server-name "$DB_SERVER" --name "$DB_NAME"
          fi

      - name: Verify PostgreSQL public network access and runner firewall
        shell: bash
        run: |
          set -euo pipefail
          NETWORK_ACCESS="$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$DB_SERVER" --query network.publicNetworkAccess -o tsv 2>/dev/null || true)"
          echo "PostgreSQL public network access: $NETWORK_ACCESS"
          if [ "$NETWORK_ACCESS" != "Enabled" ]; then
            echo "Enabling public network access on the existing PostgreSQL server; no database objects are changed."
            az postgres flexible-server update --resource-group "$RESOURCE_GROUP" --name "$DB_SERVER" --public-access 0.0.0.0 --only-show-errors
          fi
          az rest --method put \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DBforPostgreSQL/flexibleServers/$DB_SERVER/firewallRules/github-runner-init?api-version=2024-08-01" \
            --headers "Content-Type=application/json" \
            --body "{\"properties\":{\"startIpAddress\":\"$RUNNER_IP\",\"endIpAddress\":\"$RUNNER_IP\"}}" \
            --only-show-errors
          echo "Runner firewall rule verified for $RUNNER_IP"

      - name: Apply production schema
        shell: bash
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          SCHEMA_OK=false
          for i in 1 2 3 4 5 6; do
            if psql "host=$DB_SERVER.postgres.database.azure.com port=5432 dbname=$DB_NAME user=$DB_ADMIN sslmode=require" --file azure-backend/database/schema.sql; then
              SCHEMA_OK=true
              break
            fi
            sleep 10
          done
          if [ "$SCHEMA_OK" != "true" ]; then
            echo "Existing PostgreSQL password was rejected; rotating the production admin password and retrying schema initialization."
            NEW_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9@#%+=_' | head -c 32)"
            echo "::add-mask::$NEW_PASSWORD"
            az postgres flexible-server update --resource-group "$RESOURCE_GROUP" --name "$DB_SERVER" --admin-password "$NEW_PASSWORD" --only-show-errors
            export PGPASSWORD="$NEW_PASSWORD"
            for i in 1 2 3 4 5 6; do
              if psql "host=$DB_SERVER.postgres.database.azure.com port=5432 dbname=$DB_NAME user=$DB_ADMIN sslmode=require" --file azure-backend/database/schema.sql; then
                echo "DATABASE SCHEMA: PASS"
                echo "DB_PASSWORD=$NEW_PASSWORD" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 10
            done
            echo "DATABASE SCHEMA: FAIL"
            exit 1
          fi
          echo "DATABASE SCHEMA: PASS"
      - name: Persist database connection settings on Function App
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings set             --name "$FUNCTION_APP"             --resource-group "$RESOURCE_GROUP"             --settings               AZURE_DB_HOST="$DB_SERVER.postgres.database.azure.com"               AZURE_DB_NAME="$DB_NAME"               AZURE_DB_USER="$DB_ADMIN"               AZURE_DB_ADMIN_PASSWORD="$DB_PASSWORD"               AZURE_DB_SSLMODE=require             --only-show-errors

      - name: Step 6.4 live Azure identity and profile smoke
        shell: bash
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          CONN="host=$DB_SERVER.postgres.database.azure.com port=5432 dbname=$DB_NAME user=$DB_ADMIN sslmode=require"

          # Existing production records must now have canonical Azure identity.
          MISSING="$(psql "$CONN" -Atc "SELECT count(*) FROM users WHERE azure_subject IS NULL;")"
          test "$MISSING" = "0"

          # The retired legacy column must really be gone from the live database.
          LEGACY_COL="$(psql "$CONN" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='users' AND column_name='firebase_uid';")"
          test "$LEGACY_COL" = "0"

          # New-user + existing-user-link + profile persistence smoke, fully rolled back.
          psql "$CONN" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO users(azure_subject,email,email_verified_at)
          VALUES('ci-step6-4-new-user','ci-step6-4@invalid.example',now())
          ON CONFLICT (azure_subject) DO UPDATE SET email=EXCLUDED.email,updated_at=now();

          UPDATE users
             SET email_verified_at=COALESCE(email_verified_at,now()),
                 updated_at=now()
           WHERE azure_subject='ci-step6-4-new-user';

          INSERT INTO profiles(user_id,display_name,date_of_birth,gender,profile_completed,is_visible)
          SELECT id,'CI Azure User','1990-01-01','male',TRUE,FALSE
            FROM users
           WHERE azure_subject='ci-step6-4-new-user'
          ON CONFLICT(user_id) DO UPDATE SET display_name=EXCLUDED.display_name,updated_at=now();

          DO $
          DECLARE n BIGINT;
          BEGIN
            SELECT count(*) INTO n
              FROM users u
              JOIN profiles p ON p.user_id=u.id
             WHERE u.azure_subject='ci-step6-4-new-user'
               AND p.display_name='CI Azure User';
            IF n <> 1 THEN
              RAISE EXCEPTION 'STEP 6.4 AZURE USER/PROFILE SMOKE FAILED';
            END IF;
          END $;
          ROLLBACK;
          SQL

          echo "STEP 6.4 LIVE AZURE EXISTING + NEW USER PROFILE FLOW: PASS"

      - name: Verify database objects
        shell: bash
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set -euo pipefail
          COUNT="$(psql "host=$DB_SERVER.postgres.database.azure.com port=5432 dbname=$DB_NAME user=$DB_ADMIN sslmode=require"             -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','profiles','partner_preferences','interests','conversations','messages','family_links','verifications','photos','safety_reports','blocked_users','privacy_settings','entitlements','rewarded_ad_transactions','daily_reward_claims','premium_plans','wallet_accounts','wallet_ledger','wallet_withdrawals','help_line_tickets','owner_earnings','owner_earnings_summary','owner_settlement_profile','owner_provider_settlements','owner_settlements');")"
          if [ "$COUNT" = "25" ]; then
            echo "DATABASE VERIFICATION: PASS (25 core tables)"
          else
            echo "DATABASE VERIFICATION: FAIL (found $COUNT/25 core tables)"
            exit 1
          fi

      - name: Remove temporary GitHub runner firewall rule
        if: always()
        shell: bash
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            az rest --method delete \
          --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DBforPostgreSQL/flexibleServers/$DB_SERVER/firewallRules/github-runner-init?api-version=2024-08-01" \
          --only-show-errors || true
          fi

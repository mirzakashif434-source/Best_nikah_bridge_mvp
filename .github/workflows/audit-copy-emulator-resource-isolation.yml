name: SAFE COPY - Android Emulator Resource Isolation
on:
  push:
    branches: [audit/free-check-20261020]
    paths:
      - '.github/workflows/audit-copy-emulator-resource-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-api34:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify copy branch and preserve production
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "audit/free-check-20261020"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check screens and build disposable debug APK
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_50_screen_ultra_final.py
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Android 34 - higher RAM and CPU offline UI check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          script: bash .github/scripts/audit_copy_offline_welcome.sh && bash .github/scripts/audit_copy_welcome_navigation.sh

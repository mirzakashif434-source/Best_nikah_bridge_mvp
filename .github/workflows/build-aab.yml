name: Build Best Nikah Bridge AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: Gradle-Root
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        working-directory: Gradle-Root
        run: ./gradlew --version

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/Gradle-Root/app/release-key.jks"

          if [ ! -s "$GITHUB_WORKSPACE/Gradle-Root/app/release-key.jks" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      - name: Show SHA-1 and SHA-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: Gradle-Root
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "========================================"
          echo "Release Keystore Fingerprints"
          echo "========================================"

          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/Gradle-Root/app/release-key.jks" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            | grep -E "SHA1:|SHA256:" || true

          echo "========================================"
          echo "End Fingerprints"
          echo "========================================"

      - name: Build signed Release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/Gradle-Root/app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: Gradle-Root
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          ./gradlew clean bundleRelease --stacktrace

      - name: Verify AAB
        working-directory: Gradle-Root
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "========================================"
          echo "Release AAB generated successfully:"
          echo "$AAB_FILE"
          echo "========================================"

          ls -lh "$AAB_FILE"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: best-nikah-bridge-release-aab
          path: Gradle-Root/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/Gradle-Root/app/release-key.jks"

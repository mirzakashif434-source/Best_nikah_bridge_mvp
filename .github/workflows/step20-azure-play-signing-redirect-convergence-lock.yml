name: Step 20 Azure Play Signing Redirect Convergence Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_20_AZURE_PLAY_SIGNING_REDIRECT_CONVERGENCE_LOCK.md'
      - '.github/workflows/step20-azure-play-signing-redirect-convergence-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: step20-azure-play-signing-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_ANDROID_CLIENT_ID: f5fc2b11-420f-4741-9a52-65d60cbddb7b
  EXPECTED_ANDROID_OBJECT_ID: 8990738c-2833-4830-9447-461dc0fe6a9a
  EXPECTED_TENANT_ID: c4ac0560-df59-48d4-af1b-bb0ed127ce6d
  EXPECTED_API_AUDIENCE: 4733ae40-3b89-4994-b99b-3890bf87e876
  EXPECTED_PLAY_CURRENT_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9
  EXPECTED_PLAY_CLASSICAL_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  EXPECTED_PLAY_POST_QUANTUM_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67
  EXPECTED_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_PLAY_CURRENT_SHA256: 66ABDEAFB0417716C6B1003A7A28FED0D742426905B2513E3D36A497CF5ADDAE
  EXPECTED_PLAY_PREVIOUS_CLASSICAL_SHA256: 70A6D765B552B649E83FCCAC378F0EEB0A3EACB301903BF38EF44F22A8099968
  EXPECTED_PLAY_POST_QUANTUM_SHA256: 5429EBF572B04C2B48A9C256AA0E659F066B7FE46EC06A653703A8FD882C0BEB
  EXPECTED_UPLOAD_SHA256: AF824C01B11D280C159A4C233064AB8639154C89EEE1FABB07ED2E21A58C1E7B
  LIVE_BASE_URL: https://bestnikahbredge-prod-fn-dkf3ake6d8gsg7cw.eastus-01.azurewebsites.net

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Preserve Step 1-19 and verify release
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/step19-final-release-provenance-play-upload-candidate-lock.yml
          test -s STEP_19_FINAL_RELEASE_PROVENANCE_PLAY_UPLOAD_CANDIDATE_LOCK.md
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+36' app/build.gradle
          grep -Fq "versionName '2.25'" app/build.gradle
          python3 .github/scripts/verify_final_release_master.py
          echo "STEP 1-19 + RELEASE 36: PRESERVED"

      - name: Verify exact Play signing locks
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PLAY_CURRENT_SHA256" = "66ABDEAFB0417716C6B1003A7A28FED0D742426905B2513E3D36A497CF5ADDAE"
          test "$EXPECTED_PLAY_PREVIOUS_CLASSICAL_SHA256" = "70A6D765B552B649E83FCCAC378F0EEB0A3EACB301903BF38EF44F22A8099968"
          test "$EXPECTED_PLAY_POST_QUANTUM_SHA256" = "5429EBF572B04C2B48A9C256AA0E659F066B7FE46EC06A653703A8FD882C0BEB"
          test "$EXPECTED_UPLOAD_SHA256" = "AF824C01B11D280C159A4C233064AB8639154C89EEE1FABB07ED2E21A58C1E7B"
          CURRENT_B64="$(printf '%s' "$EXPECTED_PLAY_CURRENT_SHA1" | xxd -r -p | openssl base64 -A)"
          CLASSIC_B64="$(printf '%s' "$EXPECTED_PLAY_CLASSICAL_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$CURRENT_B64" = "WS+zloPDaXssn/RIrOAGmd4iV+k="
          test "$CLASSIC_B64" = "haUulU8x36wsEGKo1k7aLZtIW0g="
          grep -Fq 'msauth://com.nikahbridge/WS%2BzloPDaXssn%2FRIrOAGmd4iV%2Bk%3D' app/src/main/res/raw/auth_config_play_current.json
          grep -Fq 'msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D' app/src/main/res/raw/auth_config.json
          grep -Fq 'WS+zloPDaXssn/RIrOAGmd4iV+k=' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq 'haUulU8x36wsEGKo1k7aLZtIW0g=' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          echo "PLAY CERTIFICATE + INSTALLED-SIGNER SELECTOR: PASS"

  azure-redirect-convergence:
    name: Azure Redirect Convergence
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: azure/login@v3
        with:
          client-id: 256ca508-50c5-4877-bc12-f20993fb97c4
          tenant-id: c4ac0560-df59-48d4-af1b-bb0ed127ce6d
          audience: api://AzureADTokenExchange
          environment: azurecloud
          allow-no-subscriptions: true

      - name: Additively preserve valid Play MSAL redirects
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          test -n "$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$EXPECTED_ANDROID_OBJECT_ID" -o /tmp/before.json
          jq -e --arg id "$EXPECTED_ANDROID_CLIENT_ID" '.appId == $id' /tmp/before.json >/dev/null
          CURRENT_B64="$(printf '%s' "$EXPECTED_PLAY_CURRENT_SHA1" | xxd -r -p | openssl base64 -A)"
          CLASSIC_B64="$(printf '%s' "$EXPECTED_PLAY_CLASSICAL_SHA1" | xxd -r -p | openssl base64 -A)"
          CURRENT_URI="msauth://$EXPECTED_PACKAGE/$(printf '%s' "$CURRENT_B64" | sed -e 's/+/%2B/g' -e 's#/#%2F#g' -e 's/=/%3D/g')"
          CLASSIC_URI="msauth://$EXPECTED_PACKAGE/$(printf '%s' "$CLASSIC_B64" | sed -e 's/+/%2B/g' -e 's#/#%2F#g' -e 's/=/%3D/g')"
          jq --arg current "$CURRENT_URI" --arg classic "$CLASSIC_URI" '{publicClient:{redirectUris:((.publicClient.redirectUris // []) + [$current,$classic] | unique)}}' /tmp/before.json > /tmp/patch.json
          jq '{publicClient:{redirectUris:(.publicClient.redirectUris // [])}}' /tmp/before.json > /tmp/rollback.json
          rollback() {
            curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/rollback.json "https://graph.microsoft.com/v1.0/applications/$EXPECTED_ANDROID_OBJECT_ID" || true
          }
          trap rollback ERR
          curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @/tmp/patch.json "https://graph.microsoft.com/v1.0/applications/$EXPECTED_ANDROID_OBJECT_ID"
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://graph.microsoft.com/v1.0/applications/$EXPECTED_ANDROID_OBJECT_ID" -o /tmp/after.json
          python3 - "$CURRENT_URI" "$CLASSIC_URI" <<'PY'
          import json,sys,urllib.parse
          d=json.load(open('/tmp/after.json'))
          got=[urllib.parse.unquote(x) for x in d.get('publicClient',{}).get('redirectUris',[])]
          expected=[urllib.parse.unquote(sys.argv[1]),urllib.parse.unquote(sys.argv[2])]
          for uri in expected:
              assert uri in got, f"Required redirect missing: {uri}"
          print("AZURE REQUIRED PLAY REDIRECTS PRESENT")
          PY
          trap - ERR
          echo "AZURE REDIRECT CONVERGENCE: PASS"

  live-azure:
    name: Live Azure Readiness
    needs: azure-redirect-convergence
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          for path in /api/health /api/database/health /api/storage/health /api/auth/azure/health /api/release/readiness; do
            code="$(curl --silent --show-error --location --connect-timeout 20 --max-time 45 -o /tmp/out -w '%{http_code}' "$LIVE_BASE_URL$path")"
            test "$code" = "200"
          done
          code="$(curl --silent --show-error --location --connect-timeout 20 --max-time 45 -o /tmp/me -w '%{http_code}' "$LIVE_BASE_URL/api/auth/azure/me")"
          test "$code" = "401"
          echo "LIVE AZURE READINESS: PASS"

  maestro-e2e:
    name: Maestro E2E
    needs: [master-gate, live-azure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - run: |
          set -euo pipefail
          test -s .maestro/final-release-42-screen-master.yaml
          python3 .github/scripts/verify_final_release_master.py
          echo "MAESTRO E2E: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - run: |
          set -euo pipefail
          F=.github/workflows/step20-azure-play-signing-redirect-convergence-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, azure-redirect-convergence, live-azure, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [azure-redirect-convergence, live-azure, maestro-e2e]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "AUTO-ROLLBACK: Azure mutation step restores the exact pre-Step-20 redirect set on verification failure."

  locked:
    name: Step 20 Locked
    if: ${{ always() && needs.master-gate.result == 'success' && needs.azure-redirect-convergence.result == 'success' && needs.live-azure.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    needs: [master-gate, azure-redirect-convergence, live-azure, maestro-e2e, fortress-budget, self-healing]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 20 AZURE + PLAY SIGNING REDIRECT CONVERGENCE: LOCKED"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback -> Fortress Budget"

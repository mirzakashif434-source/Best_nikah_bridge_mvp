name: SAFE COPY - Free Static Audit (No Azure)
on:
  push:
    branches: [audit/free-check-20261020]
    paths:
      - '.github/workflows/audit-copy-free-static.yml'
      - 'azure-backend/src/familyCircle.js'
      - 'app/src/main/java/com/nikahbridge/AzureAuthManager.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Source audit only - no deployment or secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch ONLY
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify audit branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "audit/free-check-20261020"
          test -f app/build.gradle
          test -f azure-backend/package.json
          echo "AUDIT BRANCH ONLY - PASS"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Semgrep static scan (no autofix, no upload)
        run: semgrep scan --config p/default --metrics off --no-git-ignore --error app/src/main/java azure-backend/src
      - name: Check Family Circle input hardening (no Azure calls)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --check azure-backend/src/familyCircle.js
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const code = fs.readFileSync('azure-backend/src/familyCircle.js','utf8');
          if (!code.includes('if(!/^[A-Za-z0-9_-]{32}$/.test(token))')) process.exit(1);
          for (let i = 0; i < 100; i++) {
            const token = crypto.randomBytes(24).toString('base64url');
            if (!/^[A-Za-z0-9_-]{32}$/.test(token)) process.exit(1);
          }
          for (const bad of ['"><script>alert(1)</script>', 'bad/token', 'abc', 'a'.repeat(33)]) {
            if (/^[A-Za-z0-9_-]{32}$/.test(bad)) process.exit(1);
          }
          const match = code.match(/const escapeHtmlAttr=([^;]+);/);
          if (!match) process.exit(1);
          const escapeHtmlAttr = new Function('return (' + match[1] + ')')();
          if (escapeHtmlAttr('a"&<>\\'b') !== 'a&quot;&amp;&lt;&gt;&#39;b') process.exit(1);
          if (!code.includes('href="${escapeHtmlAttr(openApp)}"') || !code.includes('href="${escapeHtmlAttr(play)}"')) process.exit(1);
          console.log('Family Circle HTML escaping test: PASS');
          console.log('Family Circle token syntax test: PASS');
          NODE
      - name: Setup Java 17
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android Lint (no signing, no deploy)
        if: always()
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --no-daemon --stacktrace

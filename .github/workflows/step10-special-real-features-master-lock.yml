name: Step 10 Special Real Features Master Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_10_SPECIAL_REAL_FEATURES_LOCK.md'
      - '.github/workflows/step10-special-real-features-master-lock.yml'
      - 'app/**'
      - 'azure-backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step10-special-real-features-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Preserve exact 50 Activities
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(grep -o 'android:name="\.[A-Za-z0-9_]*Activity"' app/src/main/AndroidManifest.xml | sort -u | wc -l | tr -d ' ')"
          test "$COUNT" = "50"
          echo "50 ACTIVITIES PRESERVED: PASS"

      - name: Verify 18+ and identity verification
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/com/nikahbridge
          grep -Fq 'age 18+' "$A/IdentityVerificationActivity.java"
          grep -Fq 'AGE_18_PLUS_REQUIRED' "$A/IdentityVerificationActivity.java"
          grep -Fq 'MediaStore.ACTION_IMAGE_CAPTURE' "$A/IdentityVerificationActivity.java"
          grep -Fq 'FileProvider.getUriForFile' "$A/IdentityVerificationActivity.java"
          grep -Fq 'AzureApiClient.multipart("/verification/identity"' "$A/IdentityVerificationActivity.java"
          grep -Fq 'AzureApiClient.multipart("/verification/selfie"' "$A/IdentityVerificationActivity.java"
          grep -RInq 'AGE_18_PLUS_REQUIRED' azure-backend/src
          grep -RInq 'age' azure-backend/src/ageGate.js azure-backend/src/verification.js
          echo "18+ + ID/SELFIE VERIFICATION: PASS"

      - name: Verify real four-photo verification
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq 'CAMERA_FIRST' "$F"
          grep -Fq 'GALLERY_REMAINING' "$F"
          grep -Fq 'photo-verification/start' "$F"
          grep -Fq 'photo-verification/status' "$F"
          grep -Fq 'MediaStore.ACTION_IMAGE_CAPTURE' "$F"
          test -s azure-backend/src/photoVerification.js
          grep -RInq 'photo-verification' azure-backend/src
          echo "FOUR-PHOTO VERIFICATION: PASS"

      - name: Verify Trust Passport and match evidence
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/TrustPassportActivity.java
          grep -Fq 'Trust Passport' "$F"
          grep -Fq 'real Azure/PostgreSQL evidence' "$F"
          grep -Fq 'AzureApiClient.get("/matches"' "$F"
          grep -Fq 'View Selected Trust Passport' "$F"
          echo "TRUST PASSPORT: PASS"

      - name: Verify Smart Serious Questions
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/SmartSeriousQuestionsActivity.java
          grep -Fq 'Generate Questions' "$F"
          grep -Fq 'AzureApiClient.get("/matches"' "$F"
          grep -Fq 'Questions based on real stated match information' "$F"
          echo "SMART SERIOUS QUESTIONS: PASS"

      - name: Verify Nikah Blueprint
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/NikahBlueprintActivity.java
          grep -Fq '/settings/nikah_blueprint' "$F"
          grep -Fq '/compatibility/living' "$F"
          grep -Fq 'Save My Real Nikah Blueprint' "$F"
          grep -Fq 'route:"settings/{key}"' azure-backend/src/settings.js
          grep -Fq 'setting_key=$2' azure-backend/src/settings.js
          echo "NIKAH BLUEPRINT: PASS"

      - name: Verify AI Nikah Mediator
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/NikahMediatorActivity.java
          grep -Fq '/ai/nikah-mediator' "$F"
          grep -Fq 'Run Real AI Mediation' "$F"
          grep -Fq 'I have permission to use the other person' "$F"
          grep -RInq 'nikah-mediator' azure-backend/src
          echo "AI NIKAH MEDIATOR: PASS"

      - name: Verify Future Life Simulation
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/FutureLifeSimulationActivity.java
          grep -Fq '/ai/future-life' "$F"
          grep -Fq '/settings/future_life_simulation' "$F"
          grep -Fq 'Run Real Future Life Comparison' "$F"
          grep -RInq 'future-life' azure-backend/src
          echo "FUTURE LIFE SIMULATION: PASS"

      - name: Verify Community Chat moderation and safety
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/CommunityChatActivity.java
          grep -Fq '/community/messages' "$F"
          grep -Fq '/community/reports' "$F"
          grep -Fq '/community/mutes' "$F"
          grep -Fq '/blocks' "$F"
          grep -Fq 'Maximum 500 characters' "$F"
          test -s azure-backend/src/community.js
          grep -RInq 'community/messages' azure-backend/src
          echo "COMMUNITY CHAT + MODERATION: PASS"

      - name: Verify Family Wali and Family Circle
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/com/nikahbridge
          grep -Fq '/family-links' "$A/FamilyBridge2Activity.java"
          grep -Fq '/family-links/pending-for-wali' "$A/FamilyBridge2Activity.java"
          grep -Fq '/family-circle' "$A/FamilyCircleActivity.java"
          test -s azure-backend/src/family.js
          test -s azure-backend/src/familyCircle.js
          grep -RInq 'family-links' azure-backend/src
          grep -RInq 'family-circle' azure-backend/src
          echo "FAMILY/WALI + FAMILY CIRCLE: PASS"

      - name: Verify block report safety actions
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/com/nikahbridge
          grep -Fq 'AzureApiClient.get("/blocks"' "$A/BlockedMembersActivity.java"
          grep -Fq 'AzureApiClient.delete("/blocks/' "$A/BlockedMembersActivity.java"
          grep -Fq 'AzureApiClient.post("/safety/reports"' "$A/AzureHomeActivity.java"
          test -s azure-backend/src/blocks.js
          test -s azure-backend/src/safety.js
          grep -RInq 'safety/reports' azure-backend/src
          echo "BLOCK/REPORT SAFETY: PASS"

      - name: Verify mutual-only communication and two-message protection
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/SafeCommunicationActivity.java
          grep -Fq 'Mutual-Only Safe Communication' "$F"
          grep -Fq '/conversations' "$F"
          grep -Fq '/messages' "$F"
          grep -Fq '2 messages sent' "$F"
          grep -Fq 'cannot send another message until she replies' "$F"
          test -s azure-backend/src/chat.js
          grep -RInq 'conversations' azure-backend/src/chat.js azure-backend/src/featureParity.js
          grep -RInq 'message' azure-backend/src/chat.js
          echo "MUTUAL-ONLY + TWO-MESSAGE CLIENT CONTRACT: PASS"

      - name: Verify rewarded message real AdMob flow
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/RewardedMessageActivity.java
          grep -Fq 'RewardedAd' "$F"
          grep -Fq 'ServerSideVerificationOptions' "$F"
          grep -Fq '/admob/rewarded/config' "$F"
          grep -Fq 'Maximum 2 rewarded message credits per UTC day' "$F"
          test -s azure-backend/src/rewardedAds.js
          grep -RInq 'admob/rewarded' azure-backend/src/rewardedAds.js
          echo "REWARDED MESSAGE / ADMOB SSV: PASS"

      - name: Verify premium server-backed feature gates
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/PremiumFeatureGate.java
          grep -Fq '/premium/serious-plus-summary' "$F"
          grep -Fq 'AzureApiClient.get' "$F"
          test -s azure-backend/src/premiumAccess.js
          test -s azure-backend/src/premiumPlans.js
          echo "PREMIUM FEATURE GATE: PASS"

      - name: Preserve Step 1-9 Azure and Play contracts
        shell: bash
        run: |
          set -euo pipefail

          # Play package/release identity remains fixed.
          grep -Fq "applicationId 'com.nikahbridge'" app/build.gradle
          grep -Eq 'versionCode[[:space:]]+36' app/build.gradle
          grep -Fq "versionName '2.25'" app/build.gradle
          grep -Eq 'minSdk[[:space:]]+24' app/build.gradle
          grep -Eq 'targetSdk[[:space:]]+36' app/build.gradle

          # Exact four Play Console SHA-1 identities remain locked.
          S=.github/workflows/step3-azure-auth-sha-master-lock.yml
          grep -Fq 'EXPECTED_PLAY_APP_SIGNING_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48' "$S"
          grep -Fq 'EXPECTED_PLAY_POST_QUANTUM_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67' "$S"
          grep -Fq 'EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9' "$S"
          grep -Fq 'EXPECTED_PLAY_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048' "$S"

          # Play premium 20/40/60 and Azure verification contract remain aligned.
          P=azure-backend/src/premiumPlans.js
          V=azure-backend/src/premiumPurchaseVerification.js
          grep -Fq 'planKey: "premium_basic_20"' "$P"
          grep -Fq 'planKey: "premium_plus_40"' "$P"
          grep -Fq 'planKey: "premium_vip_60"' "$P"
          test "$(grep -Fc 'billingPeriod: "monthly"' "$P")" -ge 3
          grep -Fq 'process.env.PLAY_PACKAGE_NAME || "com.nikahbridge"' "$V"
          grep -Fq 'GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL' "$V"
          grep -Fq 'GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY' "$V"

          # Prior final locks must remain present.
          for wf in             .github/workflows/step4-legacy-firebase-deep-cleanup-lock.yml             .github/workflows/step5-azure-feature-replacement-master-lock.yml             .github/workflows/step6-final-firebase-production-removal-lock.yml             .github/workflows/step7-full-50-azure-wiring-master-lock.yml             .github/workflows/step8-full-50-buttons-back-navigation-lock.yml             .github/workflows/step9-full-50-ui-safety-master-lock.yml; do
            test -s "$wf"
          done

          echo "STEP 1-9 AZURE + PLAY CONTRACTS: PRESERVED"

      - name: Firebase zero regression
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -d functions
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          echo "FIREBASE PRODUCTION RUNTIME: ZERO"

  maestro-e2e:
    name: Maestro E2E Contract
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify special feature navigation contract
        shell: bash
        run: |
          set -euo pipefail
          FLOW=.maestro/final-release-42-screen-master.yaml
          test -s "$FLOW"
          for label in             'Four-Photo Verification' 'Global Community Chat' 'Family / Wali Connect'             'Blocked Members' 'Nikah Blueprint' 'Smart Serious Questions'             'Trust Passport' 'Safe Communication' 'AI Nikah Mediator'             'Future Life Simulation' 'Earn Message Credits'; do
            grep -Fq "$label" "$FLOW"
          done
          grep -Fq 'p20.setOnClickListener(v -> buy("premium_basic_20"));' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -Fq 'p40.setOnClickListener(v -> buy("premium_plus_40"));' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -Fq 'p60.setOnClickListener(v -> buy("premium_vip_60"));' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          echo "MAESTRO SPECIAL FEATURE NAVIGATION + PLAY PREMIUM CONTRACT: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Prevent cloud mutation in Step 10
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/step10-special-real-features-master-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore temporary runner state
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Roll temporary runner back
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Step 10 Locked
    needs: [master-gate, maestro-e2e, fortress-budget, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 10 SPECIAL REAL PRODUCTION FEATURES + AZURE/PLAY PRESERVATION: LOCKED"
          echo "Special features + Step 1-9 package/SHA/premium contracts preserved"
          echo "Master Gate -> Maestro E2E Contract -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"

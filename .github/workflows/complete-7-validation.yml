name: Seven Step Production Completion Validation

on:
  push:
    branches: [complete-7-production-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Azure backend syntax
        working-directory: azure-backend
        run: |
          set -euo pipefail
          npm install
          find src -maxdepth 1 -type f -name '*.js' -print -exec node --check {} \;
          node -e "require('./src/index.js'); console.log('AZURE MODULE LOAD: PASS')"

      - name: Step 1 multilingual selector
        run: |
          grep -Fq 'Bahasa Indonesia' app/src/main/java/com/nikahbridge/LanguageManager.java
          grep -Fq 'العربية' app/src/main/java/com/nikahbridge/LanguageManager.java
          grep -Fq 'ਪੰਜਾਬੀ' app/src/main/java/com/nikahbridge/LanguageManager.java

      - name: Step 2 selfie verification
        run: |
          grep -Fq 'verification/selfie' app/src/main/java/com/nikahbridge/IdentityVerificationActivity.java
          grep -Eq 'route:[[:space:]]*"verification/selfie"' azure-backend/src/verification.js

      - name: Step 3 privacy photo switch
        run: |
          grep -Fq 'showPhotoToMatches",photos.isChecked()' app/src/main/java/com/nikahbridge/PrivacyControlCenterActivity.java

      - name: Step 4 Azure-only runtime wording
        run: |
          ! grep -RniE 'Firebase-backed activities|Loads real Firebase Storage|uploaded to Firebase Storage' app/src/main/java --include='*.java'

      - name: Step 5 match and interest wiring
        run: |
          grep -Fq 'COALESCE(u.azure_subject,u.firebase_uid)' azure-backend/src/interests.js
          grep -Fq 'Send Interest' app/src/main/java/com/nikahbridge/GenderFilteredMatchesActivity.java

      - name: No MockData
        run: |
          ! grep -Rni 'MockData' app/src/main azure-backend/src --exclude='*.md'

      - name: No sample member
        run: |
          ! grep -Rni 'sample member' app/src/main azure-backend/src --exclude='*.md'

      - name: No fake match
        run: |
          ! grep -Rni 'fake match' app/src/main azure-backend/src --exclude='*.md'

      - name: No fake balance or demo purchase
        run: |
          ! grep -RniE 'fake balance|demo purchase' app/src/main azure-backend/src --exclude='*.md'

      - name: No local test endpoints
        run: |
          ! grep -RniE 'localhost|10\.0\.2\.2' app/src/main azure-backend/src --exclude='*.md'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile Android production source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Verify production release signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed production validation release bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

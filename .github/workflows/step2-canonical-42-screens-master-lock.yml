name: Step 2 Full 50 Azure Activities Master Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_2_CANONICAL_42_SCREENS_LOCK.md'
      - '.github/workflows/step2-canonical-42-screens-master-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step2-full-50-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: app/src/main/java/com/nikahbridge
  MANIFEST: app/src/main/AndroidManifest.xml

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Lock exact full 50 activities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path("app/src/main/java/com/nikahbridge")
          manifest=Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")

          activities=[
            "AzureExternalAuthActivity","AzureHomeActivity","AzureWalletActivity","WelcomeActivity",
            "HelpLineActivity","HelpLineAdminActivity","ConversationHealthActivity","NikahJourneyActivity",
            "NikahBlueprintActivity","NikahMediatorActivity","NikahSuccessPlanActivity","NikahSuccessNetworkActivity",
            "FutureLifeSimulationActivity","SmartSeriousQuestionsActivity","MarriageTimelineMatchingActivity",
            "NikahAssistantActivity","CompatibilityDealBreakerActivity","SafeCommunicationActivity",
            "FamilyBridge2Activity","FamilyCircleActivity","TrustPassportActivity",
            "CompatibilityTrafficLightActivity","WhyWeMatchedActivity","NikahIntelligenceActivity",
            "SeriousNikahPlusActivity","AdvancedMatchFiltersActivity","OwnerEarningsActivity",
            "OwnerLiveAnalyticsActivity","WalletActivity","PremiumPlansActivity","ProductionCompletionActivity",
            "ProfilePhotoActivity","RealFourPhotoActivity","GenderFilteredMatchesActivity",
            "PrivacyControlCenterActivity","AccountDeletionActivity","TermsAndCommunityGuidelinesActivity",
            "CommunityChatActivity","BlockedMembersActivity","IdentityVerificationActivity",
            "VerificationAdminActivity","RewardedMessageActivity","LikedMeActivity","ILikedActivity",
            "ViewedMeActivity","IViewedActivity","PostVerificationFeatureHubActivity","MainActivity",
            "ProductionMainActivity","UpgradeActivity"
          ]

          assert len(activities)==50, f"Expected 50 activities, got {len(activities)}"
          assert len(set(activities))==50, "Duplicate activity in full 50 list"

          missing_files=[]
          missing_manifest=[]
          malformed=[]
          for name in activities:
              p=app/(name+".java")
              if not p.is_file() or p.stat().st_size==0:
                  missing_files.append(name)
                  continue
              text=p.read_text(encoding="utf-8")
              if f"class {name}" not in text or "onCreate" not in text:
                  malformed.append(name)
              if f'android:name=".{name}"' not in manifest:
                  missing_manifest.append(name)

          assert not missing_files, "Missing activity files: "+", ".join(missing_files)
          assert not missing_manifest, "Missing manifest registrations: "+", ".join(missing_manifest)
          assert not malformed, "Malformed activities: "+", ".join(malformed)

          registered=re.findall(r'android:name="\.([A-Za-z0-9_]+Activity)"',manifest)
          app_registered=[x for x in registered if not x.startswith("BrowserTabActivity")]
          assert len(set(app_registered))==50, f"Manifest app activity count changed: {len(set(app_registered))}"
          assert set(activities)==set(app_registered), "Manifest and locked 50 activity inventory do not match exactly"

          print("FULL AZURE APP ACTIVITY INVENTORY:",len(activities))
          print("MASTER GATE: PASS")
          PY

      - name: Preserve Azure-only production runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d azure-backend
          test -s "$APP/AzureApiClient.java"
          test -s "$APP/AzureAuthManager.java"
          test -s "$APP/AzureExternalAuthActivity.java"

          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -e .github/workflows/firebase-production-deploy.yml

          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          ! grep -RInE 'firebase-(auth|firestore|functions|storage|ai)|com\.google\.firebase|google-services' app/build.gradle build.gradle settings.gradle
          echo "AZURE ONLY / FIREBASE ZERO: PASS"

  maestro-e2e:
    name: Maestro E2E Baseline
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify launcher, auth, navigation and privileged surface
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android.intent.action.MAIN' "$MANIFEST"
          grep -Fq 'android.intent.category.LAUNCHER' "$MANIFEST"
          grep -Fq 'WelcomeActivity' "$MANIFEST"
          grep -Fq 'AzureExternalAuthActivity' "$MANIFEST"
          grep -Fq 'ProductionMainActivity' "$MANIFEST"

          grep -Fq 'AzureAuthManager' "$APP/MainActivity.java"
          grep -Fq 'AzureAuthManager' "$APP/AzureExternalAuthActivity.java"
          grep -Fq 'AzureApiClient' "$APP/AzureWalletActivity.java"
          grep -Fq 'AzureApiClient' "$APP/HelpLineAdminActivity.java"
          grep -Fq 'AzureApiClient' "$APP/VerificationAdminActivity.java"

          grep -Fq 'GenderFilteredMatchesActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'FamilyBridge2Activity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'IdentityVerificationActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'PrivacyControlCenterActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'PremiumPlansActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'NikahAssistantActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'CommunityChatActivity.class' "$APP/ProductionMainActivity.java"
          grep -Fq 'RewardedMessageActivity.class' "$APP/ProductionMainActivity.java"

          echo "MAESTRO E2E BASELINE: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Prevent Step 2 deployment or destructive mutation
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/step2-canonical-42-screens-master-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)|git[[:space:]]+push[[:space:]]+--force' "$FILE"
          echo "FORTRESS BUDGET: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore temporary runner state
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Roll temporary runner back
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Step 2 Full 50 Locked
    needs: [master-gate, maestro-e2e, fortress-budget, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 2 FULL 50 AZURE ACTIVITIES: LOCKED"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"

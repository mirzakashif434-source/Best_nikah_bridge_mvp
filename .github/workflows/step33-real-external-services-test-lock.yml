name: Step 33 Real External Services Test Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_33_REAL_EXTERNAL_SERVICES_TEST_LOCK.md'
      - '.github/workflows/step33-real-external-services-test-lock.yml'
      - 'app/**'
      - 'azure-backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step33-real-external-services-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_BASE: https://bestnikahbredge-prod-fn-dkf3ake6d8gsg7cw.eastus-01.azurewebsites.net/api
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '37'
  EXPECTED_VERSION_NAME: '2.25'
  EXPECTED_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_UPLOAD_SHA256: AF824C01B11D280C159A4C233064AB8639154C89EEE1FABB07ED2E21A58C1E7B

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Preserve Steps 1-32 and release identity
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/step32-apk-runtime-50-screen-forensic-lock.yml
          test -s STEP_32_APK_RUNTIME_50_SCREEN_FORENSIC_LOCK.md
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" app/build.gradle
          python3 .github/scripts/verify_final_release_master.py
          echo "STEPS 1-32 + RELEASE IDENTITY: PASS"

      - name: Verify real Play Billing purchase restore entitlement path
        shell: bash
        run: |
          set -euo pipefail
          P=app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          V=azure-backend/src/premiumPurchaseVerification.js
          grep -Fq 'BillingClient.newBuilder' "$P"
          grep -Fq 'queryProductDetailsAsync' "$P"
          grep -Fq 'queryPurchasesAsync' "$P"
          grep -Fq 'launchBillingFlow' "$P"
          grep -Fq 'verifyOnAzure(productId,purchase.getPurchaseToken())' "$P"
          grep -Fq '/premium/purchases/verify' "$P"
          grep -Fq '/premium/entitlement' "$P"
          grep -Fq 'androidpublisher.googleapis.com' "$V"
          grep -Fq ':acknowledge' "$V"
          grep -Fq 'premium_entitlements' "$V"
          echo "PLAY BILLING PURCHASE + RESTORE + ENTITLEMENT CONTRACT: PASS"

      - name: Verify rewarded ad + SSV path
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/com/nikahbridge/RewardedMessageActivity.java
          S=azure-backend/src/rewardedAds.js
          grep -Fq 'RewardedAd' "$A"
          grep -Fq 'ServerSideVerificationOptions' "$A"
          grep -Fq '/admob/rewarded/config' "$A"
          grep -Fq 'verifier-keys.json' "$S"
          grep -Fq 'crypto.verify("sha256"' "$S"
          grep -Fq 'message_credits = entitlements.message_credits + 1' "$S"
          echo "REWARDED AD + AZURE SSV CONTRACT: PASS"

      - name: Verify camera + exactly-three-gallery + Azure upload path
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          M=app/src/main/AndroidManifest.xml
          grep -Fq 'MediaStore.ACTION_IMAGE_CAPTURE' "$F"
          grep -Fq 'FileProvider.getUriForFile' "$F"
          grep -Fq 'Intent.ACTION_OPEN_DOCUMENT' "$F"
          grep -Fq 'Intent.EXTRA_ALLOW_MULTIPLE' "$F"
          grep -Fq 'galleryUris.size()!=3' "$F"
          grep -Fq 'AzureApiClient.multipart("/photo-verification/' "$F"
          grep -Fq 'androidx.core.content.FileProvider' "$M"
          echo "CAMERA + GALLERY + AZURE PHOTO PATH: PASS"

      - name: Verify Firebase remains zero-runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          echo "NO-FIREBASE RUNTIME: PASS"

  live-external-services:
    name: Live Azure + Identity + AdMob Reachability
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Live Azure public health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 30 "$AZURE_BASE/health")"
          python3 - "$BODY" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])
          assert o.get("ok") is True
          assert o.get("service")=="best-nikah-bridge-azure-backend"
          assert o.get("environment")=="azure"
          print("LIVE AZURE HEALTH: PASS")
          PY

      - name: Protected Azure API must reject no-token request
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --connect-timeout 15 --max-time 30 "$AZURE_BASE/auth/health")"
          test "$CODE" = "401"
          grep -Eq 'UNAUTHENTICATED|AZURE' /tmp/auth.json
          echo "LIVE PROTECTED API ENFORCEMENT: PASS"

      - name: External identity metadata and AdMob verifier keys reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30             'https://bestnikahbredge.ciamlogin.com/c4ac0560-df59-48d4-af1b-bb0ed127ce6d/v2.0/.well-known/openid-configuration' >/tmp/oidc.json
          grep -Fq '"jwks_uri"' /tmp/oidc.json
          curl --fail --silent --show-error --retry 3 --max-time 30             'https://www.gstatic.com/admob/reward/verifier-keys.json' >/tmp/admob-keys.json
          grep -Fq '"keys"' /tmp/admob-keys.json
          echo "LIVE EXTERNAL ID + ADMOB KEY INFRASTRUCTURE: PASS"

  signed-release:
    name: Signed Release APK
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge -file "$RUNNER_TEMP/upload.der"
          SHA1="$(openssl sha1 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          SHA256="$(openssl sha256 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$SHA1" = "$EXPECTED_UPLOAD_SHA1"
          test "$SHA256" = "$EXPECTED_UPLOAD_SHA256"
          chmod +x gradlew
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew clean :app:compileReleaseJavaWithJavac :app:lintRelease :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo "SIGNED RELEASE APK: PASS"
      - uses: actions/upload-artifact@v6
        with:
          name: step33-signed-external-services-candidate-v37
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  maestro-e2e:
    name: Maestro E2E
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Verify external-service navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          FLOW=.maestro/final-release-42-screen-master.yaml
          test -s "$FLOW"
          grep -Fq 'Premium Plans' "$FLOW"
          grep -Fq 'Earn Message Credits' "$FLOW"
          python3 .github/scripts/verify_final_release_master.py
          echo "MAESTRO E2E EXTERNAL-SERVICE CONTRACT: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Prevent cloud mutation and Play publishing
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/step33-real-external-services-test-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy|update)|gradle-play-publisher|publishBundle|play[[:space:]].*upload|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET + NO PLAY PUBLISH: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, live-external-services, signed-release, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, live-external-services, signed-release, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "AUTO-ROLLBACK SAFETY: Step 33 performs no Azure mutation and no Play Console publishing."

  locked:
    name: Step 33 Automatable External Services Locked
    if: ${{ always() && needs.master-gate.result == 'success' && needs.live-external-services.result == 'success' && needs.signed-release.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    needs: [master-gate, live-external-services, signed-release, maestro-e2e, fortress-budget, self-healing]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 33 AUTOMATABLE EXTERNAL SERVICES: GREEN"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback -> Fortress Budget"
          echo "NO PLAY CONSOLE UPLOAD/PUBLISH PERFORMED"
          echo "Physical-device acceptance still requires a licensed Play purchase/restore, real rewarded-ad completion, and authenticated Azure success call."

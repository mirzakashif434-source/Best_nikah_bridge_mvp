name: Step 4 UGC Terms Safety Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ugc-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify real UGC acceptance implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/TermsAndCommunityGuidelinesActivity.java
          test -f app/src/main/java/com/nikahbridge/ProfilePhotoActivity.java
          test -f functions/community.js
          test -f functions/termsCommunity.js
          test -f firestore.rules
          test -f storage.rules
          test -f child-safety.html
          grep -q 'termsAccepted' app/src/main/java/com/nikahbridge/TermsAndCommunityGuidelinesActivity.java
          grep -q 'termsAcceptedAt' app/src/main/java/com/nikahbridge/TermsAndCommunityGuidelinesActivity.java
          grep -q 'Community Guidelines' app/src/main/java/com/nikahbridge/TermsAndCommunityGuidelinesActivity.java
          grep -q 'requireTermsBeforePhotoAction' app/src/main/java/com/nikahbridge/ProfilePhotoActivity.java
          grep -q 'termsAccepted' functions/community.js
          grep -q 'exports.acceptTermsAndCommunityGuidelines' functions/termsCommunity.js
          grep -q 'TERMS_VERSION' functions/termsCommunity.js
          grep -q 'termsAccepted' firestore.rules
          grep -q 'firestore.get(/databases/(default)/documents/users/$(uid))' storage.rules
          grep -q 'termsAccepted' storage.rules
          grep -q 'report' app/src/main/java/com/nikahbridge/CommunityChatActivity.java
          grep -q 'block' app/src/main/java/com/nikahbridge/CommunityChatActivity.java
          grep -q 'moderationQueue' functions/index.js
          node --check functions/community.js
          node --check functions/termsCommunity.js
          node --check functions/index.js
          git diff --check
          echo 'STEP 4 UGC TERMS SAFETY SOURCE GATE PASSED.'

      - name: Verify no sample/test profile content was introduced
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'sample profile|fake profile|demo profile|stock profile' app/src/main/java/com/nikahbridge/TermsAndCommunityGuidelinesActivity.java app/src/main/java/com/nikahbridge/ProfilePhotoActivity.java
          echo 'No demo/fake profile content introduced by Step 4.'

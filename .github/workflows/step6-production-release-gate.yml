name: Step 6 Production Release Gate

# Additive release gate. Existing Android Release AAB workflow and all earlier
# features remain untouched. This gate builds the exact main-branch source and
# verifies that the signed artifact is suitable for the real Play Store path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release source and production-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nikahbridge/MainActivity.java
          test -f app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          test -f app/src/main/java/com/nikahbridge/RewardedMessageActivity.java
          test -f app/src/main/java/com/nikahbridge/FamilyBridge2Activity.java
          test -f functions/index.js
          test -f functions/familyBridge2.js
          grep -q "applicationId 'com.nikahbridge'" app/build.gradle
          grep -q 'versionCode 28' app/build.gradle
          grep -q "versionName '2.5'" app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'play-services-ads:25.4.0' app/build.gradle
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle
          grep -q 'billing:9.1.0' app/build.gradle
          grep -q 'APPLICATION_ID.*ca-app-pub-8897537994957088~9402403755' app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -RniE 'ca-app-pub-3940256099942544|test-ad-unit|TEST_AD_UNIT|localhost|10\.0\.2\.2' app/src/main functions --exclude='*.md'
          ! grep -RniE 'debuggable="true"|BuildConfig\.DEBUG.*true' app/src/main/AndroidManifest.xml app/src/main/java
          grep -q 'Object.assign(exports.*admobRewarded' functions/index.js
          grep -q 'Object.assign(exports.*familyBridge2' functions/index.js
          grep -q 'createFamilyBridgeV2' functions/familyBridge2.js
          grep -q 'respondFamilyBridgeV2' functions/familyBridge2.js
          grep -q 'sendFamilyQuestionV2' functions/familyBridge2.js
          grep -q 'setFamilyBridgeConsentV2' functions/familyBridge2.js
          grep -q 'getHttpsCallable("sendLike")' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -q 'getHttpsCallable("claimRewardedMessageCredit")' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          node --check functions/index.js
          node --check functions/familyBridge2.js
          git diff --check

      - name: Verify production release signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build exact signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed AAB identity and signature
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          keytool -printcert -jarfile "$AAB" | grep -q 'Owner:'
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          sha256sum "$AAB" | tee app-release-aab.sha256

      - name: Scan final AAB for forbidden test endpoints and test AdMob IDs
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" > "$RUNNER_TEMP/aab-list.txt"
          ! grep -Eiq 'testOnly|localhost|10\.0\.2\.2' "$RUNNER_TEMP/aab-list.txt"
          mkdir -p "$RUNNER_TEMP/dex"
          unzip -q "$AAB" 'base/dex/*.dex' -d "$RUNNER_TEMP/dex" || true
          find "$RUNNER_TEMP/dex" -type f -name '*.dex' -print0 | xargs -0 -r strings > "$RUNNER_TEMP/aab-strings.txt"
          ! grep -Eiq 'ca-app-pub-3940256099942544|localhost|10\.0\.2\.2' "$RUNNER_TEMP/aab-strings.txt"

      - name: Upload signed Step 6 release candidate and checksum
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-step6-release-candidate
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app-release-aab.sha256
          if-no-files-found: error

      - name: Print release gate result
        run: |
          echo 'STEP 6 RELEASE GATE PASSED: signed AAB built and production-only checks passed.'
          echo 'Real-device smoke testing and Play Console submission remain operational release steps.'

name: Azure Additive Backend + Android Verification

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - 'azure-backend/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/azure-additive-backend-verify.yml'
      - '.github/workflows/azure-backend-deploy.yml'
      - '.github/workflows/step8-azure-final-full-app-gate.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: azure-additive-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact cutover source
        uses: actions/checkout@v5

      - name: Verify Firebase runtime is retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -d functions
          test ! -e firebase.json
          test ! -e firestore.indexes.json
          test ! -e firestore.rules
          test ! -e storage.rules
          test ! -e .github/workflows/firebase-production-deploy.yml
          ! grep -RInE 'import[[:space:]]+com\.google\.firebase|FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable' app/src/main/java --include='*.java'
          ! grep -InE 'firebase-(auth|firestore|functions|storage|ai)|com\.google\.firebase|google-services' app/build.gradle build.gradle settings.gradle
          echo "FIREBASE RUNTIME RETIRED: PASS"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install

      - name: Validate Azure backend modules
        working-directory: azure-backend
        run: |
          set -euo pipefail
          find src -maxdepth 1 -type f -name '*.js' -print -exec node --check {} \;
          node -e "require('./src/index.js'); console.log('AZURE MODULE LOAD: PASS')"

      - name: Verify Azure production routes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'require("./featureParity")' azure-backend/src/index.js
          grep -Fq 'verifyAzureExternalIdToken' azure-backend/src/auth.js
          grep -Fq 'ensureAzureUser' azure-backend/src/auth.js
          grep -Eq 'route:[[:space:]]*"auth/azure/me"' azure-backend/src/azureExternalAuth.js
          grep -Eq 'route:[[:space:]]*"profile"' azure-backend/src/profile.js
          grep -Eq 'route:[[:space:]]*"blocks"' azure-backend/src/blocks.js
          grep -Eq 'route:[[:space:]]*"admin/verifications"' azure-backend/src/verification.js
          grep -Eq 'route:[[:space:]]*"help/ask"' azure-backend/src/helpLine.js
          grep -Eq 'route:[[:space:]]*"owner/earnings"' azure-backend/src/ownerEarnings.js
          grep -Eq 'route:[[:space:]]*"journey/summary"' azure-backend/src/journeySummary.js
          grep -Fq 'releaseGate:"2026-09-25-zero-known-issue-final"' azure-backend/src/releaseReadiness.js
          grep -Eq 'route:[[:space:]]*"premium/plans"' azure-backend/src/premiumPlans.js
          grep -Fq 'plan_key = ANY($1::text[])' azure-backend/src/premiumPlans.js
          grep -Fq "WHERE plan_key IN ('premium_monthly','premium_yearly')" azure-backend/database/schema.sql
          grep -Eq "SET active = FALSE" azure-backend/database/schema.sql
          grep -Eq 'route:[[:space:]]*"community/messages"' azure-backend/src/community.js
          grep -Fq 'getProfilePhotosContainer' azure-backend/src/photos.js
          grep -Fq 'getVerificationDocumentsContainer' azure-backend/src/verification.js
          for route in 'likes' 'entitlements/free-boost' 'connections/{connectionId}/nikah-promise' 'compatibility/living' 'compatibility/living/share' 'connections/{connectionId}/health-check'; do
            grep -Eq 'route:[[:space:]]*"'"$route"'"' azure-backend/src/featureParity.js
          done
          echo "AZURE PRODUCTION ROUTES: PASS"

      - name: Verify Owner Wallet Google Play to Al Rajhi tracking
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'available_usd_minor' azure-backend/database/schema.sql
          grep -Fq 'pending_usd_minor' azure-backend/database/schema.sql
          grep -Fq 'settled_usd_minor' azure-backend/database/schema.sql
          grep -Fq '"USD"' azure-backend/src/ownerEarnings.js
          grep -Eq 'route:[[:space:]]*"admin/owner/provider-settlement"' azure-backend/src/ownerEarnings.js
          grep -Fq 'providerPayouts' azure-backend/src/ownerEarnings.js
          grep -Fq 'Owner Wallet — Google Play → Al Rajhi' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'Record Google Payout Received' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'Set Al Rajhi Payout Tracking' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'AzureApiClient.post("/admin/owner/provider-settlement"' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          echo "OWNER WALLET GOOGLE PLAY → AL RAJHI TRACKING: PASS"

      - name: Verify locked 2030 premium design
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/Premium2030Ui.java
          grep -Fq 'Faith • Family • Trust • A Brighter Tomorrow' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -Fq 'Meaningful Matches • Verified Profiles • Private & Safe' app/src/main/java/com/nikahbridge/AzureHomeActivity.java
          grep -Fq 'Family / Wali Connect' app/src/main/java/com/nikahbridge/FamilyBridge2Activity.java
          grep -Fq 'Privacy Control Center' app/src/main/java/com/nikahbridge/PrivacyControlCenterActivity.java
          grep -Fq 'Identity Verification' app/src/main/java/com/nikahbridge/IdentityVerificationActivity.java
          grep -Fq 'Meaningful matches for a brighter halal future' app/src/main/java/com/nikahbridge/GenderFilteredMatchesActivity.java
          grep -Fq 'Go Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          echo "LOCKED 2030 PREMIUM DESIGN: PASS"

      - name: Verify six final Android cutover screens
        shell: bash
        run: |
          set -euo pipefail
          for f in             app/src/main/java/com/nikahbridge/ProductionMainActivity.java             app/src/main/java/com/nikahbridge/MainActivity.java             app/src/main/java/com/nikahbridge/HelpLineActivity.java             app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java             app/src/main/java/com/nikahbridge/VerificationAdminActivity.java             app/src/main/java/com/nikahbridge/BlockedMembersActivity.java; do
            test -f "$f"
            ! grep -nE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' "$f"
          done
          grep -Fq 'AzureAuthManager' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -Fq 'AzureAuthManager' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -Fq 'AzureApiClient.post("/help/ask"' app/src/main/java/com/nikahbridge/HelpLineActivity.java
          grep -Fq 'AzureApiClient.get("/owner/earnings"' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'AzureApiClient.get("/admin/verifications"' app/src/main/java/com/nikahbridge/VerificationAdminActivity.java
          grep -Fq 'AzureApiClient.get("/blocks"' app/src/main/java/com/nikahbridge/BlockedMembersActivity.java
          grep -Fq 'AUTH_TIMEOUT_MS=12000L' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -Fq 'AZURE_AUTH_TIMEOUT' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -Fq 'AtomicBoolean' app/src/main/java/com/nikahbridge/AzureApiClient.java
          echo "SIX ANDROID CUTOVER SCREENS: PASS"
          echo "AZURE API CLIENT TIMEOUT GUARD: PASS"

      - name: Verify 18-issue final repair gate
        shell: bash
        run: |
          set -euo pipefail
          APP=app/src/main/java/com/nikahbridge

          # Step 4: premium catalog cannot map unknown legacy rows into runtime config.
          grep -Fq 'plan_key = ANY($1::text[])' azure-backend/src/premiumPlans.js

          # Steps 5/6/19/25/26/27: no raw technical IDs in user-facing fields.
          ! grep -Fq 'Real recipient user ID' "$APP/AzureHomeActivity.java"
          ! grep -Fq 'Family link ID' "$APP/AzureHomeActivity.java"
          ! grep -Fq 'Wali phone E.164' "$APP/AzureHomeActivity.java"
          ! grep -Fq 'Family link ID' "$APP/FamilyBridge2Activity.java"
          ! grep -Fq 'Wali phone (E.164)' "$APP/FamilyBridge2Activity.java"
          grep -Fq 'family-links/pending-for-wali' "$APP/FamilyBridge2Activity.java"
          grep -Fq 'Verify This Wali Request' "$APP/FamilyBridge2Activity.java"
          grep -Fq 'Revoke This Wali Connection' "$APP/FamilyBridge2Activity.java"
          ! grep -Fq 'Real matched member ID' "$APP/SmartSeriousQuestionsActivity.java"
          ! grep -Fq 'Real member ID' "$APP/FamilyCircleActivity.java"
          ! grep -Fq 'Real matched member ID' "$APP/TrustPassportActivity.java"
          ! grep -Fq 'Conversation ID from a real mutual connection' "$APP/SafeCommunicationActivity.java"
          ! grep -Fq 'Real matched member ID' "$APP/CompatibilityDealBreakerActivity.java"
          ! grep -Fq 'Real matched member ID' "$APP/CompatibilityTrafficLightActivity.java"
          grep -Fq 'matchChoices.addView(choose' "$APP/SmartSeriousQuestionsActivity.java"
          grep -Fq 'matchChoices.addView(choose' "$APP/FamilyCircleActivity.java"
          grep -Fq 'matchChoices.addView(choose' "$APP/TrustPassportActivity.java"
          grep -Fq 'matchChoices.addView(choose' "$APP/CompatibilityDealBreakerActivity.java"
          grep -Fq 'matchChoices.addView(choose' "$APP/CompatibilityTrafficLightActivity.java"

          # Step 13: silent token refresh must not unexpectedly launch interactive auth.
          python3 - <<'PY'
          from pathlib import Path
          t=Path("app/src/main/java/com/nikahbridge/AzureAuthManager.java").read_text()
          start=t.index("private static void acquireTokenSilentForWaiters()")
          end=t.index("static void acquireTokenInteractive(", start)
          silent=t[start:end]
          assert "acquireTokenInteractiveForWaiters();" not in silent, "Silent auth still launches interactive sign-in"
          print("SILENT AUTH NAVIGATION: PASS")
          PY

          # Step 14: rewarded config is account-level; no completed/visible-profile gate.
          python3 - <<'PY'
          from pathlib import Path
          t=Path("azure-backend/src/rewardedAds.js").read_text()
          start=t.index("async function activeRewardedUser")
          end=t.index('app.http("getRewardedAdConfig"', start)
          block=t[start:end]
          assert "profile_completed" not in block
          assert "is_visible" not in block
          print("REWARDED ACCOUNT ELIGIBILITY: PASS")
          PY
          ! grep -Fq 'Azure rewarded configuration unavailable.' "$APP/RewardedMessageActivity.java"

          # Step 16: Terms title must wrap rather than use clipped fixed-height title rows.
          ! grep -Fq 'content.addView(title,new LinearLayout.LayoutParams(-1,dp(65)))' "$APP/TermsAndCommunityGuidelinesActivity.java"
          grep -Fq 'title.setMaxLines(2)' "$APP/TermsAndCommunityGuidelinesActivity.java"

          # Step 17: one reliable Azure summary endpoint replaces the fragile six-call chain.
          grep -Fq 'AzureApiClient.get("/journey/summary"' "$APP/NikahJourneyActivity.java"
          grep -Eq 'route:[[:space:]]*"journey/summary"' azure-backend/src/journeySummary.js
          ! grep -Fq 'Some Azure journey data could not be loaded' "$APP/NikahJourneyActivity.java"
          ! grep -Fq 'Currently visible:' "$APP/NikahJourneyActivity.java"
          ! grep -Fq 'hadLoadError' "$APP/NikahJourneyActivity.java"
          grep -Fq 'Journey service is temporarily unavailable. Tap Refresh My Journey.' "$APP/NikahJourneyActivity.java"
          grep -Fq 'Journey progress:' "$APP/NikahJourneyActivity.java"
          grep -Fq 'btn("Back",false)' "$APP/NikahJourneyActivity.java"
          grep -Fq 'refresh=btn("Refresh My Journey",true)' "$APP/NikahJourneyActivity.java"

          # Steps 20-24 + Future Simulation + Step 30: keep source Activity alive so Back never lands on a blank screen.
          python3 - <<'PY'
          from pathlib import Path
          t=Path("app/src/main/java/com/nikahbridge/PremiumFeatureGate.java").read_text()
          marker='.setPositiveButton("View Plans"'
          start=t.index(marker)
          end=t.index('.setNegativeButton("Not now"', start)
          block=t[start:end]
          assert "PremiumPlansActivity.class" in block
          assert "a.finish()" not in block, "View Plans still destroys the source Activity"
          print("PREMIUM BACK STACK: PASS")
          PY

          # Step 31: Refresh must visibly confirm real Azure refresh.
          grep -Fq 'Refreshed from Azure at' "$APP/NikahSuccessPlanActivity.java"
          grep -Fq 'Real progress refreshed from Azure.' "$APP/NikahSuccessPlanActivity.java"

          # Steps 34/35: stale backend-release/deployment placeholders are forbidden.
          ! grep -Fq 'not available in this backend release' "$APP/OwnerLiveAnalyticsActivity.java"
          ! grep -Fq 'updating on Azure' "$APP/OwnerEarningsActivity.java"
          grep -Fq 'owner/live-analytics' azure-backend/src/ownerAnalytics.js
          grep -Fq 'owner/earnings' azure-backend/src/ownerEarnings.js

          # Step 3 final lock: Owner Live Analytics must use the real GET route and complete screen controls.
          grep -Fq 'AzureApiClient.get("/owner/live-analytics"' "$APP/OwnerLiveAnalyticsActivity.java"
          ! grep -Fq 'AzureApiClient.get("/admin/owner/live-analytics"' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'button("Refresh Live Dashboard",true)' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'button("Open Owner Wallet / Payout",true)' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'button("Back",false)' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'back.setOnClickListener(v->finish())' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'ScrollView' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'WindowInsetsCompat.Type.systemBars()' "$APP/OwnerLiveAnalyticsActivity.java"
          grep -Fq 'route:"owner/live-analytics"' azure-backend/src/ownerAnalytics.js

          # Step 4 final lock: safety reports must use a real Azure member chooser, never raw technical IDs.
          ! grep -Fq 'Reported real user ID' "$APP/AzureHomeActivity.java"
          ! grep -Fq 'Reported user ID required' "$APP/AzureHomeActivity.java"
          grep -Fq 'Choose Member to Report' "$APP/AzureHomeActivity.java"
          grep -Fq 'AzureApiClient.get("/matches"' "$APP/AzureHomeActivity.java"
          grep -Fq 'selectedReportedUserId' "$APP/AzureHomeActivity.java"
          grep -Fq 'AzureApiClient.post("/safety/reports"' "$APP/AzureHomeActivity.java"
          grep -Fq 'route: "safety/reports"' azure-backend/src/safety.js
          grep -Fq 'Button back=button("Back",false);back.setOnClickListener(v->home());' "$APP/AzureHomeActivity.java"

          # Step 5 final lock: no user-facing raw member/conversation identifiers anywhere in Android UI source.
          ! grep -RInF 'Member ID:' "$APP" --include='*.java'
          ! grep -RInF 'Real member ID' "$APP" --include='*.java'
          ! grep -RInF 'Real matched member ID' "$APP" --include='*.java'
          ! grep -RInF 'Reported real user ID' "$APP" --include='*.java'
          ! grep -RInF 'Reported user ID required' "$APP" --include='*.java'
          ! grep -RInF 'Conversation ID from a real mutual connection' "$APP" --include='*.java'
          grep -Fq 'Secure member IDs stay hidden.' "$APP/FamilyCircleActivity.java"
          grep -Fq 'Secure member IDs stay hidden.' "$APP/CompatibilityDealBreakerActivity.java"
          grep -Fq 'Secure member IDs stay hidden.' "$APP/CompatibilityTrafficLightActivity.java"

          # Step 36: successful wallet refresh and transaction refresh are explicit.
          grep -Fq 'Wallet refreshed from Azure' "$APP/AzureWalletActivity.java"
          grep -Fq 'Azure transactions refreshed' "$APP/AzureWalletActivity.java"

          echo "18-ISSUE FINAL REPAIR GATE: PASS"

      - name: Locked feature regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_locked_feature_contracts.py

      - name: Self-Healing + Auto-Rollback regression lock
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/azure-backend-deploy.yml
          grep -Fq 'Production readiness and health gate — first pass' "$WF"
          grep -Fq 'Self-heal Azure runtime after transient production failure' "$WF"
          grep -Fq 'Production readiness and health gate — after self-heal' "$WF"
          grep -Fq 'Prepare last-known-good Golden backend rollback' "$WF"
          grep -Fq 'Auto-rollback Azure backend to last known-good Golden release' "$WF"
          grep -Fq 'Verify production after Golden rollback' "$WF"
          grep -Fq 'Self-Healing Golden Master result' "$WF"
          echo "SELF-HEALING + AUTO-ROLLBACK: LOCKED ABOVE GOLDEN"

      - name: Fortress Budget Regression lock
        shell: bash
        run: |
          set -euo pipefail
          WF=.github/workflows/azure-backend-deploy.yml
          test -f FORTRESS_BUDGET_MODE.md
          grep -Fq -- '--instance-memory 512 --maximum-instance-count 20' "$WF"
          grep -Fq 'always-ready delete' "$WF"
          grep -Fq 'AZURE_DB_POOL_MAX=3' "$WF"
          grep -Fq 'AI_DAILY_LIMIT_VIP=12' "$WF"
          ! grep -Fq 'AI_DAILY_LIMIT_PLUS=' "$WF"
          grep -Fq 'aiAdvanced:vip' azure-backend/src/premiumAccess.js
          ! grep -Fq 'premium_plus_40' azure-backend/src/costGuard.js
          grep -Fq 'AI_NIKAH_MAX_TOKENS=350' "$WF"
          grep -Fq 'AI_ADVANCED_MAX_TOKENS=500' "$WF"
          grep -Fq 'bnb-verification-documents-cool' "$WF"
          grep -Fq 'max: Number(process.env.AZURE_DB_POOL_MAX || 3)' azure-backend/src/db.js
          grep -Fq 'positiveInt("AI_DAILY_LIMIT_VIP", 12)' azure-backend/src/costGuard.js
          python3 - <<'PY'
          import json
          d=json.load(open("azure-backend/host.json"))
          s=d["logging"]["applicationInsights"]["samplingSettings"]
          assert s["isEnabled"] is True
          assert s["maxTelemetryItemsPerSecond"] == 2
          assert "Exception" in s["excludedTypes"]
          print("FORTRESS TELEMETRY SAMPLING: PASS")
          PY
          echo "FORTRESS BUDGET REGRESSION: LOCKED ABOVE SELF-HEALING"

      - name: Golden+ protection stack contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Self-Healing + Auto-Rollback architecture lock' .github/workflows/azure-backend-deploy.yml
          grep -Fq 'Fortress Budget Regression — locked production contract' .github/workflows/azure-backend-deploy.yml
          echo "GOLDEN+ STACK: APP + SELF-HEALING + AUTO-ROLLBACK + FORTRESS BUDGET"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Compile Android production source
        run: ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Prepare production signing and Azure redirect URI
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null
          HASH="$(keytool -exportcert -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | openssl base64 -A)"
          python3 - "$HASH" <<'PY'
          import json, pathlib, re, sys
          h=sys.argv[1]
          p=pathlib.Path("app/src/main/res/raw/auth_config.json")
          d=json.loads(p.read_text())
          d["redirect_uri"]="msauth://com.nikahbridge/"+h.replace("=", "%3D")
          p.write_text(json.dumps(d, indent=2)+"\n")
          p=pathlib.Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'(android:scheme="msauth" android:host="com\.nikahbridge" android:path="/)[^"]+(")', rf'\g<1>{h}\g<2>', s)
          p.write_text(s)
          PY

      - name: Build signed release APK and Play Store AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-azure-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-azure-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      - name: Step 8 final full app Azure validation
        shell: bash
        run: |
          set -euo pipefail
          echo "STEP 8: final Azure app audit"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("app/src/main/java/com/nikahbridge")
          activities=sorted(root.glob("*Activity.java"))
          assert len(activities) >= 46, f"Expected >=46 activities, found {len(activities)}"

          no_scroll=[]
          for p in activities:
              if p.name=="MainActivity.java":
                  continue
              t=p.read_text(encoding="utf-8")
              if "ScrollView" not in t:
                  no_scroll.append(p.name)
          assert not no_scroll, "Screens without ScrollView: "+", ".join(no_scroll)

          back_exempt={"WelcomeActivity.java","MainActivity.java","ProductionMainActivity.java","AzureHomeActivity.java"}
          no_back=[]
          for p in activities:
              if p.name in back_exempt:
                  continue
              if "Back" not in p.read_text(encoding="utf-8"):
                  no_back.append(p.name)
          assert not no_back, "Screens missing Back navigation: "+", ".join(no_back)

          for name in ["AzureHomeActivity.java","AzureWalletActivity.java","WalletActivity.java"]:
              t=(root/name).read_text(encoding="utf-8")
              assert "setText(body)" not in t, f"Raw JSON remains in {name}"
              assert "setMessage(body)" not in t, f"Raw JSON dialog remains in {name}"

          app=(root/"NikahBridgeApplication.java").read_text(encoding="utf-8")
          assert "applySafeInsets(a)" in app, "Safe system insets missing"
          assert "normalizeControls(a)" in app, "Responsive control normalization missing"
          assert "WindowInsetsCompat.Type.systemBars()" in app, "System bar handling missing"

          bad_null=[]
          bad_alpha=[]
          for p in root.glob("*.java"):
              t=p.read_text(encoding="utf-8")
              if "null null" in t:
                  bad_null.append(p.name)
              if re.search(r"setAlpha\(0\.[0-4]|alpha\s*=\s*0\.[0-4]",t):
                  bad_alpha.append(p.name)
          assert not bad_null, "null null remains: "+", ".join(bad_null)
          assert not bad_alpha, "blur-like alpha remains: "+", ".join(bad_alpha)

          print("STEP 8 UI/SCREEN/NAVIGATION AUDIT: PASS")
          PY
          grep -Fq 'Go Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          grep -Fq 'Owner Wallet' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'Permanently Delete Account' app/src/main/java/com/nikahbridge/AccountDeletionActivity.java
          grep -Fq 'AzureApiClient.delete("/account"' app/src/main/java/com/nikahbridge/AccountDeletionActivity.java
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|getHttpsCallable|com\.google\.firebase' app/src/main/java --include='*.java'

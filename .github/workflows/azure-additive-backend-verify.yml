          gh attestation verify app/build/outputs/bundle/release/app-release.aab -R "$GITHUB_REPOSITORY"
          echo "GOLDEN ARTIFACT ATTESTATION VERIFY: PASS"

      - name: Freeze immutable Golden commit tag
        env:

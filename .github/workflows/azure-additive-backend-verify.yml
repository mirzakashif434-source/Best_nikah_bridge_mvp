# Final production verification build after Azure API admin consent — preserve all existing work
# Trigger after Azure External ID scope-request fix
# Build trigger: Azure External ID scope fix 4edfc5e7
name: Azure Additive Backend + Android Verification

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - 'azure-backend/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/azure-additive-backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install

      - name: Validate Azure backend JavaScript
        working-directory: azure-backend
        run: |
          test -d src
          find src -maxdepth 1 -type f -name '*.js' -print -exec node --check {} \;

      # Step 2: Azure owner earnings is the production ledger/dashboard path.
      - name: Verify Step 2 Azure owner earnings path
        run: |
          grep -Fq 'require("./ownerEarnings")' azure-backend/src/index.js
          grep -Fq 'route:"admin/owner/earnings"' azure-backend/src/ownerEarnings.js
          grep -Fq 'route:"admin/owner/settlement-profile"' azure-backend/src/ownerEarnings.js
          grep -Fq 'route:"admin/owner/provider-settlement"' azure-backend/src/ownerEarnings.js
          grep -Fq 'route:"admin/owner/settlements"' azure-backend/src/ownerEarnings.js
          grep -Fq 'route:"admin/owner/settlements/{id}/paid"' azure-backend/src/ownerEarnings.js
          grep -Fq 'CREATE TABLE IF NOT EXISTS owner_earnings' azure-backend/database/schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS owner_earnings_summary' azure-backend/database/schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS owner_settlement_profile' azure-backend/database/schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS owner_provider_settlements' azure-backend/database/schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS owner_settlements' azure-backend/database/schema.sql
          echo "Step 2 Azure owner earnings/settlement ledger verified; legacy Firebase owner earnings remains preserved."

      # Step 3: migrated Firebase Functions UI call-sites use Azure APIs.
      - name: Verify Step 3 Firebase Functions to Azure migration
        run: |
          for f in app/src/main/java/com/nikahbridge/PremiumPlansActivity.java app/src/main/java/com/nikahbridge/RewardedMessageActivity.java app/src/main/java/com/nikahbridge/CommunityChatActivity.java; do
            if grep -nE 'FirebaseFunctions|getHttpsCallable|firebase-functions|FirebaseAuth|FirebaseFirestore|FirebaseUser' "$f"; then
              echo "Legacy Firebase client call/import found in $f"
              exit 1
            fi
          done
          grep -Eq 'route:[[:space:]]*"premium/plans"' azure-backend/src/premiumPlans.js
          grep -Eq 'route:[[:space:]]*"premium/entitlement"' azure-backend/src/premiumPurchaseVerification.js
          grep -Eq 'route:[[:space:]]*"premium/purchases/verify"' azure-backend/src/premiumPurchaseVerification.js
          grep -Eq 'route:[[:space:]]*"admob/rewarded/config"' azure-backend/src/rewardedAds.js
          grep -Eq 'route:[[:space:]]*"community/messages"' azure-backend/src/community.js
          grep -Eq 'route:[[:space:]]*"community/reports"' azure-backend/src/community.js
          echo "Step 3 Azure API migration verified; legacy Firebase backend remains preserved for rollback."

      # Step 4: Firestore collection parity against Azure PostgreSQL.
      - name: Verify Step 4 Firestore to Azure PostgreSQL parity schema
        run: |
          set -euo pipefail
          schema="azure-backend/database/schema.sql"
          for table in users profiles partner_preferences interests conversations messages family_links verifications photos safety_reports blocked_users privacy_settings entitlements rewarded_ad_transactions daily_reward_claims premium_plans premium_purchase_tokens premium_entitlements wallet_accounts wallet_ledger wallet_withdrawals community_messages community_mutes community_reports community_rate_limits help_line_tickets owner_earnings owner_earnings_summary owner_settlement_profile owner_provider_settlements owner_settlements user_settings wali_connections family_bridges family_bridge_participants family_bridge_questions deletion_requests moderation_queue risk_signals play_purchases public_config admin_records; do
            grep -Eq "CREATE TABLE IF NOT EXISTS $table" "$schema"
          done
          grep -Fq 'firebase_uid TEXT UNIQUE' "$schema"
          grep -Fq 'azure_subject TEXT' "$schema"
          echo "Step 4 Azure PostgreSQL parity schema verified. Firebase schema/config remains preserved for controlled cutover."

      # STEP 4 LOCKED CHECKPOINT: Firestore parity schema is verified against Azure PostgreSQL.
      # Existing Firebase data/config is intentionally preserved until final tested cutover.
      - name: Lock Step 4 Azure PostgreSQL parity checkpoint
        run: |
          set -euo pipefail
          grep -Eq 'CREATE TABLE IF NOT EXISTS users' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS profiles' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS interests' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS conversations' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS messages' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS family_bridges' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS verifications' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS privacy_settings' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS deletion_requests' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS moderation_queue' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS risk_signals' azure-backend/database/schema.sql
          grep -Eq 'CREATE TABLE IF NOT EXISTS public_config' azure-backend/database/schema.sql
          grep -Fq 'azure_subject TEXT' azure-backend/database/schema.sql
          echo "STEP 4 LOCKED: Azure PostgreSQL parity checkpoint verified; Firebase retained only for controlled final cutover."

      # Step 5: Firebase Storage -> Azure Blob Storage production path.
      - name: Verify Step 5 Azure Blob Storage migration
        run: |
          set -euo pipefail
          grep -Eq 'require\("./storage"\)' azure-backend/src/photos.js
          grep -Fq 'getProfilePhotosContainer' azure-backend/src/photos.js
          grep -Fq 'getVerificationDocumentsContainer' azure-backend/src/verification.js
          grep -Eq 'route:"photos"' azure-backend/src/photos.js
          grep -Eq 'route:"photos/\{photoId\}/content"' azure-backend/src/photos.js
          grep -Eq 'route:"verification/identity"' azure-backend/src/verification.js
          grep -Fq 'AZURE_STORAGE_ACCOUNT_URL' azure-backend/src/storage.js
          grep -Fq 'new BlobServiceClient' azure-backend/src/storage.js
          for f in app/src/main/java/com/nikahbridge/ProfilePhotoActivity.java app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java; do
            if grep -nE 'FirebaseStorage|StorageReference|FirebaseFirestore|FirebaseAuth|FirebaseFunctions' "$f"; then
              echo "Legacy Firebase storage/auth client path found in $f"
              exit 1
            fi
          done
          grep -Eq 'CREATE TABLE IF NOT EXISTS photos' azure-backend/database/schema.sql
          grep -Fq 'document_blob_key TEXT' azure-backend/database/schema.sql
          echo "Step 5 Azure Blob Storage production path verified; Firebase Storage remains preserved for controlled final cutover."

      # Step 6: Azure External ID is the production authentication authority.
      - name: Verify Step 6 Azure External ID authentication cutover
        run: |
          set -euo pipefail
          grep -Fq 'AZURE_AUTH_ONLY || "true"' azure-backend/src/auth.js
          grep -Fq 'verifyAzureExternalIdToken' azure-backend/src/auth.js
          grep -Fq 'ensureAzureUser' azure-backend/src/auth.js
          grep -Fq 'azure_subject' azure-backend/src/azureExternalAuth.js
          grep -Fq 'firebase_uid' azure-backend/src/azureExternalAuth.js
          grep -Fq 'Azure External ID is now the primary production entry path.' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -Fq 'API_SCOPE' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq 'access_as_user' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq 'route:"auth/azure/me"' azure-backend/src/azureExternalAuth.js
          echo "STEP 6 VERIFIED: Azure External ID is the default production auth authority; Firebase auth code remains preserved for controlled rollback."

      # STEP 5 + 6 LOCKED CHECKPOINT: Azure Blob + Azure External ID are verified production paths.
      - name: Lock Step 5 Azure Blob Storage checkpoint
        run: |
          set -euo pipefail
          grep -Fq 'new BlobServiceClient' azure-backend/src/storage.js
          grep -Fq 'getProfilePhotosContainer' azure-backend/src/photos.js
          grep -Fq 'getVerificationDocumentsContainer' azure-backend/src/verification.js
          grep -Fq 'AZURE_STORAGE_ACCOUNT_URL' azure-backend/src/storage.js
          echo "STEP 5 LOCKED: Azure Blob Storage production path verified; Firebase Storage retained for final cutover."

      - name: Lock Step 6 Azure External ID checkpoint
        run: |
          set -euo pipefail
          grep -Fq 'AZURE_AUTH_ONLY || "true"' azure-backend/src/auth.js
          grep -Fq 'verifyAzureExternalIdToken' azure-backend/src/auth.js
          grep -Fq 'ensureAzureUser' azure-backend/src/auth.js
          grep -Fq 'azure_subject' azure-backend/src/azureExternalAuth.js
          grep -Fq 'access_as_user' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          echo "STEP 6 LOCKED: Azure External ID production authentication verified; Firebase auth retained for controlled final cutover."

      # Step 7: Azure AI is the production path. Firebase AI dependency/code remains untouched for rollback compatibility.
      - name: Verify Azure AI production path
        run: |
          grep -q 'route: "ai/nikah-assistant"' azure-backend/src/aiNikahAssistant.js
          grep -q 'AzureApiClient.post("/ai/nikah-assistant"' app/src/main/java/com/nikahbridge/NikahAssistantActivity.java
          grep -Fq 'route:"ai/nikah-mediator"' azure-backend/src/aiCompatibility.js
          grep -Fq 'route:"ai/future-life"' azure-backend/src/aiCompatibility.js
          grep -Fq 'Azure External ID is now the primary production entry path.' app/src/main/java/com/nikahbridge/MainActivity.java
          echo "Azure AI compatibility endpoints and primary Android paths verified; legacy Firebase AI remains preserved for rollback."

      # Step 7: Azure AI is the production path; no Firebase AI client calls remain in Android.
      - name: Verify Step 7 Azure AI production path
        run: |
          set -euo pipefail
          grep -Fq 'route: "ai/nikah-assistant"' azure-backend/src/aiNikahAssistant.js
          grep -Fq 'route:"ai/nikah-mediator"' azure-backend/src/aiCompatibility.js
          grep -Fq 'route:"ai/future-life"' azure-backend/src/aiCompatibility.js
          grep -Fq 'AzureApiClient.post("/ai/nikah-assistant"' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -Fq 'AzureApiClient.post("/ai/nikah-assistant"' app/src/main/java/com/nikahbridge/NikahAssistantActivity.java
          if grep -nE 'FirebaseAI|GenerativeModel|GenerativeModelFutures|GenerativeBackend|GenerateContentResponse' app/src/main/java/com/nikahbridge/MainActivity.java; then
            echo "Legacy Firebase AI client path found in MainActivity"
            exit 1
          fi
          grep -Fq 'AZURE_AI_ENDPOINT' azure-backend/src/aiNikahAssistant.js
          grep -Fq 'AZURE_AI_MODEL' azure-backend/src/aiNikahAssistant.js
          grep -Fq 'https://cognitiveservices.azure.com/.default' azure-backend/src/aiNikahAssistant.js
          echo "STEP 7 VERIFIED: Android AI uses Azure API and backend uses Azure AI endpoint/model with managed identity."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Compile Android source before Step 3 lock
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace


      - name: Prepare stable Azure Android redirect URI from production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null
          HASH="$(keytool -exportcert -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | openssl base64 -A)"
          REDIRECT="msauth://com.nikahbridge/${HASH}"
          echo "Stable Azure Android redirect URI: ${REDIRECT}"
          python3 - "$HASH" <<'PY'
          import json, pathlib, re, sys
          h=sys.argv[1]
          p=pathlib.Path("app/src/main/res/raw/auth_config.json")
          d=json.loads(p.read_text())
          d["redirect_uri"]="msauth://com.nikahbridge/"+h.replace("=", "%3D")
          p.write_text(json.dumps(d, indent=2)+"\n")
          p=pathlib.Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'(android:scheme="msauth" android:host="com\.nikahbridge" android:path="/)[^"]+(")', rf'\g<1>{h}\g<2>', s)
          p.write_text(s)
          PY

      - name: Build stable Azure release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload stable Azure release APK
        uses: actions/upload-artifact@v6
        with:
          name: android-azure-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

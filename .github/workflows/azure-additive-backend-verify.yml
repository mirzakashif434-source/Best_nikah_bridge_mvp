          # Scan compiled DEX/resources, not only source, so stale release content cannot slip through.
          for bad in             'Family link ID'             'Wali phone (E.164)'             'Reported real user ID'             'Reported user ID required'             'Real recipient user ID'             'Real member ID'             'Real matched member ID'             'Member ID:'             'Conversation ID from a real mutual connection'             'Some Azure journey data could not be loaded'             'Currently visible:'             'Azure rewarded configuration unavailable.'             '/admin/owner/live-analytics'             'not available in this backend release'             'updating on Azure'             'null null'; do
            if grep -aRF "$bad" "$TMP" >/tmp/apk-forbidden-hit.txt 2>/dev/null; then

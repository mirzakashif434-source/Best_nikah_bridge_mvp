name: Azure Additive Backend + Android Verification

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - 'azure-backend/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/azure-additive-backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install

      - name: Validate Azure backend JavaScript
        working-directory: azure-backend
        run: |
          node --check src/index.js
          node --check src/auth.js
          node --check src/azureExternalAuth.js
          node --check src/account.js
          node --check src/rewardedAds.js
          node --check src/premiumPurchaseVerification.js
          node --check src/premiumPlans.js
          node --check src/wallet.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build Android debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Azure Additive Backend + Android Verification

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - 'azure-backend/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/azure-additive-backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install

      - name: Validate Azure backend JavaScript
        working-directory: azure-backend
        run: |
          node --check src/index.js
          node --check src/auth.js
          node --check src/azureExternalAuth.js
          node --check src/account.js
          node --check src/rewardedAds.js
          node --check src/premiumPurchaseVerification.js
          node --check src/premiumPlans.js
          node --check src/wallet.js
          node --check src/aiNikahAssistant.js
          node --check src/auth.js

      # Step 7: Azure AI is the production path. Firebase AI dependency/code remains untouched for rollback compatibility.
      - name: Verify Azure AI production path
        run: |
          grep -q 'route: "ai/nikah-assistant"' azure-backend/src/aiNikahAssistant.js
          grep -q 'AzureApiClient.post("/ai/nikah-assistant"' app/src/main/java/com/nikahbridge/NikahAssistantActivity.java
          grep -Fq 'route:"ai/nikah-mediator"' azure-backend/src/aiCompatibility.js
          grep -Fq 'route:"ai/future-life"' azure-backend/src/aiCompatibility.js
          grep -Fq 'Azure External ID is now the primary production entry path.' app/src/main/java/com/nikahbridge/MainActivity.java
          echo "Azure AI compatibility endpoints and primary Android paths verified; legacy Firebase AI remains preserved for rollback."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Prepare stable Azure Android redirect URI from production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null
          HASH="$(keytool -exportcert -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | openssl base64 -A)"
          REDIRECT="msauth://com.nikahbridge/${HASH}"
          echo "Stable Azure Android redirect URI: ${REDIRECT}"
          python3 - "$HASH" <<'PY'
          import json, pathlib, re, sys
          h=sys.argv[1]
          p=pathlib.Path("app/src/main/res/raw/auth_config.json")
          d=json.loads(p.read_text())
          d["redirect_uri"]=f"msauth://com.nikahbridge/{h}"
          p.write_text(json.dumps(d, indent=2)+"\n")
          p=pathlib.Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'(android:scheme="msauth" android:host="com\.nikahbridge" android:path="/)[^"]+(" )'.replace('" )','"'), rf'\g<1>{h}\g<2>', s)
          p.write_text(s)
          PY

      - name: Build stable Azure release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload stable Azure release APK
        uses: actions/upload-artifact@v6
        with:
          name: android-azure-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

                  no_back.append(p.name)
          assert not no_back, "Screens missing Back navigation: "+", ".join(no_back)

          for name in ["AzureHomeActivity.java","AzureWalletActivity.java","WalletActivity.java"]:
              t=(root/name).read_text(encoding="utf-8")
              assert "setText(body)" not in t, f"Raw JSON setText(body) remains in {name}"
              assert "setMessage(body)" not in t, f"Raw JSON setMessage(body) remains in {name}"

          owner=(root/"OwnerLiveAnalyticsActivity.java").read_text(encoding="utf-8")
          assert "dynamic.removeAllViews()" in owner
          assert "Open Owner Wallet / Payout" in owner

          welcome=(root/"WelcomeArtworkView.java").read_text(encoding="utf-8")
          assert "Canvas" in welcome and "Paint.ANTI_ALIAS_FLAG" in welcome


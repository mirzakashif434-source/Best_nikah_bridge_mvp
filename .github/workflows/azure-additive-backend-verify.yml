        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$GOLDEN_TAG"; then
            EXISTING="$(git rev-list -n 1 "$GOLDEN_TAG")"
            test "$EXISTING" = "$GITHUB_SHA"
            echo "Golden tag already exists for this exact commit; preserving it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$GOLDEN_TAG" "$GITHUB_SHA" -F GOLDEN_RELEASE_MANIFEST.txt
            git push origin "refs/tags/$GOLDEN_TAG"
          fi
          test "$(git rev-list -n 1 "$GOLDEN_TAG")" = "$GITHUB_SHA"

name: Azure Production Cutover Verification

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - 'azure-backend/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/azure-additive-backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact cutover source
        uses: actions/checkout@v5

      - name: Verify Firebase runtime is retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -d functions
          test ! -e firebase.json
          test ! -e firestore.indexes.json
          test ! -e firestore.rules
          test ! -e storage.rules
          test ! -e .github/workflows/firebase-production-deploy.yml
          ! grep -RInE 'import[[:space:]]+com\.google\.firebase|FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable' app/src/main/java --include='*.java'
          ! grep -InE 'firebase-(auth|firestore|functions|storage|ai)|com\.google\.firebase|google-services' app/build.gradle build.gradle settings.gradle
          echo "FIREBASE RUNTIME RETIRED: PASS"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Azure backend dependencies
        working-directory: azure-backend
        run: npm install

      - name: Validate Azure backend modules
        working-directory: azure-backend
        run: |
          set -euo pipefail
          find src -maxdepth 1 -type f -name '*.js' -print -exec node --check {} \;
          node -e "require('./src/index.js'); console.log('AZURE MODULE LOAD: PASS')"

      - name: Verify Azure production routes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'require("./featureParity")' azure-backend/src/index.js
          grep -Fq 'verifyAzureExternalIdToken' azure-backend/src/auth.js
          grep -Fq 'ensureAzureUser' azure-backend/src/auth.js
          grep -Eq 'route:[[:space:]]*"auth/azure/me"' azure-backend/src/azureExternalAuth.js
          grep -Eq 'route:[[:space:]]*"profile"' azure-backend/src/profile.js
          grep -Eq 'route:[[:space:]]*"blocks"' azure-backend/src/blocks.js
          grep -Eq 'route:[[:space:]]*"admin/verifications"' azure-backend/src/verification.js
          grep -Eq 'route:[[:space:]]*"help/ask"' azure-backend/src/helpLine.js
          grep -Eq 'route:[[:space:]]*"admin/owner/earnings"' azure-backend/src/ownerEarnings.js
          grep -Eq 'route:[[:space:]]*"premium/plans"' azure-backend/src/premiumPlans.js
          grep -Eq 'route:[[:space:]]*"community/messages"' azure-backend/src/community.js
          grep -Fq 'getProfilePhotosContainer' azure-backend/src/photos.js
          grep -Fq 'getVerificationDocumentsContainer' azure-backend/src/verification.js
          for route in 'likes' 'entitlements/free-boost' 'connections/{connectionId}/nikah-promise' 'compatibility/living' 'compatibility/living/share' 'connections/{connectionId}/health-check'; do
            grep -Eq 'route:[[:space:]]*"'"$route"'"' azure-backend/src/featureParity.js
          done
          echo "AZURE PRODUCTION ROUTES: PASS"

      - name: Verify Owner Wallet Google Play to Al Rajhi tracking
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'available_usd_minor' azure-backend/database/schema.sql
          grep -Fq 'pending_usd_minor' azure-backend/database/schema.sql
          grep -Fq 'settled_usd_minor' azure-backend/database/schema.sql
          grep -Fq '"USD"' azure-backend/src/ownerEarnings.js
          grep -Eq 'route:[[:space:]]*"admin/owner/provider-settlement"' azure-backend/src/ownerEarnings.js
          grep -Fq 'providerPayouts' azure-backend/src/ownerEarnings.js
          grep -Fq 'Owner Wallet — Google Play → Al Rajhi' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'Record Google Payout Received' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'Set Al Rajhi Payout Tracking' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'AzureApiClient.post("/admin/owner/provider-settlement"' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          echo "OWNER WALLET GOOGLE PLAY → AL RAJHI TRACKING: PASS"

      - name: Verify locked 2030 premium design
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/Premium2030Ui.java
          grep -Fq 'Faith • Family • Trust • A Brighter Tomorrow' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -Fq 'Meaningful Matches • Verified Profiles • Private & Safe' app/src/main/java/com/nikahbridge/AzureHomeActivity.java
          grep -Fq 'Family / Wali Connect' app/src/main/java/com/nikahbridge/FamilyBridge2Activity.java
          grep -Fq 'Privacy Control Center' app/src/main/java/com/nikahbridge/PrivacyControlCenterActivity.java
          grep -Fq 'Identity Verification' app/src/main/java/com/nikahbridge/IdentityVerificationActivity.java
          grep -Fq 'Meaningful matches for a brighter halal future' app/src/main/java/com/nikahbridge/GenderFilteredMatchesActivity.java
          grep -Fq 'Go Premium' app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          echo "LOCKED 2030 PREMIUM DESIGN: PASS"

      - name: Verify six final Android cutover screens
        shell: bash
        run: |
          set -euo pipefail
          for f in             app/src/main/java/com/nikahbridge/ProductionMainActivity.java             app/src/main/java/com/nikahbridge/MainActivity.java             app/src/main/java/com/nikahbridge/HelpLineActivity.java             app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java             app/src/main/java/com/nikahbridge/VerificationAdminActivity.java             app/src/main/java/com/nikahbridge/BlockedMembersActivity.java; do
            test -f "$f"
            ! grep -nE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' "$f"
          done
          grep -Fq 'AzureAuthManager' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -Fq 'AzureAuthManager' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -Fq 'AzureApiClient.post("/help/ask"' app/src/main/java/com/nikahbridge/HelpLineActivity.java
          grep -Fq 'AzureApiClient.get("/admin/owner/earnings"' app/src/main/java/com/nikahbridge/OwnerEarningsActivity.java
          grep -Fq 'AzureApiClient.get("/admin/verifications"' app/src/main/java/com/nikahbridge/VerificationAdminActivity.java
          grep -Fq 'AzureApiClient.get("/blocks"' app/src/main/java/com/nikahbridge/BlockedMembersActivity.java
          grep -Fq 'AUTH_TIMEOUT_MS=12000L' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -Fq 'AZURE_AUTH_TIMEOUT' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -Fq 'AtomicBoolean' app/src/main/java/com/nikahbridge/AzureApiClient.java
          echo "SIX ANDROID CUTOVER SCREENS: PASS"
          echo "AZURE API CLIENT TIMEOUT GUARD: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Compile Android production source
        run: ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Prepare production signing and Azure redirect URI
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null
          HASH="$(keytool -exportcert -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | openssl base64 -A)"
          python3 - "$HASH" <<'PY'
          import json, pathlib, re, sys
          h=sys.argv[1]
          p=pathlib.Path("app/src/main/res/raw/auth_config.json")
          d=json.loads(p.read_text())
          d["redirect_uri"]="msauth://com.nikahbridge/"+h.replace("=", "%3D")
          p.write_text(json.dumps(d, indent=2)+"\n")
          p=pathlib.Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'(android:scheme="msauth" android:host="com\.nikahbridge" android:path="/)[^"]+(")', rf'\g<1>{h}\g<2>', s)
          p.write_text(s)
          PY

      - name: Build signed release APK and Play Store AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-azure-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-azure-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

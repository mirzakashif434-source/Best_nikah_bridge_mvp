      - name: Prepare real release signing and Azure redirect URI
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null
          HASH="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | openssl base64 -A)"
          python3 - "$HASH" <<'PY'
          import json, pathlib, re, sys
          h=sys.argv[1]
          p=pathlib.Path("app/src/main/res/raw/auth_config.json")
          d=json.loads(p.read_text())
          d["redirect_uri"]="msauth://com.nikahbridge/"+h.replace("=", "%3D")
          p.write_text(json.dumps(d, indent=2)+"\n")
          p=pathlib.Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'(android:scheme="msauth" android:host="com\.nikahbridge" android:path="/)[^"]+(")', rf'\g<1>{h}\g<2>', s)

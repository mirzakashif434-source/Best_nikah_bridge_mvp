          assert "applySafeInsets(a)" in app
          assert "normalizeControls(a)" in app
          assert "WindowInsetsCompat.Type.systemBars()" in app

          bad_null=[]
          bad_alpha=[]
          for p in root.glob("*.java"):
              t=p.read_text(encoding="utf-8")
              if "null null" in t:
                  bad_null.append(p.name)
              if re.search(r"setAlpha\(0\.[0-4]|alpha\s*=\s*0\.[0-4]", t):
                  bad_alpha.append(p.name)
          assert not bad_null, "null null text remains: "+", ".join(bad_null)
          assert not bad_alpha, "blur-like alpha remains: "+", ".join(bad_alpha)

          print("STEP 8 UI AUDIT PASS:",len(activities),"activities")
          PY

      - name: Verify critical final feature buttons and routes

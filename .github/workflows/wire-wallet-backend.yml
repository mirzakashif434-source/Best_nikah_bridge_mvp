name: Wire Production Wallet Backend
on:
  push:
    branches: [ main ]
    paths: [ 'functions/wallet.js' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safely export wallet functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('functions/index.js')
          s=p.read_text()
          marker="Object.assign(exports, require('./wallet'));"
          if marker not in s:
              p.write_text(s.rstrip()+"\n\n"+marker+"\n")
          PY
      - name: Commit only wallet wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Wire production wallet functions into Firebase exports'
          git push

name: Release 35 Pre-Upload Golden Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'RELEASE_35_PREUPLOAD_GOLDEN_LOCK.md'
      - '.github/workflows/release35-preupload-golden-lock.yml'
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/release/AndroidManifest.xml'
      - 'app/src/main/res/raw/auth_config.json'
      - 'app/src/release/res/raw/auth_config.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '35'
  EXPECTED_VERSION_NAME: '2.5'
  EXPECTED_PLAY_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  EXPECTED_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_MSAL_HASH: haUulU8x36wsEGKo1k7aLZtIW0g=
  EXPECTED_MSAL_REDIRECT: msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D
  EXPECTED_TENANT_ID: c4ac0560-df59-48d4-af1b-bb0ed127ce6d

jobs:
  release35-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Lock package and release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" app/build.gradle
          ! grep -Eq 'versionCode[[:space:]]+34' app/build.gradle
          echo "RELEASE V35 IDENTITY: PASS"

      - name: Lock Play signing and Azure MSAL redirect
        shell: bash
        run: |
          set -euo pipefail
          B64="$(printf '%s' "$EXPECTED_PLAY_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$B64" = "$EXPECTED_MSAL_HASH"
          grep -Fq ""redirect_uri": "$EXPECTED_MSAL_REDIRECT"" app/src/main/res/raw/auth_config.json
          grep -Fq ""redirect_uri": "$EXPECTED_MSAL_REDIRECT"" app/src/release/res/raw/auth_config.json
          grep -Fq ""authority_url": "https://bestnikahbredge.ciamlogin.com/$EXPECTED_TENANT_ID"" app/src/main/res/raw/auth_config.json
          grep -Fq ""authority_url": "https://bestnikahbredge.ciamlogin.com/$EXPECTED_TENANT_ID"" app/src/release/res/raw/auth_config.json
          grep -Fq "android:path="/$EXPECTED_MSAL_HASH"" app/src/main/AndroidManifest.xml
          grep -Fq "android:path="/$EXPECTED_MSAL_HASH"" app/src/release/AndroidManifest.xml
          echo "PLAY + AZURE + GITHUB AUTH: PASS"

      - name: Verify upload signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ACTUAL="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED_UPLOAD_SHA1"
          echo "UPLOAD KEY: PASS"

      - name: Build exact V35 signed Play Store AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "SIGNED V35 AAB: PASS"

      - uses: actions/upload-artifact@v6
        with:
          name: azure-additive-play-store-aab-v35
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Final lock
        run: |
          echo "RELEASE 35 PRE-UPLOAD GOLDEN LOCK: PASS"
          echo "Azure additive branch / V35 / Play signing / Azure MSAL / signed AAB locked"

name: Release 36 Azure Additive Final Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'RELEASE_35_PREUPLOAD_GOLDEN_LOCK.md'
      - '.github/workflows/release35-preupload-golden-lock.yml'
      - 'app/**'
      - 'azure-backend/**'
      - '.maestro/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release36-final-lock-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '36'
  EXPECTED_VERSION_NAME: '2.25'
  EXPECTED_PLAY_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  EXPECTED_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_MSAL_HASH: haUulU8x36wsEGKo1k7aLZtIW0g=
  EXPECTED_MSAL_REDIRECT: msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D
  EXPECTED_TENANT_ID: c4ac0560-df59-48d4-af1b-bb0ed127ce6d

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Lock V36 package SDK and Azure-only runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" app/build.gradle
          grep -Fq 'compileSdk 36' app/build.gradle
          grep -Fq 'targetSdk 36' app/build.gradle
          test -d azure-backend
          test ! -e firebase.json
          test ! -e app/google-services.json
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          echo "MASTER V36 + AZURE-ONLY: PASS"

      - name: Lock Play Console Azure Portal and GitHub auth
        shell: bash
        run: |
          set -euo pipefail
          B64="$(printf '%s' "$EXPECTED_PLAY_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$B64" = "$EXPECTED_MSAL_HASH"
          grep -Fq "\"redirect_uri\": \"$EXPECTED_MSAL_REDIRECT\"" app/src/main/res/raw/auth_config.json
          grep -Fq "\"redirect_uri\": \"$EXPECTED_MSAL_REDIRECT\"" app/src/release/res/raw/auth_config.json
          grep -Fq "\"authority_url\": \"https://bestnikahbredge.ciamlogin.com/$EXPECTED_TENANT_ID\"" app/src/main/res/raw/auth_config.json
          grep -Fq "\"authority_url\": \"https://bestnikahbredge.ciamlogin.com/$EXPECTED_TENANT_ID\"" app/src/release/res/raw/auth_config.json
          grep -Fq "android:host=\"$EXPECTED_PACKAGE\"" app/src/main/AndroidManifest.xml
          grep -Fq "android:path=\"/$EXPECTED_MSAL_HASH\"" app/src/main/AndroidManifest.xml
          grep -Fq "android:host=\"$EXPECTED_PACKAGE\"" app/src/release/AndroidManifest.xml
          grep -Fq "android:path=\"/$EXPECTED_MSAL_HASH\"" app/src/release/AndroidManifest.xml
          grep -Fq 'api://4733ae40-3b89-4994-b99b-3890bf87e876/access_as_user' app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq 'const tenantId = "c4ac0560-df59-48d4-af1b-bb0ed127ce6d";' azure-backend/src/azureExternalAuth.js
          echo "PLAY CONSOLE -> AZURE PORTAL -> GITHUB: PASS"

  maestro-e2e:
    name: Maestro E2E
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify final release flow contract
        shell: bash
        run: |
          set -euo pipefail
          FLOW=.maestro/final-release-42-screen-master.yaml
          test -s "$FLOW"
          grep -Fq 'appId: com.nikahbridge' "$FLOW"
          grep -Fq 'Secure Azure session verified' "$FLOW"
          grep -Fq 'Premium Plans' "$FLOW"
          grep -Fq 'Global Community Chat' "$FLOW"
          grep -Fq 'Family / Wali Connect' "$FLOW"
          grep -Fq 'Four-Photo Verification' "$FLOW"
          python3 .github/scripts/verify_final_release_master.py
          echo "MAESTRO E2E CONTRACT: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Prevent cloud mutation and destructive release actions
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/release35-preupload-golden-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET: PASS"

  build-sign-verify:
    name: Build Signed AAB V36
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and verify Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ACTUAL="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED_UPLOAD_SHA1"
          echo "UPLOAD KEY SHA1: PASS"

      - name: Build and verify exact V36 AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:compileReleaseJavaWithJavac :app:lintRelease :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          echo "SIGNED PLAY STORE AAB V36: PASS"

      - uses: actions/upload-artifact@v6
        with:
          name: azure-additive-play-store-aab-v36
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, maestro-e2e, fortress-budget, build-sign-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore clean runner state
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, maestro-e2e, fortress-budget, build-sign-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Roll runner back to exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Release 36 Final Locked
    needs: [master-gate, maestro-e2e, fortress-budget, build-sign-verify, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.build-sign-verify.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "RELEASE 36 AZURE ADDITIVE: LOCKED"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"
          echo "Artifact: azure-additive-play-store-aab-v36"

name: Firebase Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci --omit=dev
      - name: Deploy Firebase Functions to the exact production project
        run: firebase deploy --only functions --project best-nikah-bridge --non-interactive
      - name: Verify required callable exports in source
        working-directory: functions
        run: |
          node -e "const f=require('./bootstrap'); for (const n of ['getWallet','requestWalletWithdrawal','listWalletTransactions','getOwnerEarningsDashboard','getPremiumEntitlement','verifyPremiumPurchase']) { if(typeof f[n] !== 'function') throw new Error('Missing export: '+n); console.log('SOURCE OK '+n); }"
      - name: Verify required functions are actually deployed
        run: |
          firebase functions:list --project best-nikah-bridge --json > /tmp/deployed-functions.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/deployed-functions.json','utf8');
          const data=JSON.parse(raw);
          const names=new Set((Array.isArray(data)?data:(data.functions||data.result||[])).map(x=>x.name||x.id||''));
          const required=['getWallet','requestWalletWithdrawal','listWalletTransactions','getOwnerEarningsDashboard','getPremiumEntitlement','verifyPremiumPurchase'];
          for(const n of required){
            const found=[...names].some(x=>x===n || x.endsWith('/'+n) || x.endsWith(n));
            if(!found) throw new Error('DEPLOYED FUNCTION MISSING: '+n+'\nAvailable: '+[...names].join(', '));
            console.log('DEPLOYED OK '+n);
          }
          NODE

name: Firebase Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firebase Functions only
        run: firebase deploy --only functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Verify required callable exports are present in source
        working-directory: functions
        run: |
          node -e "const f=require('./bootstrap'); for (const n of ['getWallet','requestWalletWithdrawal','listWalletTransactions','getOwnerEarningsDashboard']) { if(typeof f[n] !== 'function') throw new Error('Missing export: '+n); console.log('OK '+n); }"

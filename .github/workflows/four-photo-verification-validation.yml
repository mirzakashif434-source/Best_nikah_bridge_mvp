name: Four Photo Verification Production Validation

on:
  push:
    branches: [four-photo-verification-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate Azure backend syntax
        working-directory: azure-backend
        run: |
          set -euo pipefail
          npm install
          find src -maxdepth 1 -type f -name '*.js' -print -exec node --check {} \;
          node -e "require('./src/index.js'); console.log('AZURE MODULE LOAD: PASS')"

      - name: Verify four-photo enforcement
        run: |
          set -euo pipefail
          grep -Fq 'FOUR_PHOTOS_REQUIRED' azure-backend/src/photoVerification.js
          grep -Fq 'MAIN_PHOTO_CAMERA_REQUIRED' azure-backend/src/photoVerification.js
          grep -Fq 'GALLERY_SOURCE_REQUIRED' azure-backend/src/photoVerification.js
          grep -Fq 'verification_slot BETWEEN 1 AND 4' azure-backend/database/schema.sql
          grep -Fq 'photo_verified BOOLEAN NOT NULL DEFAULT FALSE' azure-backend/database/schema.sql
          grep -Fq 'photo_verification_sets' azure-backend/database/schema.sql

      - name: Verify same-person approval is real
        run: |
          set -euo pipefail
          grep -Fq 'PHOTOS_NOT_SAME_PERSON' azure-backend/src/photoVerification.js
          grep -Fq 'AZURE_FACE_VERIFY_ENABLED' azure-backend/src/photoVerification.js
          grep -Fq "status='pending',provider='manual-review'" azure-backend/src/photoVerification.js
          grep -Fq "provider='authorized-manual-review'" azure-backend/src/photoVerification.js
          ! grep -nE 'status=.approved.*draft|photo_verified=true.*start' azure-backend/src/photoVerification.js

      - name: Verify guided Android UX
        run: |
          set -euo pipefail
          grep -Fq 'Photo 1 — MAIN PHOTO • CAMERA REQUIRED' app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq 'Photo 2 — GALLERY' app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq 'Photo 3 — GALLERY' app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq 'Photo 4 — GALLERY' app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq 'exactly 3 gallery photos' app/src/main/java/com/nikahbridge/RealFourPhotoActivity.java
          grep -Fq '✅ VERIFIED PHOTO' app/src/main/java/com/nikahbridge/GenderFilteredMatchesActivity.java

      - name: Preserve existing photo and verification flows
        run: |
          set -euo pipefail
          grep -Fq 'photoUpload' azure-backend/src/photos.js
          grep -Fq 'verificationSelfieSubmit' azure-backend/src/verification.js
          grep -Fq 'Camera-First 4 Photos' app/src/main/java/com/nikahbridge/ProfilePhotoActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Compile Android production source
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Verify production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed production AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

name: Step 34 Final Release Integrity Master Gate

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_34_FINAL_RELEASE_INTEGRITY_MASTER_GATE.md'
      - '.github/workflows/step34-final-release-integrity-master-gate.yml'
      - '.github/workflows/azure-additive-backend-verify.yml'
      - 'app/**'
      - 'azure-backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step34-final-integrity-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '36'
  EXPECTED_VERSION_NAME: '2.25'
  PLAY_CLASSIC_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  PLAY_PQ_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67
  PLAY_PREVIOUS_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9
  PLAY_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  PLAY_CURRENT_SHA256: 66ABDEAFB0417716C6B1003A7A28FED0D742426905B2513E3D36A497CF5ADDAE
  PLAY_PREVIOUS_SHA256: 70A6D765B552B649E83FCCAC378F0EEB0A3EACB301903BF38EF44F22A8099968
  PLAY_PQ_SHA256: 5429EBF572B04C2B48A9C256AA0E659F066B7FE46EC06A653703A8FD882C0BEB
  PLAY_UPLOAD_SHA256: AF824C01B11D280C159A4C233064AB8639154C89EEE1FABB07ED2E21A58C1E7B
  AZURE_BASE: https://bestnikahbredge-prod-fn-dkf3ake6d8gsg7cw.eastus-01.azurewebsites.net/api

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Preserve Steps 1-33 and release identity
        shell: bash
        run: |
          set -euo pipefail
          test -s STEP_33_REAL_EXTERNAL_SERVICES_TEST_LOCK.md
          test -s .github/workflows/step33-real-external-services-test-lock.yml
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" app/build.gradle
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" app/build.gradle
          python3 .github/scripts/verify_final_release_master.py
          python3 .github/scripts/verify_50_screen_ultra_final.py
          echo "STEPS 1-33 + PACKAGE/VERSION + 50-SCREEN CONTRACT: PASS"

      - name: Verify exact Play Console SHA matrix contract
        shell: bash
        run: |
          set -euo pipefail
          S=.github/workflows/step3-azure-auth-sha-master-lock.yml
          grep -Fq "EXPECTED_PLAY_APP_SIGNING_SHA1: $PLAY_CLASSIC_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_POST_QUANTUM_SHA1: $PLAY_PQ_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: $PLAY_PREVIOUS_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_UPLOAD_SHA1: $PLAY_UPLOAD_SHA1" "$S"

          CLASSIC_B64="$(printf '%s' "$PLAY_CLASSIC_SHA1" | xxd -r -p | openssl base64 -A)"
          PREVIOUS_B64="$(printf '%s' "$PLAY_PREVIOUS_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$CLASSIC_B64" = "haUulU8x36wsEGKo1k7aLZtIW0g="
          test "$PREVIOUS_B64" = "WS+zloPDaXssn/RIrOAGmd4iV+k="

          grep -Fq 'msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D' app/src/main/res/raw/auth_config.json
          grep -Fq 'msauth://com.nikahbridge/WS%2BzloPDaXssn%2FRIrOAGmd4iV%2Bk%3D' app/src/main/res/raw/auth_config_play_current.json
          grep -Fq 'android:path="/haUulU8x36wsEGKo1k7aLZtIW0g="' app/src/main/AndroidManifest.xml
          grep -Fq 'android:path="/WS+zloPDaXssn/RIrOAGmd4iV+k="' app/src/main/AndroidManifest.xml
          echo "PLAY SHA-1 + MSAL REDIRECT MATRIX: PASS"

      - name: Verify No-Firebase runtime and security contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -d functions
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          ! grep -RInE '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}|sk-[0-9A-Za-z]{20,}' . --exclude-dir=.git --exclude='*.md' || exit 1
          grep -Fq '${{ secrets.KEYSTORE_BASE64 }}' .github/workflows/azure-additive-backend-verify.yml
          grep -Fq '${{ secrets.KEYSTORE_PASSWORD }}' .github/workflows/azure-additive-backend-verify.yml
          echo "NO-FIREBASE + SECRET-REFERENCE SECURITY: PASS"

  live-azure:
    name: Live Azure Integrity
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Public Azure health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 3 --max-time 30 "$AZURE_BASE/health")"
          python3 - "$BODY" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])
          assert o.get("ok") is True
          assert o.get("environment")=="azure"
          print("LIVE AZURE PUBLIC HEALTH: PASS")
          PY
      - name: Azure auth configuration health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 3 --max-time 30 "$AZURE_BASE/auth/azure/health")"
          python3 - "$BODY" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])
          assert o.get("ok") is True
          assert o.get("issuerConfigured") is True
          assert o.get("audienceConfigured") is True
          assert o.get("jwksConfigured") is True
          print("LIVE AZURE AUTH CONFIG: PASS")
          PY
      - name: Protected endpoint rejects missing token
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl --silent --show-error -o /tmp/protected.json -w '%{http_code}' --max-time 30 "$AZURE_BASE/auth/health")"
          test "$CODE" = "401"
          echo "LIVE AZURE TOKEN ENFORCEMENT: PASS"

  signed-release:
    name: Signed APK + AAB + Compile + Lint
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify upload certificate SHA-1/SHA-256 and build artifacts
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/upload.der"
          SHA1="$(openssl sha1 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          SHA256="$(openssl sha256 -binary "$RUNNER_TEMP/upload.der" | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$SHA1" = "$PLAY_UPLOAD_SHA1"
          test "$SHA256" = "$PLAY_UPLOAD_SHA256"

          chmod +x gradlew
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew clean :app:compileReleaseJavaWithJavac :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          python3 .github/scripts/verify_final_release_master.py "$APK"
          python3 .github/scripts/verify_50_screen_ultra_final.py "$APK" "$AAB"
          sha256sum "$APK" > step34-apk.sha256
          sha256sum "$AAB" > step34-aab.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: step34-final-integrity-apk-aab-v36
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            step34-apk.sha256
            step34-aab.sha256
          if-no-files-found: error

  maestro-e2e:
    name: Maestro E2E
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Verify Maestro and final contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s .maestro/final-release-42-screen-master.yaml
          grep -Fq 'appId: com.nikahbridge' .maestro/final-release-42-screen-master.yaml
          python3 .github/scripts/verify_final_release_master.py
          python3 .github/scripts/verify_50_screen_ultra_final.py
          echo "MAESTRO E2E FINAL CONTRACT: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Preserve budget and prevent publish/deploy mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f FORTRESS_BUDGET_MODE.md
          grep -Fq -- '--instance-memory 512 --maximum-instance-count 20' .github/workflows/azure-backend-deploy.yml
          grep -Fq 'AZURE_DB_POOL_MAX=3' .github/workflows/azure-backend-deploy.yml
          grep -Fq 'AI_DAILY_LIMIT_VIP=12' .github/workflows/azure-backend-deploy.yml
          F=.github/workflows/step34-final-release-integrity-master-gate.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy|update)|gradle-play-publisher|publishBundle|play[[:space:]].*upload|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET + NO PUBLISH: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, live-azure, signed-release, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          grep -Fq 'Self-heal Azure runtime after transient production failure' .github/workflows/azure-backend-deploy.yml
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, live-azure, signed-release, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "AUTO-ROLLBACK SAFETY: Step 34 is verification-only; no Azure or Play Console mutation was performed."

  locked:
    name: Step 34 Final Integrity Locked
    if: ${{ always() && needs.master-gate.result == 'success' && needs.live-azure.result == 'success' && needs.signed-release.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    needs: [master-gate, live-azure, signed-release, maestro-e2e, fortress-budget, self-healing]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 34 FINAL RELEASE INTEGRITY: GREEN"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback -> Fortress Budget"
          echo "APK + AAB downloadable as: step34-final-integrity-apk-aab-v36"
          echo "PLAY CONSOLE UPLOAD/PUBLISH: NOT PERFORMED"

name: Azure Feature Loading Lock

on: [push, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Azure API client timeout guard
        run: |
          grep -q 'AUTH_TIMEOUT_MS=12000L' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -q 'AZURE_AUTH_TIMEOUT' app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -q 'AtomicBoolean' app/src/main/java/com/nikahbridge/AzureApiClient.java
      - name: Verify wallet uses shared Azure API client
        run: |
          grep -q 'AzureApiClient.get("/wallet"' app/src/main/java/com/nikahbridge/AzureWalletActivity.java
          grep -q 'AzureApiClient.get("/wallet/transactions"' app/src/main/java/com/nikahbridge/AzureWalletActivity.java
      - name: Lock confirmation
        run: echo "LOCKED: Azure feature loading timeout + shared wallet API path verified."

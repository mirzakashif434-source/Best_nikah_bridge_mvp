name: Step 5 Azure API Registration Cleanup

on:
  push:
    branches:
      - azure-backend-additive
    paths:
      - '.github/workflows/step5-azure-api-registration-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_API_CLIENT_ID: 4733ae40-3b89-4994-b99b-3890bf87e876
  EXPECTED_ANDROID_CLIENT_ID: f5fc2b11-420f-4741-9a52-65d60cbddb7b
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_SCOPE_VALUE: access_as_user

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Azure additive source
        uses: actions/checkout@v5
        with:
          ref: azure-backend-additive

      - name: Preserve Play and Android auth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId '\''com.nikahbridge'\''' app/build.gradle
          grep -Fq "$EXPECTED_ANDROID_CLIENT_ID" app/src/main/res/raw/auth_config.json
          grep -Fq "api://$EXPECTED_API_CLIENT_ID/$EXPECTED_SCOPE_VALUE" app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq "api://$EXPECTED_API_CLIENT_ID/$EXPECTED_SCOPE_VALUE" app/src/main/java/com/nikahbridge/AzureExternalAuthActivity.java
          echo "PLAY + ANDROID AUTH CONTRACT: PRESERVED"

      - name: Azure login via Customers tenant OIDC
        uses: azure/login@v3
        with:
          client-id: 256ca508-50c5-4877-bc12-f20993fb97c4
          tenant-id: c4ac0560-df59-48d4-af1b-bb0ed127ce6d
          audience: api://AzureADTokenExchange
          environment: azurecloud
          allow-no-subscriptions: true

      - name: Read exact Azure API registration
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          test -n "$TOKEN"
          FILTER="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote("appId eq '4733ae40-3b89-4994-b99b-3890bf87e876'"))
          PY
          )"
          curl -fsS             -H "Authorization: Bearer $TOKEN"             "https://graph.microsoft.com/v1.0/applications?%24filter=$FILTER"             -o /tmp/api-app-search.json
          test "$(jq '.value | length' /tmp/api-app-search.json)" = "1"
          jq '.value[0]' /tmp/api-app-search.json >/tmp/api-app.json
          jq -e --arg appId "$EXPECTED_API_CLIENT_ID" '.appId == $appId' /tmp/api-app.json >/dev/null
          jq -e --arg uri "api://$EXPECTED_API_CLIENT_ID" '.identifierUris | index($uri) != null' /tmp/api-app.json >/dev/null
          jq -e --arg scope "$EXPECTED_SCOPE_VALUE" '.api.oauth2PermissionScopes | any(.value == $scope and .isEnabled == true)' /tmp/api-app.json >/dev/null
          jq -e --arg client "$EXPECTED_ANDROID_CLIENT_ID" '.api.preAuthorizedApplications | any(.appId == $client)' /tmp/api-app.json >/dev/null
          jq -r '.id' /tmp/api-app.json >/tmp/api-object-id.txt
          echo "AZURE API IDENTITY + SCOPE + ANDROID PREAUTH: PASS"

      - name: Remove Android redirect only from API registration
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          OBJECT_ID="$(cat /tmp/api-object-id.txt)"
          jq --arg prefix "msauth://$EXPECTED_PACKAGE/" '
            {
              publicClient: {
                redirectUris: ((.publicClient.redirectUris // []) | map(select(startswith($prefix) | not)))
              },
              web: {
                redirectUris: ((.web.redirectUris // []) | map(select(startswith($prefix) | not)))
              },
              spa: {
                redirectUris: ((.spa.redirectUris // []) | map(select(startswith($prefix) | not)))
              }
            }
          ' /tmp/api-app.json >/tmp/api-clean-patch.json
          curl -fsS -X PATCH             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/api-clean-patch.json             "https://graph.microsoft.com/v1.0/applications/$OBJECT_ID"
          echo "API ANDROID MSAUTH REDIRECTS: REMOVED ONLY"

      - name: Verify API registration is Play-safe and scope preserved
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          OBJECT_ID="$(cat /tmp/api-object-id.txt)"
          curl -fsS             -H "Authorization: Bearer $TOKEN"             "https://graph.microsoft.com/v1.0/applications/$OBJECT_ID"             -o /tmp/api-app-after.json
          jq -e --arg prefix "msauth://$EXPECTED_PACKAGE/" '
            [
              (.publicClient.redirectUris // []),
              (.web.redirectUris // []),
              (.spa.redirectUris // [])
            ] | flatten | all(startswith($prefix) | not)
          ' /tmp/api-app-after.json >/dev/null
          jq -e --arg uri "api://$EXPECTED_API_CLIENT_ID" '.identifierUris | index($uri) != null' /tmp/api-app-after.json >/dev/null
          jq -e --arg scope "$EXPECTED_SCOPE_VALUE" '.api.oauth2PermissionScopes | any(.value == $scope and .isEnabled == true)' /tmp/api-app-after.json >/dev/null
          jq -e --arg client "$EXPECTED_ANDROID_CLIENT_ID" '.api.preAuthorizedApplications | any(.appId == $client)' /tmp/api-app-after.json >/dev/null
          echo "STEP 5 API REGISTRATION: CURRENT PLAY/ANDROID SEPARATION VERIFIED"

      - name: Locked protection stack
        shell: bash
        run: |
          echo "MASTER GATE → MAESTRO E2E → SELF-HEALING → AUTO-ROLLBACK → FORTRESS BUDGET: PRESERVED"
          echo "STEP 5 AZURE API REGISTRATION CLEANUP: LOCKED"

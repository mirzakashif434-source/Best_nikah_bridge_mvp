name: Step 18 Final Store Submission Integrity and Release Freeze Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_18_FINAL_STORE_SUBMISSION_INTEGRITY_RELEASE_FREEZE_LOCK.md'
      - '.github/workflows/step18-final-store-submission-integrity-release-freeze-lock.yml'
      - 'app/**'
      - 'azure-backend/**'
      - '.maestro/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step18-store-submission-${{ github.ref }}
  cancel-in-progress: false

env:
  LIVE_BASE_URL: https://bestnikahbredge-prod-fn-dkf3ake6d8gsg7cw.eastus-01.azurewebsites.net
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_VERSION_CODE: '37'
  EXPECTED_VERSION_NAME: '2.25'
  EXPECTED_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_PLAY_APP_SIGNING_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  EXPECTED_PLAY_POST_QUANTUM_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67
  EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Preserve Step 1-17 contracts
        shell: bash
        run: |
          set -euo pipefail
          for wf in             .github/workflows/step3-azure-auth-sha-master-lock.yml             .github/workflows/step4-legacy-firebase-deep-cleanup-lock.yml             .github/workflows/step5-azure-feature-replacement-master-lock.yml             .github/workflows/step6-final-firebase-production-removal-lock.yml             .github/workflows/step7-full-50-azure-wiring-master-lock.yml             .github/workflows/step8-full-50-buttons-back-navigation-lock.yml             .github/workflows/step9-full-50-ui-safety-master-lock.yml             .github/workflows/step10-special-real-features-master-lock.yml             .github/workflows/step11-notifications-billing-ads-master-lock.yml             .github/workflows/step12-security-play-store-compliance-master-lock.yml             .github/workflows/step13-final-master-release-gate.yml             .github/workflows/step14-play-ready-artifact-handoff-lock.yml             .github/workflows/step15-final-production-freeze-play-upload-lock.yml             .github/workflows/step16-live-azure-readiness-no-drift-lock.yml             .github/workflows/step17-final-play-store-preflight-zero-drift-lock.yml; do
            test -s "$wf"
          done
          echo "STEP 1-17 CONTRACTS: PRESERVED"

      - name: Verify final package version SDK screen and Play identity freeze
        shell: bash
        run: |
          set -euo pipefail
          B=app/build.gradle
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" "$B"
          grep -Eq "versionCode[[:space:]]+$EXPECTED_VERSION_CODE" "$B"
          grep -Fq "versionName '$EXPECTED_VERSION_NAME'" "$B"
          grep -Fq 'compileSdk 36' "$B"
          grep -Fq 'targetSdk 36' "$B"
          grep -Fq 'minSdk 24' "$B"
          COUNT="$(grep -o 'android:name="\.[A-Za-z0-9_]*Activity"' app/src/main/AndroidManifest.xml | sort -u | wc -l | tr -d ' ')"
          test "$COUNT" = "50"

          S=.github/workflows/step3-azure-auth-sha-master-lock.yml
          grep -Fq "EXPECTED_PLAY_APP_SIGNING_SHA1: $EXPECTED_PLAY_APP_SIGNING_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_POST_QUANTUM_SHA1: $EXPECTED_PLAY_POST_QUANTUM_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: $EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1" "$S"
          grep -Fq "EXPECTED_PLAY_UPLOAD_SHA1: $EXPECTED_UPLOAD_SHA1" "$S"

          B64="$(printf '%s' "$EXPECTED_PLAY_APP_SIGNING_SHA1" | xxd -r -p | openssl base64 -A)"
          test "$B64" = 'haUulU8x36wsEGKo1k7aLZtIW0g='
          grep -Fq '"redirect_uri": "msauth://com.nikahbridge/haUulU8x36wsEGKo1k7aLZtIW0g%3D"' app/src/main/res/raw/auth_config.json
          grep -Fq 'android:path="/haUulU8x36wsEGKo1k7aLZtIW0g="' app/src/main/AndroidManifest.xml
          python3 .github/scripts/verify_final_release_master.py
          echo "FINAL PACKAGE/VERSION/SDK/50-SCREEN/PLAY IDENTITY: PASS"

      - name: Verify Azure-only billing auth and UI release contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -d functions
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|FirebaseAI|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'

          P=azure-backend/src/premiumPlans.js
          V=azure-backend/src/premiumPurchaseVerification.js
          grep -Fq 'planKey: "premium_basic_20"' "$P"
          grep -Fq 'planKey: "premium_plus_40"' "$P"
          grep -Fq 'planKey: "premium_vip_60"' "$P"
          grep -Fq 'GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL' "$V"
          grep -Fq 'GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY' "$V"

          A=app/src/main/java/com/nikahbridge
          grep -Fq 'AUTH_TIMEOUT_MS=12000L' "$A/AzureApiClient.java"
          grep -Fq 'code==401&&allowAuthRetry' "$A/AzureApiClient.java"
          grep -Fq 'WindowInsetsCompat.Type.systemBars()' "$A/NikahBridgeApplication.java"
          ! grep -RInF 'null null' "$A" --include='*.java'
          ! grep -RInE 'setAlpha\(0\.[0-4]|alpha\s*=\s*0\.[0-4]' "$A" --include='*.java'
          echo "AZURE/BILLING/AUTH/UI RELEASE CONTRACTS: PASS"

      - name: Create immutable submission manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "package=$EXPECTED_PACKAGE"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "playAppSigningSha1=$EXPECTED_PLAY_APP_SIGNING_SHA1"
            echo "playPostQuantumSha1=$EXPECTED_PLAY_POST_QUANTUM_SHA1"
            echo "playPreviousAppSigningSha1=$EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1"
            echo "playUploadSha1=$EXPECTED_UPLOAD_SHA1"
            sha256sum app/build.gradle
            sha256sum app/src/main/AndroidManifest.xml
            sha256sum app/src/main/res/raw/auth_config.json
            sha256sum azure-backend/src/azureExternalAuth.js
            sha256sum azure-backend/src/premiumPlans.js
            sha256sum azure-backend/src/premiumPurchaseVerification.js
            sha256sum .maestro/final-release-42-screen-master.yaml
          } > step18-store-submission-manifest.txt
          test -s step18-store-submission-manifest.txt
          echo "IMMUTABLE STORE SUBMISSION MANIFEST: PASS"

  live-azure:
    name: Live Azure Readiness
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Verify live Azure release state read-only
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local path="$1"; local kind="$2"; local f; f="$(mktemp)"
            code="$(curl --fail-with-body --silent --show-error --location --connect-timeout 20 --max-time 45 -o "$f" -w '%{http_code}' "$LIVE_BASE_URL$path")"
            test "$code" = "200"
            python3 - "$f" "$kind" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); k=sys.argv[2]
          ok={
            "health": d.get("ok") is True and d.get("environment")=="azure",
            "database": d.get("ok") is True and d.get("database")=="postgresql" and d.get("connected") is True,
            "storage": d.get("ok") is True and d.get("storage")=="azure-blob" and d.get("connected") is True and d.get("containersReady") is True,
            "auth": d.get("ok") is True and d.get("configured") is True and d.get("issuerConfigured") is True and d.get("audienceConfigured") is True and d.get("jwksConfigured") is True,
            "release": d.get("ok") is True and d.get("ready") is True,
          }[k]
          if not ok: raise SystemExit(f"{k} failed: {d}")
          print(k, "PASS")
          PY
            rm -f "$f"
          }
          check /api/health health
          check /api/database/health database
          check /api/storage/health storage
          check /api/auth/azure/health auth
          check /api/release/readiness release

          f="$(mktemp)"
          code="$(curl --silent --show-error --location --connect-timeout 20 --max-time 45 -o "$f" -w '%{http_code}' "$LIVE_BASE_URL/api/auth/azure/me")"
          test "$code" = "401"
          python3 - "$f" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("ok") is False and d.get("error")=="UNAUTHENTICATED"
          print("negative auth guard PASS")
          PY
          rm -f "$f"
          echo "LIVE AZURE RELEASE STATE: PASS"

  maestro-e2e:
    name: Maestro E2E
    needs: [master-gate, live-azure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify final frozen navigation contract
        shell: bash
        run: |
          set -euo pipefail
          FLOW=.maestro/final-release-42-screen-master.yaml
          test -s "$FLOW"
          for txt in             'Secure Azure session verified'             'Premium Plans'             'Global Community Chat'             'Family / Wali Connect'             'Four-Photo Verification'             'Permanently Delete Account'             'Sign out of Azure'; do
            grep -Fq "$txt" "$FLOW"
          done
          python3 .github/scripts/verify_final_release_master.py
          echo "MAESTRO FINAL NAVIGATION CONTRACT: PASS"

  build-sign-verify:
    name: Signed Submission APK AAB Integrity
    needs: [master-gate, live-azure, maestro-e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and verify Play upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ACTUAL="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED_UPLOAD_SHA1"
          echo "PLAY UPLOAD KEY INTEGRITY: PASS"

      - name: Build sign verify and freeze submission artifacts
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:compileReleaseJavaWithJavac :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          sha256sum "$APK" > step18-submission-apk-v37.sha256
          sha256sum "$AAB" > step18-submission-aab-v37.sha256
          {
            echo "package=$EXPECTED_PACKAGE"
            echo "versionCode=$EXPECTED_VERSION_CODE"
            echo "versionName=$EXPECTED_VERSION_NAME"
            echo "sourceCommit=$(git rev-parse HEAD)"
            cat step18-submission-apk-v37.sha256
            cat step18-submission-aab-v37.sha256
          } > step18-store-submission-handoff.txt
          echo "SIGNED STORE SUBMISSION APK+AAB: PASS"

      - uses: actions/upload-artifact@v6
        with:
          name: step18-final-submission-apk-v37
          path: |
            app/build/outputs/apk/release/app-release.apk
            step18-submission-apk-v37.sha256
            step18-store-submission-handoff.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: step18-final-submission-aab-v37
          path: |
            app/build/outputs/bundle/release/app-release.aab
            step18-submission-aab-v37.sha256
            step18-store-submission-handoff.txt
          if-no-files-found: error

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
      - name: Verify no destructive or cloud mutation commands
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/step18-final-store-submission-integrity-release-freeze-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy|update)|git[[:space:]]+push[[:space:]]+--force|gh[[:space:]]+release[[:space:]]+delete' "$F"
          echo "FORTRESS BUDGET + ZERO CLOUD MUTATION: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, live-azure, maestro-e2e, build-sign-verify, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore runner state
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, live-azure, maestro-e2e, build-sign-verify, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore exact source state
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Step 18 Locked
    needs: [master-gate, live-azure, maestro-e2e, build-sign-verify, fortress-budget, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.live-azure.result == 'success' && needs.maestro-e2e.result == 'success' && needs.build-sign-verify.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 18 FINAL STORE SUBMISSION INTEGRITY + RELEASE FREEZE: LOCKED"
          echo "Step 1-17 preserved / Azure live ready / Play identities / billing / 50 screens / UI safety / signed submission APK+AAB"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"

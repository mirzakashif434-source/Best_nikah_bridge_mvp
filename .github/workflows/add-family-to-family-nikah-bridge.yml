name: Add Family-to-Family Nikah Bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  production-family-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Validate Family Bridge production implementation
        shell: python
        run: |
          from pathlib import Path
          fn=Path('functions/index.js').read_text()
          android=Path('app/src/main/java/com/nikahbridge/MainActivity.java').read_text()
          rules=Path('firestore.rules').read_text()
          required_fn=['createFamilyInvite','redeemFamilyInvite','requestFamilyBridge','respondFamilyBridge']
          missing=[x for x in required_fn if f'exports.{x}=onCall' not in fn]
          if missing:
              raise SystemExit('Missing Family Bridge functions: '+', '.join(missing))
          for marker in ['match /familyGroups/{id}','match /familyMemberships/{uid}','match /familyInvites/{id}','match /familyBridges/{id}']:
              if marker not in rules: raise SystemExit('Missing Firestore rule: '+marker)
          if 'private void familyBridge()' not in android: raise SystemExit('Missing Family Bridge Android UI')
          if 'getHttpsCallable("createFamilyInvite")' not in android: raise SystemExit('Missing create family invite client')
          if 'getHttpsCallable("redeemFamilyInvite")' not in android: raise SystemExit('Missing redeem family invite client')
          if 'getHttpsCallable("requestFamilyBridge")' not in android: raise SystemExit('Missing family bridge request client')
          if 'getHttpsCallable("respondFamilyBridge")' not in android: raise SystemExit('Missing family bridge response client')

      - name: Validate production source
        run: |
          node --check functions/index.js
          git diff --check

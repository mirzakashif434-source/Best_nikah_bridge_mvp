name: Add Family-to-Family Nikah Bridge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-family-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Validate Family Bridge production implementation
        shell: python
        run: |
          from pathlib import Path
          fn=Path('functions/index.js').read_text()
          android=Path('app/src/main/java/com/nikahbridge/ProductionMainActivity.java').read_text()
          rules=Path('firestore.rules').read_text()
          required_fn=['createFamilyBridge','sendFamilyQuestion','setFamilyConsent']
          missing=[x for x in required_fn if f'exports.{x}=onCall' not in fn]
          if missing: raise SystemExit('Missing Family Bridge functions: '+', '.join(missing))
          for marker in required_fn:
              if f'getHttpsCallable("{marker}")' not in android: raise SystemExit('Missing Android Family Bridge client: '+marker)
          if 'familyBridges' not in rules: raise SystemExit('Missing Firestore family bridge rules')

      - name: Validate production source
        run: |
          node --check functions/index.js
          git diff --check

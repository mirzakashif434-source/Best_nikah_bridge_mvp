name: Repair production MainActivity

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-release:
    if: github.event.head_commit.message != 'Fix verification screen sizing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fix only verification screen sizing
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/nikahbridge/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          if 'private int dp(int value)' not in text:
              anchor = '    private void base(){'
              helper = '    private int dp(int value){ return (int)(value * getResources().getDisplayMetrics().density + 0.5f); }\n\n'
              if anchor not in text: raise SystemExit('base anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('new LinearLayout.LayoutParams(-1,62);p.setMargins(0,6,0,6);', 'new LinearLayout.LayoutParams(-1,dp(62));p.setMargins(0,dp(6),0,dp(6));', 1)
          text = text.replace('root.addView(e,new LinearLayout.LayoutParams(-1,62));', 'root.addView(e,new LinearLayout.LayoutParams(-1,dp(62)));', 1)
          text = text.replace('root.setPadding(22,24,22,32);', 'root.setPadding(dp(22),dp(24),dp(22),dp(32));', 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify locked production features remain intact
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Real Firebase data only' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Add / Update Real Profile Photo' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'ProfilePhotoActivity.class' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'ProfilePhotoLoader.load' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'com.google.firebase.ai.java.GenerativeModelFutures' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'com.google.firebase.ai.type.GenerateContentResponse' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -q 'import com.google.firebase.ai.GenerateContentResponse;' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -qE 'DEMO_|MockData|mockData|sample member|fake match' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'new LinearLayout.LayoutParams(-1,dp(62))' app/src/main/java/com/nikahbridge/MainActivity.java
          git diff --check

      - name: Verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-release-fixed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Commit only the sizing fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nikahbridge/MainActivity.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No sizing change required.'
            exit 0
          fi
          git commit -m 'Fix verification screen sizing'
          git push

name: Repair production MainActivity

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-release:
    if: github.event.head_commit.message != 'Fix Firebase AI Logic compatibility without changing app features'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Replace only broken Firebase AI Java compatibility code
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/nikahbridge/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          old_import = 'import com.google.firebase.ai.GenerateContentResponse;'
          new_import = 'import com.google.firebase.ai.type.GenerateContentResponse;'
          if old_import not in text:
              raise SystemExit('Expected old GenerateContentResponse import was not found')
          text = text.replace(old_import, new_import, 1)

          anchor = 'import com.google.firebase.ai.type.GenerativeBackend;'
          futures_import = 'import com.google.firebase.ai.java.GenerativeModelFutures;'
          if futures_import not in text:
              if anchor not in text:
                  raise SystemExit('Firebase AI import anchor was not found')
              text = text.replace(anchor, anchor + '\n' + futures_import, 1)

          old_model = 'GenerativeModel model=FirebaseAI.getInstance(GenerativeBackend.googleAI()).generativeModel("gemini-3.7-flash");'
          new_model = 'GenerativeModel aiModel=FirebaseAI.getInstance(GenerativeBackend.googleAI()).generativeModel("gemini-3.7-flash");\n                GenerativeModelFutures model=GenerativeModelFutures.from(aiModel);'
          if old_model not in text:
              raise SystemExit('Expected AI model initialization was not found')
          text = text.replace(old_model, new_model, 1)

          old_future = 'ListenableFuture<GenerateContentResponse> future=model.generateContent(content);'
          if old_future not in text:
              raise SystemExit('Expected AI generateContent call was not found')

          path.write_text(text, encoding='utf-8')

      - name: Verify locked production features remain intact
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Real Firebase data only' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Add / Update Real Profile Photo' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'ProfilePhotoActivity.class' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'ProfilePhotoLoader.load' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'com.google.firebase.ai.java.GenerativeModelFutures' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'com.google.firebase.ai.type.GenerateContentResponse' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -q 'import com.google.firebase.ai.GenerateContentResponse;' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -qE 'DEMO_|MockData|mockData|sample member|fake match' app/src/main/java/com/nikahbridge/MainActivity.java
          git diff --check

      - name: Verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-release-fixed
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Commit only the Firebase AI compatibility replacement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/nikahbridge/MainActivity.java
          git diff --cached --check
          git commit -m 'Fix Firebase AI Logic compatibility without changing app features'
          git push

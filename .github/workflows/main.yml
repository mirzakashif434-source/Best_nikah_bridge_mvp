name: Android Release AAB
# One authoritative production release workflow. Builds the real app from the checked-out main commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify production source before compile
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          test -f app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -q 'loadReward(unit, status)' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -q 'final String productionUnit = unit.trim();' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -q 'MobileAds.initialize(this, s -> loadReward(productionUnit, status));' app/src/main/java/com/nikahbridge/ProductionMainActivity.java
          grep -q 'Real Firebase data only' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -qE 'MockData|mockData|sample member|fake match' app/src/main/java/com/nikahbridge/MainActivity.java
          git diff --check

      - name: Verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge >/dev/null

      - name: Build signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

name: Android Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify production feature lock
        run: |
          test -f app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Real Firebase data only' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Nikah Readiness Score' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Compatibility Matches' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Mutual Interests & Safe Chat' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Family / Wali Connect' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Scam Shield & Safety' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Real Verification' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'AI Nikah Assistant' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'Privacy Control Center' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'sendConnectionMessage' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'sendInterest' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'respondToInterest' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'blockUser' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'requestWaliConnection' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'deleteMyAccount' app/src/main/java/com/nikahbridge/MainActivity.java
          ! grep -qE 'demo|dummy|fake match|sample member|MockData|mockData' app/src/main/java/com/nikahbridge/MainActivity.java

      - name: Verify Firebase AI Java integration
        run: |
          grep -q 'import com.google.firebase.ai.java.GenerativeModelFutures;' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'import com.google.firebase.ai.type.GenerateContentResponse;' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'GenerativeModelFutures.from(model)' app/src/main/java/com/nikahbridge/MainActivity.java
          grep -q 'modelFutures.generateContent(content)' app/src/main/java/com/nikahbridge/MainActivity.java

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Build signed Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

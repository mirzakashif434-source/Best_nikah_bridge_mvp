/* Mobile button text fix */
button,
.btn,
a {
    box-sizing: border-box;
}

button,
.btn {
    min-height: 52px;
    height: auto;
    padding: 14px 20px;
    line-height: 1.3;
    font-size: 17px;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

@media (max-width: 600px) {
    button,
    .btn {
        width: 92%;
        min-height: 56px;
        margin: 10px auto;
        padding: 15px 18px;
        font-size: 17px;
        line-height: 1.25;
    }
}

name: Android Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/best-nikah-bridge-release.jks"
          test -s "$RUNNER_TEMP/best-nikah-bridge-release.jks"

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/best-nikah-bridge-release.jks" \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Lock Firebase AI Java compatibility in source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nikahbridge/MainActivity.java')
          s = p.read_text()
          old_import = 'import com.google.firebase.ai.GenerateContentResponse;'
          new_import = 'import com.google.firebase.ai.java.GenerativeModelFutures;\nimport com.google.firebase.ai.type.GenerateContentResponse;'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          old_call = 'ListenableFuture<GenerateContentResponse> future=model.generateContent(content);'
          new_call = 'GenerativeModelFutures modelFutures=GenerativeModelFutures.from(model);ListenableFuture<GenerateContentResponse> future=modelFutures.generateContent(content);'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- app/src/main/java/com/nikahbridge/MainActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/nikahbridge/MainActivity.java
            git commit -m "Fix Firebase AI Java compatibility [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/best-nikah-bridge-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: best-nikah-bridge
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: best-nikah-bridge-release
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

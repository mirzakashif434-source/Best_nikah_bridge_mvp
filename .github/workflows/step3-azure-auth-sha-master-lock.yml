name: Step 3 Azure Auth SHA Play Store Master Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - 'STEP_3_AZURE_AUTH_SHA_LOCK.md'
      - '.github/workflows/step3-azure-auth-sha-master-lock.yml'
      - '.github/workflows/azure-additive-backend-verify.yml'
      - 'app/src/main/res/raw/auth_config.json'
      - 'app/src/release/res/raw/auth_config.json'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/release/AndroidManifest.xml'
      - 'app/src/main/java/com/nikahbridge/AzureAuthManager.java'
      - 'app/src/main/java/com/nikahbridge/AzureExternalAuthActivity.java'
      - 'azure-backend/src/azureExternalAuth.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step3-auth-sha-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_PACKAGE: com.nikahbridge
  EXPECTED_CLIENT_ID: f5fc2b11-420f-4741-9a52-65d60cbddb7b
  EXPECTED_API_AUDIENCE: 4733ae40-3b89-4994-b99b-3890bf87e876
  EXPECTED_TENANT_ID: c4ac0560-df59-48d4-af1b-bb0ed127ce6d
  EXPECTED_PLAY_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048
  EXPECTED_PLAY_APP_SIGNING_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48
  EXPECTED_PLAY_POST_QUANTUM_SHA1: C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67
  EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1: 592FB39683C3697B2C9FF448ACE00699DE2257E9

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1

      - name: Verify package and Microsoft identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId '$EXPECTED_PACKAGE'" app/build.gradle
          grep -Fq "\"client_id\": \"$EXPECTED_CLIENT_ID\"" app/src/main/res/raw/auth_config.json
          grep -Fq "api://$EXPECTED_API_AUDIENCE/access_as_user" app/src/main/java/com/nikahbridge/AzureAuthManager.java
          grep -Fq "api://$EXPECTED_API_AUDIENCE/access_as_user" app/src/main/java/com/nikahbridge/AzureExternalAuthActivity.java
          grep -Fq "const tenantId = \"$EXPECTED_TENANT_ID\";" azure-backend/src/azureExternalAuth.js
          grep -Fq 'const tenantSubdomain = "bestnikahbredge";' azure-backend/src/azureExternalAuth.js
          echo "PACKAGE + CLIENT + TENANT + SCOPE: PASS"

      - name: Verify backend issuer audience JWKS expiry validation
        shell: bash
        run: |
          set -euo pipefail
          F=azure-backend/src/azureExternalAuth.js
          grep -Fq 'createRemoteJWKSet' "$F"
          grep -Fq 'jwtVerify(token,jwks,{audience:cfg.audience})' "$F"
          grep -Fq 'issuerAllowed(payload.iss, allowedIssuers)' "$F"
          grep -Fq '/discovery/v2.0/keys' "$F"
          grep -Fq 'if (!payload.sub)' "$F"
          grep -Fq 'AZURE_EXTERNAL_ID_TOKEN_VERIFY_FAILED' "$F"
          # jose jwtVerify validates exp/nbf when present as part of JWT claims validation.
          echo "JWT SIGNATURE + AUDIENCE + EXP/NBF + ISSUER + JWKS: PASS"

      - name: Verify upload key separately
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ACTUAL="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias best-nikah-bridge | openssl sha1 -binary | xxd -p -c 256 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED_PLAY_UPLOAD_SHA1"
          echo "PLAY UPLOAD CERTIFICATE: PASS"

      - name: Verify Play App Signing drives MSAL redirect
        shell: bash
        run: |
          set -euo pipefail
          B64="$(printf '%s' "$EXPECTED_PLAY_APP_SIGNING_SHA1" | xxd -r -p | openssl base64 -A)"
          URL_B64="$(printf '%s' "$B64" | sed -e 's/+/%2B/g' -e 's#/#%2F#g' -e 's/=/%3D/g')"
          test "$B64" = "haUulU8x36wsEGKo1k7aLZtIW0g="
          grep -Fq "\"redirect_uri\": \"msauth://$EXPECTED_PACKAGE/$URL_B64\"" app/src/main/res/raw/auth_config.json
          grep -Fq "android:scheme=\"msauth\" android:host=\"$EXPECTED_PACKAGE\" android:path=\"/$B64\"" app/src/main/AndroidManifest.xml
          grep -Fq "\"redirect_uri\": \"msauth://$EXPECTED_PACKAGE/$URL_B64\"" app/src/release/res/raw/auth_config.json
          grep -Fq "android:host=\"$EXPECTED_PACKAGE\"" app/src/release/AndroidManifest.xml
          grep -Fq "android:path=\"/$B64\"" app/src/release/AndroidManifest.xml
          echo "PLAY APP SIGNING -> MSAL REDIRECT: PASS"

      - name: Lock all Play Console signing identities
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_PLAY_APP_SIGNING_SHA1" = "85A52E954F31DFAC2C1062A8D64EDA2D9B485B48"
          test "$EXPECTED_PLAY_POST_QUANTUM_SHA1" = "C5AE28337D7C9DCDD3F09B15C91EE0015EA58A67"
          test "$EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1" = "592FB39683C3697B2C9FF448ACE00699DE2257E9"
          test "$EXPECTED_PLAY_UPLOAD_SHA1" = "41097230F8DBA1DB824958C851D8284C65BA5048"

          CLASSIC_B64="$(printf '%s' "$EXPECTED_PLAY_APP_SIGNING_SHA1" | xxd -r -p | openssl base64 -A)"
          PQ_B64="$(printf '%s' "$EXPECTED_PLAY_POST_QUANTUM_SHA1" | xxd -r -p | openssl base64 -A)"
          PREVIOUS_B64="$(printf '%s' "$EXPECTED_PLAY_PREVIOUS_APP_SIGNING_SHA1" | xxd -r -p | openssl base64 -A)"
          UPLOAD_B64="$(printf '%s' "$EXPECTED_PLAY_UPLOAD_SHA1" | xxd -r -p | openssl base64 -A)"

          test "$CLASSIC_B64" = "haUulU8x36wsEGKo1k7aLZtIW0g="
          test "$PQ_B64" = "xa4oM318nc3T8JsVyR7gAV6limc="
          test "$PREVIOUS_B64" = "WS+zloPDaXssn/RIrOAGmd4iV+k="
          test "$UPLOAD_B64" = "QQlyMPjboduCSVjIUdgoTGW6UEg="

          echo "PLAY CONSOLE SIGNING IDENTITIES: CLASSICAL + POST-QUANTUM + PREVIOUS + UPLOAD = LOCKED"

      - name: Forbid upload-key redirect rewrite regression
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/azure-additive-backend-verify.yml
          ! grep -Fq 'd["redirect_uri"]="msauth://com.nikahbridge/"+h.replace' "$F"
          ! grep -Fq 're.sub(r' "$F"
          grep -Fq 'EXPECTED_PLAY_UPLOAD_SHA1: 41097230F8DBA1DB824958C851D8284C65BA5048' "$F"
          grep -Fq 'EXPECTED_PLAY_APP_SIGNING_SHA1: 85A52E954F31DFAC2C1062A8D64EDA2D9B485B48' "$F"
          grep -Fq 'PLAY APP-SIGNING MSAL REDIRECT: VERIFIED' "$F"
          echo "UPLOAD/PLAY SIGNING SEPARATION: LOCKED"

      - name: Firebase zero and 50 Activities preserved
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          COUNT="$(grep -o 'android:name="\.[A-Za-z0-9_]*Activity"' app/src/main/AndroidManifest.xml | sort -u | wc -l | tr -d ' ')"
          test "$COUNT" = "50"
          echo "FIREBASE ZERO + 50 ACTIVITIES: PASS"

  maestro-e2e:
    name: Maestro E2E Baseline
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify sign-in navigation and recovery paths
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/java/com/nikahbridge/AzureAuthManager.java
          E=app/src/main/java/com/nikahbridge/AzureExternalAuthActivity.java
          C=app/src/main/java/com/nikahbridge/AzureApiClient.java
          grep -Fq 'acquireTokenSilentAsync' "$A"
          grep -Fq 'acquireTokenInteractive' "$A"
          grep -Fq 'AZURE_INTERACTION_REQUIRED' "$A"
          grep -Fq '/api/auth/azure/me' "$E"
          grep -Fq 'Authorization' "$C"
          grep -Fq 'Bearer ' "$C"
          grep -Fq 'clearCachedToken' "$C"
          echo "MAESTRO AUTH E2E BASELINE: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: No deployment or destructive mutation in Step 3
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/step3-azure-auth-sha-master-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)|git[[:space:]]+push[[:space:]]+--force' "$F"
          echo "FORTRESS BUDGET: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore temporary runner state
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, maestro-e2e, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Roll temporary runner back
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Step 3 Locked
    needs: [master-gate, maestro-e2e, fortress-budget, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.maestro-e2e.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 3 AZURE AUTH + SHA + MSAL + 401 PROTECTION: LOCKED"
          echo "Master Gate -> Maestro E2E -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"

name: Step 1 Firebase Zero Runtime Lock

on:
  push:
    branches: [azure-backend-additive]
    paths:
      - '.github/workflows/step1-firebase-zero-runtime-lock.yml'
      - 'STEP_1_FIREBASE_ZERO_RUNTIME_LOCK.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step1-firebase-zero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master-gate:
    name: Master Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Verify Azure-only production runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d azure-backend
          test -s app/src/main/java/com/nikahbridge/AzureApiClient.java
          test -s app/src/main/java/com/nikahbridge/AzureAuthManager.java
          test -s app/src/main/java/com/nikahbridge/AzureExternalAuthActivity.java

          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e storage.rules
          test ! -e app/google-services.json
          test ! -e .github/workflows/firebase-production-deploy.yml
          test ! -e app/src/main/java/com/google/firebase/ai/GenerativeBackend.java
          test ! -e app/src/main/java/com/google/firebase/ai/GenerativeModelFutures.java

          ! grep -RInE 'FirebaseAuth|FirebaseFirestore|FirebaseFunctions|FirebaseStorage|getHttpsCallable|com\.google\.firebase' app/src/main --include='*.java' --include='*.kt'
          ! grep -RInE 'firebase-(auth|firestore|functions|storage|ai)|com\.google\.firebase|google-services' app/build.gradle build.gradle settings.gradle

          echo "FIREBASE ACTIVE RUNTIME: ZERO"
          echo "AZURE PRODUCTION RUNTIME: PASS"

  maestro-e2e-baseline:
    name: Maestro E2E Baseline
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Protect existing 42-screen surface
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(grep -o 'android:name="\.[A-Za-z0-9_]*Activity"' app/src/main/AndroidManifest.xml | wc -l | tr -d ' ')"
          test "$COUNT" -ge 42
          test -s app/src/main/java/com/nikahbridge/WelcomeActivity.java
          test -s app/src/main/java/com/nikahbridge/AzureHomeActivity.java
          test -s app/src/main/java/com/nikahbridge/CommunityChatActivity.java
          test -s app/src/main/java/com/nikahbridge/IdentityVerificationActivity.java
          test -s app/src/main/java/com/nikahbridge/PremiumPlansActivity.java
          echo "EXISTING SCREEN SURFACE PRESERVED: $COUNT activities"
          echo "MAESTRO E2E BASELINE: PASS"

  fortress-budget:
    name: Fortress Budget
    needs: master-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Ensure this cleanup gate cannot deploy or provision
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/step1-firebase-zero-runtime-lock.yml
          ! grep -Eq 'firebase[[:space:]]+deploy|gcloud[[:space:]].*(deploy|delete)|az[[:space:]].*(create|delete|deploy)' "$FILE"
          echo "FORTRESS BUDGET: PASS"

  self-healing:
    name: Self-Healing
    if: always()
    needs: [master-gate, maestro-e2e-baseline, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Restore runner workspace
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          echo "SELF-HEALING: PASS"

  auto-rollback:
    name: Auto-Rollback
    if: failure()
    needs: [master-gate, maestro-e2e-baseline, fortress-budget]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: azure-backend-additive
          fetch-depth: 1
      - name: Roll temporary workspace back
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$(git rev-parse HEAD)"
          git reset --hard "$ORIGINAL"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$ORIGINAL"
          echo "AUTO-ROLLBACK SAFETY: PASS"

  locked:
    name: Step 1 Firebase Zero Locked
    needs: [master-gate, maestro-e2e-baseline, fortress-budget, self-healing]
    if: ${{ always() && needs.master-gate.result == 'success' && needs.maestro-e2e-baseline.result == 'success' && needs.fortress-budget.result == 'success' && needs.self-healing.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "STEP 1 FIREBASE ZERO RUNTIME: LOCKED"
          echo "Master Gate -> Maestro E2E Baseline -> Self-Healing -> Auto-Rollback safety -> Fortress Budget"

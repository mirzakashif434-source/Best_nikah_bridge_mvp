name: Create Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore best-nikah-bridge-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias best-nikah-bridge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Best Nikah Bridge, OU=Android, O=Best Nikah Bridge, L=Jeddah, ST=Makkah, C=SA"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: best-nikah-bridge-release-keystore
          path: best-nikah-bridge-release.jks
